- cat: オブジェクト指向
  topic: アクセス制御
  q: 次のコードの後で、エラーにならずに実行できるものを2つ選択してください。
  code: |
    class Foo
      def pub; end
      private
      def pri; end
      protected
      def pro; end
    end
    obj = Foo.new
  choices: ['obj.pub', 'obj.pri', 'obj.pro', 'obj.send(:pri)']
  answer: [0, 3]
  cm: true
  verify: checks
  checks:
    - 'obj.pub'
    - 'obj.pri'
    - 'obj.pro'
    - 'obj.send(:pri)'
  exp: |
    - `public` … どこからでも呼べます。
    - `private` … レシーバを付けて外から呼べません（`obj.pri` は `NoMethodError`）。
    - `protected` … 同じクラス（サブクラス）のメソッドの中からだけレシーバ付きで呼べます。クラスの外からの `obj.pro` は `NoMethodError` です。

    `send` はアクセス制御を無視して呼び出せるので、`obj.send(:pri)` は実行できます。外から private メソッドを呼べないようにしたいときは、`public_send` を使います。

- cat: オブジェクト指向
  topic: クラスメソッドにするMix-in
  q: クラス `C` の定義の中に次のいずれかを書いたとき、`C.hello` とクラスメソッドとして呼び出せるものを2つ選択してください。
  code: |
    module M
      def hello
        "hello"
      end
    end
  choices: ['extend M', 'include M', 'prepend M', 'class << self; include M; end']
  answer: [0, 3]
  cm: true
  verify: checks
  checks:
    - 'class C; extend M; end; C.hello'
    - 'class C; include M; end; C.hello'
    - 'class C; prepend M; end; C.hello'
    - 'class C; class << self; include M; end; end; C.hello'
  exp: |
    `extend M` は、モジュールのメソッドを**クラスの特異メソッド**（＝クラスメソッド）として追加します。`class << self; include M; end` も、クラスの特異クラスに `include` するので、同じ結果になります。

    `include M` と `prepend M` は**インスタンスメソッド**として取り込むので、`C.new.hello` なら呼べますが `C.hello` は `NoMethodError` です。

- cat: オブジェクト指向
  topic: superに渡される引数
  q: 次のコードを実行するとどうなりますか。
  code: |
    class Parent
      def show(a, b = 2)
        puts "#{a}:#{b}"
      end
    end
    class Child < Parent
      def show(a, b = 5)
        super
        super(a)
      end
    end
    Child.new.show(1)
  choices:
    - |-
      1:5
      1:2
    - |-
      1:2
      1:2
    - |-
      1:5
      1:5
    - |-
      1:2
      1:5
  answer: [0]
  verify: output
  exp: |
    引数なしの `super`（括弧なし）は、**今のメソッドの引数の現在の値**をそのまま親に渡します。`b` は省略されたので既定値 `5` が入っていて、親には `(1, 5)` が渡されます。

    `super(a)` のように引数を明示すると、渡した引数だけが親に渡るので、親の `b` は親側の既定値 `2` になります。なお `super()`（空の括弧）は「引数なし」で呼びます。

- cat: オブジェクト指向
  topic: is_a? と instance_of?
  q: 次のうち、`true` を返す式を2つ選択してください。
  choices: ['5.is_a?(Numeric)', '5.instance_of?(Numeric)', '"a".is_a?(Integer)', 'nil.instance_of?(NilClass)']
  answer: [0, 3]
  cm: true
  verify: checks
  checks:
    - 'exit(5.is_a?(Numeric))'
    - 'exit(5.instance_of?(Numeric))'
    - 'exit("a".is_a?(Integer))'
    - 'exit(nil.instance_of?(NilClass))'
  exp: |
    - `is_a?`（`kind_of?`）… そのクラス、または**祖先のクラス・モジュール**のインスタンスなら `true`。
    - `instance_of?` … **そのクラスそのもの**のインスタンスのときだけ `true`（継承は考えません）。

    `5` は `Integer` のインスタンスで、`Integer` の親が `Numeric` です。そのため `5.is_a?(Numeric)` は `true`、`5.instance_of?(Numeric)` は `false` になります。

- cat: オブジェクト指向
  topic: Comparableで使えるメソッド
  q: 次のコードの後で、エラーにならずに実行できるものを3つ選択してください。
  code: |
    class Ver
      include Comparable
      attr_reader :n
      def initialize(n)
        @n = n
      end
      def <=>(other)
        n <=> other.n
      end
    end
    a, b, c = Ver.new(1), Ver.new(2), Ver.new(3)
  choices: ['a < b', 'b.between?(a, c)', 'b.clamp(a, c)', 'a.each { }']
  answer: [0, 1, 2]
  cm: true
  verify: checks
  checks:
    - 'a < b'
    - 'b.between?(a, c)'
    - 'b.clamp(a, c)'
    - 'a.each { }'
  exp: |
    `Comparable` をインクルードして `<=>` を定義すると、`<`、`<=`、`>`、`>=`、`==`、`between?`、`clamp` が使えるようになります。

    `each` は `Enumerable`（またはクラス自身）が提供するメソッドで、`Comparable` とは関係がないので `NoMethodError` になります。
