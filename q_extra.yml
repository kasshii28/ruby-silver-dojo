- cat: 組み込みライブラリ
  topic: ファイルを1行ずつ読む
  q: ファイル `data.txt` を1行ずつ処理できるものを2つ選択してください。
  choices:
    - '`File.foreach("data.txt") { |line| ... }`'
    - '`File.read("data.txt") { |line| ... }`'
    - '`File.open("data.txt") { |f| f.each_line { |line| ... } }`'
    - '`File.readlines("data.txt") { |line| ... }`'
  answer: [0, 2]
  verify: checks
  checks:
    - |
      File.write("data.txt", "a\nb\n")
      c = 0
      File.foreach("data.txt") { |line| c += 1 }
      exit(c == 2)
    - |
      File.write("data.txt", "a\nb\n")
      c = 0
      File.read("data.txt") { |line| c += 1 }
      exit(c == 2)
    - |
      File.write("data.txt", "a\nb\n")
      c = 0
      File.open("data.txt") { |f| f.each_line { |line| c += 1 } }
      exit(c == 2)
    - |
      File.write("data.txt", "a\nb\n")
      c = 0
      File.readlines("data.txt") { |line| c += 1 }
      exit(c == 2)
  exp: |
    1行ずつブロックに渡せるのは `File.foreach` と、開いたファイルの `each_line`（`IO#each_line`）です。

    `File.read` は全体を1つの文字列で、`File.readlines` は全行の配列で返すメソッドで、ブロックを渡しても1行ずつ呼び出されることはありません（ブロックは無視されます）。

