    1回目の `gets` で `"1\n"`、`rewind` で先頭に戻り、2回目の `gets` でもう一度 `"1\n"` が返ります。その後の `read` は、現在位置（2行目の先頭）から最後までを返すので `"2\n3\n"` です。

