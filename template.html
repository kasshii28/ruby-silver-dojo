<title>Ruby Silver 道場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one exam-sheet column. Header → progress → question sheet → choices → verdict + explanation → nav. */
:root {
  --bg: #f6f4f5;
  --surface: #ffffff;
  --fg: #1f1b1e;
  --muted: #6c6468;
  --line: #e2dcdf;
  --ruby: #a3123a;
  --ok: #157656;
  --ok-bg: #e7f3ed;
  --ng-bg: #fbe9ee;
  --code-bg: #faf8f9;
  --chip: #efebed;
  --hl-kw: #a3123a;
  --hl-str: #2f6b2f;
  --hl-num: #8a4b00;
  --hl-com: #8b8287;
  --hl-sym: #6b3fa0;
  --hl-const: #0f5e8c;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  --font-code: "JetBrains Mono", "BIZ UDGothic", "Osaka-Mono", "MS Gothic", ui-monospace, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141215; --surface: #1c191d; --fg: #ece7ea; --muted: #a59da1; --line: #322d31;
    --ruby: #ff6582; --ok: #4cc896; --ok-bg: #13281f; --ng-bg: #2d1419; --code-bg: #120f12; --chip: #2a2529;
    --hl-kw: #ff7a93; --hl-str: #9bd68e; --hl-num: #f0b46a; --hl-com: #847a80; --hl-sym: #c7a4f5; --hl-const: #7cc4f0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141215; --surface: #1c191d; --fg: #ece7ea; --muted: #a59da1; --line: #322d31;
  --ruby: #ff6582; --ok: #4cc896; --ok-bg: #13281f; --ng-bg: #2d1419; --code-bg: #120f12; --chip: #2a2529;
  --hl-kw: #ff7a93; --hl-str: #9bd68e; --hl-num: #f0b46a; --hl-com: #847a80; --hl-sym: #c7a4f5; --hl-const: #7cc4f0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
code, pre, .mono { font-family: var(--font-code); }

/* header */
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 4px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-size: 20px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
.gem { width: 14px; height: 14px; background: var(--ruby); clip-path: polygon(50% 100%, 0 38%, 22% 6%, 78% 6%, 100% 38%); flex: none; }
.brand small { color: var(--muted); font-size: 12px; }
.tools { display: flex; gap: 8px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 7px 14px; font-size: 14px; cursor: pointer; line-height: 1.4;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 700; }
.btn.primary:hover { opacity: .9; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; }

/* progress */
.progress { display: flex; flex-direction: column; gap: 6px; }
.progress-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.progress-row b { color: var(--fg); font-family: var(--font-code); font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--fg); width: 0; transition: width .25s ease; }

/* question sheet */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 22px 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.qhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.qno { font-family: var(--font-code); font-weight: 600; font-size: 15px; }
.tag { font-size: 12px; background: var(--chip); border-radius: 4px; padding: 2px 8px; color: var(--muted); }
.tag.multi { background: var(--fg); color: var(--bg); font-weight: 700; }
.qtext { margin: 0; font-size: 17px; text-wrap: pretty; }
.blank { display: inline-block; font-family: var(--font-code); font-size: .9em; border: 1.5px solid currentColor; border-radius: 4px; padding: 0 .45em; line-height: 1.5; margin: 0 2px; }
.code { display: flex; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; font-size: 14px; line-height: 1.65; }
.code pre { margin: 0; padding: 12px 14px; white-space: pre; }
.code .ln { color: var(--hl-com); text-align: right; user-select: none; padding-right: 10px; border-right: 1px solid var(--line); position: sticky; left: 0; background: var(--code-bg); }
.code .src { flex: 1; min-width: 0; }
.result-box { display: flex; flex-direction: column; gap: 4px; }
.result-box .label { font-size: 13px; color: var(--muted); }
.result-box pre { margin: 0; background: var(--code-bg); border: 1px dashed var(--line); border-radius: 8px; padding: 10px 14px; font-size: 14px; overflow-x: auto; }

/* hljs tokens */
.hljs-keyword, .hljs-built_in, .hljs-literal { color: var(--hl-kw); }
.hljs-string, .hljs-regexp, .hljs-subst .hljs-string { color: var(--hl-str); }
.hljs-subst { color: var(--fg); }
.hljs-number { color: var(--hl-num); }
.hljs-comment { color: var(--hl-com); font-style: italic; }
.hljs-symbol { color: var(--hl-sym); }
.hljs-title, .hljs-title.class_, .hljs-type { color: var(--hl-const); }
.hljs-variable, .hljs-params { color: inherit; }

/* choices */
.choices { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.choice {
  width: 100%; display: grid; grid-template-columns: 30px 1fr auto; align-items: start; gap: 12px;
  text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px;
  padding: 11px 14px; cursor: pointer; transition: border-color .12s ease, background .12s ease;
}
.choice:hover:not(:disabled) { border-color: var(--muted); }
.choice:disabled { cursor: default; }
.choice .key { font-family: var(--font-code); font-weight: 600; font-size: 14px; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; line-height: 1; }
.choice .body { min-width: 0; padding-top: 2px; }
.choice pre { margin: 0; font-size: 14px; line-height: 1.6; white-space: pre; overflow-x: auto; }
.choice .prose { font-size: 15px; line-height: 1.65; }
.choice .mark { font-size: 13px; font-weight: 700; padding-top: 4px; white-space: nowrap; }
.choice.picked { border-color: var(--fg); }
.choice.picked .key { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.choice.right { border-color: var(--ok); background: var(--ok-bg); }
.choice.right .key { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.choice.right .mark { color: var(--ok); }
.choice.wrong { border-color: var(--ruby); background: var(--ng-bg); }
.choice.wrong .key { background: var(--ruby); border-color: var(--ruby); color: var(--surface); }
.choice.wrong .mark { color: var(--ruby); }
.choice.dim { opacity: .6; }
.submit-row { display: flex; justify-content: flex-end; }

/* verdict & explanation */
.verdict { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-radius: 8px; padding: 12px 16px; }
.verdict.ok { background: var(--ok-bg); color: var(--ok); }
.verdict.ng { background: var(--ng-bg); color: var(--ruby); }
.verdict strong { font-size: 18px; }
.verdict span { color: var(--fg); font-size: 14px; }
.exp { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.exp h3 { margin: 0; font-size: 14px; letter-spacing: .08em; color: var(--muted); }
.exp p, .exp ul, .exp ol { margin: 0; max-width: 65ch; }
.exp ul, .exp ol { padding-left: 1.4em; display: flex; flex-direction: column; gap: 2px; }
.exp :not(pre) > code, .prose code, .qtext code { font-size: .88em; background: var(--chip); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.exp pre { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 14px; overflow-x: auto; }

/* nav */
nav.qnav { display: flex; justify-content: space-between; gap: 8px; }
.kbd-hint { font-size: 12px; color: var(--muted); text-align: center; }
@media (hover: none) { .kbd-hint { display: none; } }

/* summary */
.summary { display: flex; flex-direction: column; gap: 18px; }
.summary h2 { margin: 0; font-size: 20px; text-wrap: balance; }
.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.score .big { font-family: var(--font-code); font-size: 44px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.score .of { color: var(--muted); }
.gauge { position: relative; height: 10px; background: var(--line); border-radius: 5px; }
.gauge i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--fg); }
.gauge i.pass { background: var(--ok); }
.gauge .line { position: absolute; top: -6px; bottom: -6px; left: 75%; width: 2px; background: var(--ruby); }
.gauge-labels { position: relative; height: 18px; font-size: 12px; color: var(--muted); }
.gauge-labels span { position: absolute; left: 75%; transform: translateX(-50%); white-space: nowrap; }
.wrong-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.wrong-list button { width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; cursor: pointer; display: flex; gap: 12px; font-size: 14px; }
.wrong-list .n { font-family: var(--font-code); font-weight: 600; color: var(--ruby); min-width: 44px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* dialogs */
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog::backdrop { background: rgb(0 0 0 / .35); }
.dlg { padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 18px; }
.dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.dlg-head h2 { margin: 0; font-size: 18px; }
fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
legend { font-size: 13px; font-weight: 700; color: var(--muted); padding: 0; margin-bottom: 8px; letter-spacing: .04em; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 14px; }
.opt:has(input:checked) { border-color: var(--fg); background: var(--chip); }
.opt input { accent-color: var(--fg); margin: 0; }
.opt .cnt { color: var(--muted); font-family: var(--font-code); font-size: 12px; }
.dlg-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; }
.dlg-foot .count { font-size: 14px; color: var(--muted); }
.dlg-foot .count b { color: var(--fg); font-family: var(--font-code); }
.stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.stats b { color: var(--fg); font-family: var(--font-code); font-size: 15px; font-variant-numeric: tabular-nums; }
.grid-cat { display: flex; flex-direction: column; gap: 8px; }
.grid-cat h3 { margin: 0; font-size: 13px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.cell { font-family: var(--font-code); font-size: 13px; font-variant-numeric: tabular-nums; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; height: 36px; cursor: pointer; }
.cell.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.cell.ng { background: var(--ng-bg); border-color: var(--ruby); color: var(--ruby); }
.cell.cur { outline: 2px solid var(--fg); outline-offset: 1px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; border: 1px solid var(--line); vertical-align: -1px; margin-right: 4px; }
.legend i.ok { background: var(--ok-bg); border-color: var(--ok); }
.legend i.ng { background: var(--ng-bg); border-color: var(--ruby); }
.danger { color: var(--ruby); border-color: var(--line); }
.danger.armed { background: var(--ruby); color: var(--surface); border-color: var(--ruby); }

footer { font-size: 12px; color: var(--muted); line-height: 1.7; padding-top: 8px; }
.empty { text-align: center; color: var(--muted); padding: 24px 0; }

@media (max-width: 480px) {
  .sheet { padding: 18px 14px 20px; }
  .qtext { font-size: 16px; }
  .choice { grid-template-columns: 26px 1fr; padding: 10px 12px; gap: 10px; }
  .choice .key { width: 26px; height: 26px; font-size: 13px; }
  .choice .mark { grid-column: 2; padding-top: 0; }
  .code { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1><span class="gem" aria-hidden="true"></span>Ruby Silver 道場</h1>
      <small>Silver version 3（Ruby 3.1）対応・全<span id="total"></span>問</small>
    </div>
    <div class="tools">
      <button class="btn" id="open-list" type="button">問題一覧</button>
      <button class="btn" id="open-settings" type="button">出題設定</button>
    </div>
  </header>

  <div class="progress" id="progress">
    <div class="progress-row">
      <span>この回 <b id="pos"></b></span>
      <span>正解 <b id="sc-ok">0</b> ／ 回答 <b id="sc-done">0</b></span>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <main id="main"></main>

  <footer>
    問題はすべてこのサイトのオリジナルです。コードは実際に Ruby で実行し、正解が実行結果と一致することを確かめています（試験の対象は Ruby 3.1、確認は Ruby 3.3）。本試験は 50 問・90 分・正答率 75% で合格です。学習記録はこのブラウザにだけ保存されます。
  </footer>
</div>

<dialog id="dlg-settings" aria-labelledby="set-title">
  <form class="dlg" id="settings-form" method="dialog">
    <div class="dlg-head">
      <h2 id="set-title">出題設定</h2>
      <button class="btn ghost" type="button" data-close>閉じる</button>
    </div>
    <fieldset>
      <legend>分野</legend>
      <div class="opts" id="opt-cats"></div>
    </fieldset>
    <fieldset>
      <legend>出題する問題</legend>
      <div class="opts">
        <label class="opt"><input type="radio" name="target" id="t-all" value="all"> すべて <span class="cnt" data-cnt="all"></span></label>
        <label class="opt"><input type="radio" name="target" id="t-new" value="new"> 未回答だけ <span class="cnt" data-cnt="new"></span></label>
        <label class="opt"><input type="radio" name="target" id="t-ng" value="ng"> 前回まちがえた問題だけ <span class="cnt" data-cnt="ng"></span></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>順番</legend>
      <div class="opts">
        <label class="opt"><input type="radio" name="order" id="o-seq" value="seq"> 番号順</label>
        <label class="opt"><input type="radio" name="order" id="o-rand" value="rand"> ランダム</label>
        <label class="opt"><input type="checkbox" id="o-shuffle"> 選択肢も並べ替える</label>
      </div>

    <div class="dlg-foot">
      <span class="count">この条件で <b id="set-count">0</b> 問</span>
      <button class="btn primary" type="submit" id="start">この条件で始める</button>

  </form>
</dialog>

<dialog id="dlg-list" aria-labelledby="list-title">
  <div class="dlg">
    <div class="dlg-head">
      <h2 id="list-title">問題一覧</h2>
      <button class="btn ghost" type="button" data-close>閉じる</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="legend"><span><i></i>未回答</span><span><i class="ok"></i>前回正解</span><span><i class="ng"></i>前回不正解</span></div>
    <div id="grid" class="dlg" style="padding:0"></div>
    <div class="dlg-foot">
      <span class="count">番号を押すとその問題へ移動します</span>
      <button class="btn danger" type="button" id="reset">学習記録をリセット</button>
    </div>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const QUESTIONS = /*__DATA__*/[];
const CATS = ["文法", "組み込みライブラリ", "オブジェクト指向"];
const KEYS = ["A", "B", "C", "D", "E", "F"];
const byId = new Map(QUESTIONS.map(q => [q.id, q]));

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let hist = store.get("rs-hist", {});          // id -> { ok, n, c }
let settings = Object.assign({ cats: CATS.slice(), target: "all", order: "seq", shuffle: false }, store.get("rs-settings", {}));
let session = store.get("rs-session", null);  // { ids, i, ans: {id:{sel,ok}}, perm: {id:[...]}}
let picked = [];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const BLANK = "__(1)__";
const BLANK_HTML = '<span class="blank">(1)</span>';

function inline(s) {
  // escape, then `code`, **bold**, __(1)__
  let out = "";
  const parts = String(s).split(/(`[^`]+`)/);
  for (const p of parts) {
    if (p.startsWith("`") && p.endsWith("`") && p.length > 1) out += "<code>" + esc(p.slice(1, -1)) + "</code>";
    else out += esc(p).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").split(esc(BLANK)).join(BLANK_HTML);
  }
  return out;
}
function highlight(code) {
  const marker = "zzblankzz";
  const src = code.split(BLANK).join(marker);
  let html;
  try { html = window.hljs ? hljs.highlight(src, { language: "ruby", ignoreIllegals: true }).value : esc(src); }
  catch (e) { html = esc(src); }
  return html.split(marker).join(BLANK_HTML);
}
function codeBlock(code) {
  const text = code.replace(/\n$/, "");
  const n = text.split("\n").length;
  const nums = Array.from({ length: n }, (_, i) => i + 1).join("\n");
  return `<div class="code"><pre class="ln" aria-hidden="true">${nums}</pre><pre class="src"><code>${highlight(text)}</code></pre></div>`;
}
function md(text) {
  const lines = String(text).replace(/\n+$/, "").split("\n");
  let html = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (l.startsWith("```")) {
      const buf = []; i++;
      while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
      i++;
      html += `<pre><code>${highlight(buf.join("\n"))}</code></pre>`;
    } else if (/^- /.test(l)) {
      const items = [];
      while (i < lines.length && /^- /.test(lines[i])) items.push(lines[i++].slice(2));
      html += "<ul>" + items.map(t => `<li>${inline(t)}</li>`).join("") + "</ul>";
    } else if (/^\d+\. /.test(l)) {
      const items = [];
      while (i < lines.length && /^\d+\. /.test(lines[i])) items.push(lines[i++].replace(/^\d+\. /, ""));
      html += "<ol>" + items.map(t => `<li>${inline(t)}</li>`).join("") + "</ol>";
    } else if (l.trim() === "") { i++; }
    else {
      const buf = [];
      while (i < lines.length && lines[i].trim() !== "" && !/^(- |\d+\. |```)/.test(lines[i])) buf.push(lines[i++]);
      html += `<p>${inline(buf.join(""))}</p>`;
    }
  }
  return html;
}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function sameSet(a, b) { return a.length === b.length && a.every(x => b.includes(x)); }

function filtered(s) {
  return QUESTIONS.filter(q => s.cats.includes(q.cat)).filter(q => {
    const h = hist[q.id];
    if (s.target === "new") return !h;
    if (s.target === "ng") return h && !h.ok;
    return true;
  });
}
function newSession(ids, startIndex = 0) {
  const perm = {};
  ids.forEach(id => { const q = byId.get(id); perm[id] = settings.shuffle ? shuffle(q.choices.map((_, k) => k)) : q.choices.map((_, k) => k); });
  session = { ids, i: startIndex, ans: {}, perm };
  save();
}
function startFromSettings() {
  let ids = filtered(settings).map(q => q.id);
  if (settings.order === "rand") ids = shuffle(ids);
  newSession(ids);
  render();
}
function save() { store.set("rs-session", session); store.set("rs-hist", hist); store.set("rs-settings", settings); }

// ---------- rendering ----------
function renderProgress() {
  const total = session.ids.length;
  const done = Object.keys(session.ans).length;
  const ok = Object.values(session.ans).filter(a => a.ok).length;
  const finished = session.i >= total;
  $("#pos").textContent = finished ? `${total} / ${total}` : `${session.i + 1} / ${total}`;
  $("#sc-ok").textContent = ok;
  $("#sc-done").textContent = done;
  $("#bar").style.width = total ? (Math.min(session.i + (finished ? 0 : 1), total) / total * 100) + "%" : "0";
}

function render() {
  if (!session || !session.ids.length) { renderEmpty(); return; }
  renderProgress();
  if (session.i >= session.ids.length) { renderSummary(); return; }
  const q = byId.get(session.ids[session.i]);
  const a = session.ans[q.id];
  picked = a ? a.sel.slice() : [];
  const multi = q.answer.length > 1;
  const order = session.perm[q.id] || q.choices.map((_, k) => k);

  let html = `<article class="sheet" aria-labelledby="qt">
    <div class="qhead"><span class="qno">問 ${q.id}</span><span class="tag">${esc(q.cat)}</span><span class="tag">${esc(q.topic)}</span>${multi ? `<span class="tag multi">${q.answer.length}つ選択</span>` : ""}</div>
    <p class="qtext" id="qt">${inline(q.q)}</p>`;
  if (q.code) html += codeBlock(q.code);
  if (q.result != null) html += `<div class="result-box"><span class="label">〔実行結果〕</span><pre>${esc(q.result)}</pre></div>`;
  html += `<ol class="choices" id="choices">`;
  order.forEach((orig, pos) => {
    const text = q.choices[orig];
    const prose = !q.cm || text.startsWith("!");
    const body = prose ? `<div class="prose">${inline(text.replace(/^!/, ""))}</div>` : `<pre>${esc(text)}</pre>`;
    html += `<li><button type="button" class="choice" data-orig="${orig}" data-pos="${pos}"><span class="key">${KEYS[pos]}</span><span class="body">${body}</span><span class="mark"></span></button></li>`;
  });
  html += `</ol>`;
  if (multi) html += `<div class="submit-row" id="submit-row"><button class="btn primary" type="button" id="submit" disabled>解答する</button></div>`;
  html += `<div id="feedback"></div></article>
    <nav class="qnav">
      <button class="btn" type="button" id="prev" ${session.i === 0 ? "disabled" : ""}>← 前の問題</button>
      <button class="btn ${a ? "primary" : ""}" type="button" id="next">${session.i === session.ids.length - 1 ? "結果を見る" : "次の問題 →"}</button>
    </nav>
    <p class="kbd-hint">キーボード：A〜${KEYS[q.choices.length - 1]} または 1〜${q.choices.length} で選択 ／ Enter で解答・次へ ／ ← → で移動</p>`;
  $("#main").innerHTML = html;

  $("#choices").addEventListener("click", e => {
    const b = e.target.closest(".choice"); if (!b || b.disabled) return;
    choose(q, +b.dataset.orig);
  });
  if (multi) $("#submit").addEventListener("click", () => submit(q));
  $("#prev").addEventListener("click", () => go(-1));
  $("#next").addEventListener("click", () => go(1));
  if (a) showResult(q, a); else paintPicked(q);
}

function paintPicked(q) {
  document.querySelectorAll("#choices .choice").forEach(b => b.classList.toggle("picked", picked.includes(+b.dataset.orig)));
  const s = $("#submit");
  if (s) { s.disabled = picked.length !== q.answer.length; s.textContent = picked.length === q.answer.length ? "解答する" : `解答する（あと${q.answer.length - picked.length}つ選んでください）`; if (picked.length > q.answer.length) s.textContent = `${q.answer.length}つまで選べます`; }
}

function choose(q, orig) {
  if (session.ans[q.id]) return;
  if (q.answer.length === 1) { picked = [orig]; submit(q); return; }
  picked = picked.includes(orig) ? picked.filter(x => x !== orig) : picked.concat(orig);
  paintPicked(q);
}

function submit(q) {
  if (session.ans[q.id] || picked.length !== q.answer.length) return;
  const ok = sameSet(picked, q.answer);
  session.ans[q.id] = { sel: picked.slice(), ok };
  const h = hist[q.id] || { n: 0, c: 0 };
  hist[q.id] = { ok, n: h.n + 1, c: h.c + (ok ? 1 : 0) };
  save();
  renderProgress();
  showResult(q, session.ans[q.id]);
  const nx = $("#next"); nx.classList.add("primary");
  $("#feedback").scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}

function showResult(q, a) {
  const order = session.perm[q.id] || q.choices.map((_, k) => k);
  document.querySelectorAll("#choices .choice").forEach(b => {
    const orig = +b.dataset.orig;
    const isAns = q.answer.includes(orig), isSel = a.sel.includes(orig);
    b.disabled = true;
    b.classList.remove("picked");
    if (isAns) { b.classList.add("right"); b.querySelector(".mark").textContent = isSel ? "○ 正解" : "正解"; }
    else if (isSel) { b.classList.add("wrong"); b.querySelector(".mark").textContent = "× あなたの解答"; }
    else b.classList.add("dim");
  });
  const sr = $("#submit-row"); if (sr) sr.hidden = true;
  const letters = q.answer.map(o => KEYS[order.indexOf(o)]).sort().join("・");
  const h = hist[q.id];
  const record = h && h.n > 1 ? `これまで ${h.n} 回中 ${h.c} 回正解` : "";
  $("#feedback").innerHTML = `
    <div class="verdict ${a.ok ? "ok" : "ng"}" role="status"><strong>${a.ok ? "○ 正解" : "× 不正解"}</strong><span>正解は ${letters}${record ? "　" + record : ""}</span></div>
    <section class="exp"><h3>解説</h3>${md(q.exp)}</section>`;
}

function go(d) {
  const ni = session.i + d;
  if (ni < 0 || ni > session.ids.length) return;
  session.i = ni; save(); render();
  window.scrollTo({ top: 0 });
}

function renderSummary() {
  const total = session.ids.length;
  const answered = session.ids.filter(id => session.ans[id]);
  const ok = answered.filter(id => session.ans[id].ok).length;
  const pct = total ? Math.round(ok / total * 100) : 0;
  const wrong = session.ids.filter(id => session.ans[id] && !session.ans[id].ok);
  const skipped = total - answered.length;
  let html = `<section class="sheet summary">
    <h2>${pct >= 75 ? "合格ラインに届いています" : "合格ラインまであと少し"}</h2>
    <div class="score"><span class="big">${pct}%</span><span class="of">${total} 問中 ${ok} 問正解${skipped ? `（未回答 ${skipped} 問）` : ""}</span></div>
    <div><div class="gauge"><i class="${pct >= 75 ? "pass" : ""}" style="width:${pct}%"></i><span class="line"></span></div><div class="gauge-labels"><span>合格ライン 75%</span></div></div>`;
  if (wrong.length) {
    html += `<div class="grid-cat"><h3>まちがえた問題（${wrong.length}問）</h3><ul class="wrong-list">` +
      wrong.map(id => { const q = byId.get(id); return `<li><button type="button" data-jump="${id}"><span class="n">問 ${id}</span><span>${esc(q.cat)}・${esc(q.topic)}</span></button></li>`; }).join("") + `</ul></div>`;
  }
  html += `<div class="actions">
      ${wrong.length ? `<button class="btn primary" type="button" id="retry-ng">まちがえた ${wrong.length} 問を解き直す</button>` : ""}
      <button class="btn ${wrong.length ? "" : "primary"}" type="button" id="again">同じ問題をもう一度</button>
      <button class="btn" type="button" id="to-settings">出題設定を変える</button>
    </div></section>`;
  $("#main").innerHTML = html;
  const r = $("#retry-ng"); if (r) r.addEventListener("click", () => { newSession(wrong); render(); });
  $("#again").addEventListener("click", () => { newSession(settings.order === "rand" ? shuffle(session.ids) : session.ids); render(); });
  $("#to-settings").addEventListener("click", openSettings);
  $("#main").querySelectorAll("[data-jump]").forEach(b => b.addEventListener("click", () => jumpTo(+b.dataset.jump)));
}

function renderEmpty() {
  $("#pos").textContent = "0 / 0"; $("#sc-ok").textContent = 0; $("#sc-done").textContent = 0; $("#bar").style.width = "0";
  $("#main").innerHTML = `<section class="sheet"><p class="empty">この条件に合う問題がありません。出題設定で分野や対象を変えてください。</p><div class="actions" style="justify-content:center"><button class="btn primary" type="button" id="to-settings">出題設定を開く</button></div></section>`;
  $("#to-settings").addEventListener("click", openSettings);
}

function jumpTo(id) {
  closeAll();
  const idx = session ? session.ids.indexOf(id) : -1;
  if (idx >= 0) { session.i = idx; save(); }
  else { newSession(QUESTIONS.map(q => q.id), QUESTIONS.findIndex(q => q.id === id)); }
  render(); window.scrollTo({ top: 0 });
}

// ---------- dialogs ----------
function closeAll() { document.querySelectorAll("dialog[open]").forEach(d => d.close()); }
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => b.closest("dialog").close()));
document.querySelectorAll("dialog").forEach(d => d.addEventListener("click", e => { if (e.target === d) d.close(); }));

function readForm() {
  return {
    cats: CATS.filter((c, i) => $("#cat-" + i).checked),
    target: document.querySelector('input[name="target"]:checked').value,
    order: document.querySelector('input[name="order"]:checked').value,
    shuffle: $("#o-shuffle").checked
  };
}
function updateCounts() {
  const s = readForm();
  $("#set-count").textContent = filtered(s).length;
  $("#start").disabled = filtered(s).length === 0;
  ["all", "new", "ng"].forEach(t => { document.querySelector(`[data-cnt="${t}"]`).textContent = filtered({ ...s, target: t }).length; });
}
function openSettings() {
  $("#opt-cats").innerHTML = CATS.map((c, i) => `<label class="opt"><input type="checkbox" id="cat-${i}" ${settings.cats.includes(c) ? "checked" : ""}> ${c} <span class="cnt">${QUESTIONS.filter(q => q.cat === c).length}</span></label>`).join("");
  $("#t-" + settings.target).checked = true;
  $(settings.order === "rand" ? "#o-rand" : "#o-seq").checked = true;
  $("#o-shuffle").checked = !!settings.shuffle;
  updateCounts();
  $("#dlg-settings").showModal();
}
$("#settings-form").addEventListener("change", updateCounts);
$("#settings-form").addEventListener("submit", e => {
  e.preventDefault();
  settings = readForm();
  $("#dlg-settings").close();
  startFromSettings();
  window.scrollTo({ top: 0 });
});
$("#open-settings").addEventListener("click", openSettings);

function openList() {
  const vals = Object.values(hist);
  const done = vals.length, ok = vals.filter(h => h.ok).length;
  $("#stats").innerHTML = `<span>回答済み <b>${done}</b> / ${QUESTIONS.length}</span><span>前回正解 <b>${ok}</b></span><span>前回不正解 <b>${done - ok}</b></span>`;
  const cur = session && session.i < session.ids.length ? session.ids[session.i] : null;
  $("#grid").innerHTML = CATS.map(c => `<div class="grid-cat"><h3>${c}</h3><div class="grid">` +
    QUESTIONS.filter(q => q.cat === c).map(q => { const h = hist[q.id]; return `<button type="button" class="cell ${h ? (h.ok ? "ok" : "ng") : ""} ${q.id === cur ? "cur" : ""}" data-jump="${q.id}" aria-label="問${q.id} ${h ? (h.ok ? "前回正解" : "前回不正解") : "未回答"}">${q.id}</button>`; }).join("") +
    `</div></div>`).join("");
  $("#dlg-list").showModal();
}
$("#grid").addEventListener("click", e => { const b = e.target.closest("[data-jump]"); if (b) jumpTo(+b.dataset.jump); });
$("#open-list").addEventListener("click", openList);

let armTimer;
$("#reset").addEventListener("click", () => {
  const b = $("#reset");
  if (!b.classList.contains("armed")) {
    b.classList.add("armed"); b.textContent = "もう一度押すとリセット";
    clearTimeout(armTimer); armTimer = setTimeout(() => { b.classList.remove("armed"); b.textContent = "学習記録をリセット"; }, 4000);
    return;
  }
  clearTimeout(armTimer);
  hist = {}; settings.target = "all"; newSession(QUESTIONS.map(q => q.id));
  b.classList.remove("armed"); b.textContent = "学習記録をリセット";
  closeAll(); render();
});

// ---------- keyboard ----------
document.addEventListener("keydown", e => {
  if (document.querySelector("dialog[open]") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (!session || session.i >= session.ids.length) return;
  const q = byId.get(session.ids[session.i]);
  const k = e.key.toUpperCase();
  let pos = KEYS.indexOf(k);
  if (pos < 0 && /^[1-9]$/.test(e.key)) pos = +e.key - 1;
  if (pos >= 0 && pos < q.choices.length) {
    const b = document.querySelector(`#choices .choice[data-pos="${pos}"]`);
    if (b && !b.disabled) { e.preventDefault(); choose(q, +b.dataset.orig); }
  } else if (e.key === "Enter") {
    if (e.target.closest && e.target.closest("button")) return;
    e.preventDefault();
    if (!session.ans[q.id] && q.answer.length > 1) submit(q); else if (session.ans[q.id]) go(1);
  } else if (e.key === "ArrowRight") { go(1); }
  else if (e.key === "ArrowLeft") { go(-1); }
});

// ---------- boot ----------
$("#total").textContent = QUESTIONS.length;
if (!session || !Array.isArray(session.ids) || session.ids.some(id => !byId.has(id))) newSession(QUESTIONS.map(q => q.id));
render();
</script>
