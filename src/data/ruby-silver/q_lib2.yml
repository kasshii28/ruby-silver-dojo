- cat: 組み込みライブラリ
  topic: then / tap
  q: 次のコードを実行するとどうなりますか。
  code: |
    r = 5.then { |x| x * 2 }
    a = [1].tap { |arr| arr << 2 }
    b = [1].tap { |arr| arr + [2] }
    p r, a, b
  choices: ["10\n[1, 2]\n[1]", "5\n[1, 2]\n[1, 2]", "10\n[1, 2]\n[1, 2]", "10\n[1]\n[1]"]
  answer: [0]
  verify: output
  exp: |
    `then`（別名 `yield_self`）はブロックの戻り値を返します。

    `tap` はブロックを実行したうえで、ブロックの戻り値に関係なくレシーバ自身を返します。`<<` はレシーバを変更するので `[1, 2]` になりますが、`+` は新しい配列を作るだけなので `b` は `[1]` のままです。

- cat: 組み込みライブラリ
  topic: Enumerableの別名
  q: 同じ動作をする（別名の関係にある）メソッドの組み合わせとして正しいものを2つ選択してください。
  choices:
    - '`map` と `collect`'
    - '`find` と `select`'
    - '`inject` と `reduce`'
    - '`each` と `each_with_index`'
  answer: [0, 2]
  verify: checks
  checks:
    - "exit(Enumerable.instance_method(:map) == Enumerable.instance_method(:collect))"
    - "exit(Enumerable.instance_method(:find) == Enumerable.instance_method(:select))"
    - "exit(Enumerable.instance_method(:inject) == Enumerable.instance_method(:reduce))"
    - "exit(Array.instance_method(:each) == Array.instance_method(:each_with_index))"
  exp: |
    よく出る別名の組み合わせです。

    - `map` = `collect`
    - `select` = `filter` = `find_all`
    - `find` = `detect`
    - `inject` = `reduce`
    - `include?` = `member?`

    `find` は条件を満たす最初の要素を1つ返し、`select` は条件を満たす要素をすべて配列で返すので別物です。

