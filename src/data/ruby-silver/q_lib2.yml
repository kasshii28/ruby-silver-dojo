- cat: 組み込みライブラリ
  topic: 最小値・最大値・合計
  q: 次のコードを実行するとどうなりますか。
  code: |
    a = [4, 9, 1, 7]
    p a.minmax
    p a.max(2)
    p a.sum / a.size
