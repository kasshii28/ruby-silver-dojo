  q: 次のコードを実行するとどうなりますか。
  code: |
    p "a1b22c333".scan(/[a-z]\d+/)
    p "a1b22c333".scan(/([a-z])(\d+)/)
  choices:
    - |-
      ["a1", "b22", "c333"]
      [["a", "1"], ["b", "22"], ["c", "333"]]
    - |-
      ["a1", "b22", "c333"]
      ["a", "1", "b", "22", "c", "333"]
    - |-
      ["a1"]
      [["a", "1"]]
    - |-
      ["a1", "b22", "c333"]
      ["a1", "b22", "c333"]
  answer: [0]
  verify: output
  exp: |
    `scan` はマッチした部分をすべて配列で返します。正規表現にグループ `()` が含まれる場合は、マッチ全体ではなく各グループの文字列をまとめた配列の配列を返します。

- cat: 組み込みライブラリ
  topic: 書式指定（配列・符号・指数）
  q: 次のコードを実行するとどうなりますか。
  code: |
    puts "%s is %d years" % ["Ruby", 31]
    puts "%+d %+d" % [5, -5]
    puts "%.2e" % 12345.678
  choices: ["Ruby is 31 years\n+5 -5\n1.23e+04", "Ruby is 31 years\n5 -5\n12345.68", '!1行目で `ArgumentError` が発生する', "Ruby is 31 years\n+5 +-5\n1.23e+04"]
  answer: [0]
  verify: output
  exp: |
    書式の中に指定子が複数あるときは、`%` の右辺に配列を渡します。

    `%+d` は正の数にも `+` を付けます。`%.2e` は指数表記で小数点以下2桁です（12345.678 → `1.23e+04`）。

- cat: 組み込みライブラリ
  topic: String（行・文字の列挙）
  q: 次のコードを実行するとどうなりますか。
  code: |
    text = "a\nbb\nccc"
    p text.lines
    p text.lines.map(&:chomp).map(&:size)
    p text.each_char.count { |c| c == "c" }
  choices:
    - |-
      ["a\n", "bb\n", "ccc"]
      [1, 2, 3]
      3
    - |-
      ["a", "bb", "ccc"]
      [1, 2, 3]
      3
    - |-
      ["a\n", "bb\n", "ccc"]
      [2, 3, 3]
      3
    - |-
      ["a\n", "bb\n", "ccc\n"]
      [1, 2, 3]
      1
  answer: [0]
  verify: output
  exp: |
    `lines` は行ごとの配列を返し、各要素には改行文字が残ります（最後の行は元の文字列に改行がないので付きません）。改行を除くには `chomp` します。

    `each_char` はブロックなしで Enumerator を返すので、そのまま `count` などをつなげられます。

- cat: 組み込みライブラリ
  topic: Symbol
  q: 次のコードを実行するとどうなりますか。
  code: |
    p "hello world".to_sym
    p :abc.size
    p :abc.upcase
    p :b.between?(:a, :c)
  choices: [":\"hello world\"\n3\n:ABC\ntrue", ":hello_world\n3\n:ABC\ntrue", ":\"hello world\"\n3\n\"ABC\"\ntrue", '!1行目で `ArgumentError` が発生する']
  answer: [0]
  verify: output
  exp: |
    `to_sym` は文字列をシンボルに変換します。空白を含むシンボルは `:"hello world"` と表示されます。

    シンボルにも `size`、`upcase` など文字列に似たメソッドがあり、`upcase` の結果はシンボルです。シンボルは `Comparable` をインクルードしているので `between?` も使えます。

- cat: 組み込みライブラリ
  topic: Array（先頭・末尾の取り出し）
  q: 次のコードを実行するとどうなりますか。
  code: |
    a = [5, 3, 8, 1, 9]
    p a.first(2)
    p a.last
    p a.drop(3)
    p a.take_while { |x| x > 2 }
    p a.drop_while { |x| x > 2 }
  choices: ["[5, 3]\n9\n[1, 9]\n[5, 3, 8]\n[1, 9]", "[5, 3]\n[9]\n[1, 9]\n[5, 3, 8, 9]\n[1]", "[5, 3]\n9\n[5, 3, 8]\n[5, 3, 8]\n[1, 9]", "5\n9\n[1, 9]\n[5, 3, 8]\n[1, 9]"]
  answer: [0]
  verify: output
  exp: |
    - `first(n)` / `last(n)` … 先頭 / 末尾から n 個（引数なしなら要素1つ）
    - `take(n)` / `drop(n)` … 先頭から n 個を取る / 捨てる
    - `take_while` … ブロックが真の間、先頭から取る（偽になった時点で終了）
    - `drop_while` … ブロックが真の間、先頭から捨てて残りを返す

    `take_while` は `1` で偽になるので、その後ろの `9` は含まれません。

- cat: 組み込みライブラリ
  topic: Array（数える・探す）
  q: 次のコードを実行するとどうなりますか。
  code: |
    a = [1, 2, 3, 2, 1]
    p a.count
    p a.count(2)
    p a.count(&:odd?)
    p a.index(2), a.rindex(2)
  choices: ["5\n2\n3\n1\n3", "5\n2\n3\n2\n4", "5\n1\n3\n1\n3", "4\n2\n2\n1\n3"]
  answer: [0]
  verify: output
  exp: |
    `count` は引数なしなら要素数、引数ありならその値と等しい要素の数、ブロックありならブロックが真になる要素の数を返します。

    `index` は最初に見つかった位置、`rindex` は最後に見つかった位置です。

- cat: 組み込みライブラリ
  topic: group_by / partition
  q: 次のコードを実行するとどうなりますか。
  code: |
    words = %w(apple avocado banana blueberry cherry)
    p words.group_by { |w| w[0] }
    p words.partition { |w| w.size > 6 }
  choices:
    - |-
      {"a"=>["apple", "avocado"], "b"=>["banana", "blueberry"], "c"=>["cherry"]}
      [["avocado", "blueberry"], ["apple", "banana", "cherry"]]
    - |-
      [["apple", "avocado"], ["banana", "blueberry"], ["cherry"]]
      [["avocado", "blueberry"], ["apple", "banana", "cherry"]]
    - |-
      {"a"=>["apple", "avocado"], "b"=>["banana", "blueberry"], "c"=>["cherry"]}
      {true=>["avocado", "blueberry"], false=>["apple", "banana", "cherry"]}
    - |-
      {"a"=>2, "b"=>2, "c"=>1}
      [["avocado", "blueberry"], ["apple", "banana", "cherry"]]
  answer: [0]
  verify: output
  exp: |
    `group_by` はブロックの戻り値をキー、その値になった要素の配列を値とするハッシュを返します。

    `partition` はブロックが真になる要素と偽になる要素に分け、`[真の配列, 偽の配列]` の2要素の配列を返します。

- cat: 組み込みライブラリ
  topic: インデックス付きの繰り返し
  q: 次のコードを実行するとどうなりますか。
  code: |
    a = %w(a b c)
    a.each_with_index { |x, i| print i, x }
    puts
    p a.map.with_index(1) { |x, i| "#{i}:#{x}" }
  choices: ["0a1b2c\n[\"1:a\", \"2:b\", \"3:c\"]", "a0b1c2\n[\"1:a\", \"2:b\", \"3:c\"]", "0a1b2c\n[\"0:a\", \"1:b\", \"2:c\"]", "1a2b3c\n[\"1:a\", \"2:b\", \"3:c\"]"]
  answer: [0]
  verify: output
  exp: |
    `each_with_index` はブロックに「要素, 位置」の順で渡します。位置は 0 から始まります。

    `map.with_index(1)` のように `with_index` を使うと、インデックスの開始値を指定できます。`map` と組み合わせるとインデックス付きで変換できます。

- cat: 組み込みライブラリ
  topic: each_with_object / tally
  q: 次のコードを実行するとどうなりますか。
  code: |
    r = %w(a b a).each_with_object(Hash.new(0)) { |w, h| h[w] += 1 }
    p r
    p %w(a b a).tally
  choices: ["{\"a\"=>2, \"b\"=>1}\n{\"a\"=>2, \"b\"=>1}", "[\"a\", \"b\", \"a\"]\n{\"a\"=>2, \"b\"=>1}", "{\"a\"=>2, \"b\"=>1}\n[[\"a\", 2], [\"b\", 1]]", "{}\n{\"a\"=>2, \"b\"=>1}"]
