# 組み込みライブラリ（追加分）
- cat: 組み込みライブラリ
  topic: String（sub / gsub）
  q: 次のコードを実行するとどうなりますか。
  code: |
    s = "hello"
    p s.gsub(/[el]/, "e" => "3", "l" => "1")
    p s.gsub(/l/) { |m| m.upcase }
    p s.sub(/l+/, "L")
  choices: ["\"h311o\"\n\"heLLo\"\n\"heLo\"", "\"h3llo\"\n\"heLlo\"\n\"heLlo\"", "\"h311o\"\n\"heLLo\"\n\"heLLo\"", "\"h311o\"\n\"heLlo\"\n\"heLo\""]
  answer: [0]
  verify: output
  exp: |
    `gsub` はマッチした部分をすべて置換し、`sub` は最初の1か所だけ置換します。

    置換後の文字列の代わりにハッシュを渡すと、マッチした文字列をキーとして値に置き換えます。ブロックを渡すと、ブロックの戻り値で置き換えます。`/l+/` は連続する `ll` 全体にマッチするので、`sub` の結果は `"heLo"` です。

- cat: 組み込みライブラリ
  topic: String（count / squeeze / delete / tr）
  q: 次のコードを実行するとどうなりますか。
  code: |
    s = "bookkeeper"
    p s.count("e")
    p s.squeeze
    p s.delete("o")
    p s.tr("ok", "OK")
  choices: ["3\n\"bokeper\"\n\"bkkeeper\"\n\"bOOKKeeper\"", "3\n\"bookkeeper\"\n\"bkkeeper\"\n\"bOOKKeeper\"", "1\n\"bokeper\"\n\"bokkeeper\"\n\"bOOKKeeper\"", "3\n\"bokeper\"\n\"bkkeeper\"\n\"bOKkeeper\""]
  answer: [0]
  verify: output
  exp: |
    - `count("e")` … 指定した文字が何回現れるか
    - `squeeze` … 連続する同じ文字を1文字にまとめる
    - `delete("o")` … 指定した文字をすべて削除する
    - `tr("ok", "OK")` … `o` を `O`、`k` を `K` に1文字ずつ置き換える

- cat: 組み込みライブラリ
  topic: String（検索）
  q: 次のコードを実行するとどうなりますか。
  code: |
    s = "ruby on rails"
    p s.index("r")
    p s.rindex("r")
    p s.index("x")
    p s.start_with?("ruby"), s.end_with?("rail")
  choices: ["0\n8\nnil\ntrue\nfalse", "0\n8\n-1\ntrue\nfalse", "1\n9\nnil\ntrue\nfalse", "0\n8\nnil\ntrue\ntrue"]
  answer: [0]
  verify: output
  exp: |
    `index` は最初に見つかった位置、`rindex` は最後に見つかった位置を返します（先頭は 0）。見つからなければ `nil` です（`-1` ではありません）。

    `start_with?` / `end_with?` は指定した文字列で始まる・終わるかを返します。末尾は `rails` なので `end_with?("rail")` は `false` です。

- cat: 組み込みライブラリ
  topic: String（大文字・小文字）
  q: 次のコードを実行するとどうなりますか。
  code: |
    s = "hELLO wORLD"
    p s.capitalize
    p s.swapcase
    p s.downcase.split.map(&:capitalize).join(" ")
  choices: ["\"Hello world\"\n\"Hello World\"\n\"Hello World\"", "\"HELLO wORLD\"\n\"Hello World\"\n\"Hello World\"", "\"Hello World\"\n\"Hello World\"\n\"Hello World\"", "\"Hello world\"\n\"HELLO WORLD\"\n\"Hello world\""]
  answer: [0]
  verify: output
  exp: |
    - `capitalize` … 先頭だけ大文字にし、残りはすべて小文字にする
    - `swapcase` … 大文字と小文字を入れ替える
    - `upcase` / `downcase` … すべて大文字 / 小文字にする

    単語ごとに先頭を大文字にしたいときは、`split` で分けてから `capitalize` します。

- cat: 組み込みライブラリ
  topic: String#succ
  q: 次のコードを実行するとどうなりますか。
  code: |
    p "az".succ
    p "zz".succ
    p "a9".succ
    p 9.succ
  choices: ["\"ba\"\n\"aaa\"\n\"b0\"\n10", "\"b\"\n\"aa\"\n\"a10\"\n10", "\"ba\"\n\"za\"\n\"b0\"\n10", "\"aaa\"\n\"aaa\"\n\"b0\"\n\"10\""]
  answer: [0]
  verify: output
  exp: |
    `String#succ`（別名 `next`）は「次の」文字列を返します。末尾の文字を1つ進め、`z` や `9` を超えると繰り上がります（`"az"` → `"ba"`、`"zz"` → `"aaa"`、`"a9"` → `"b0"`）。

    `Integer#succ` は 1 を足した整数を返します。`("a".."e")` のような文字列の範囲もこの `succ` で要素を作っています。

- cat: 組み込みライブラリ
  topic: String（文字単位の操作）
  q: 次のコードを実行するとどうなりますか。
  code: |
    s = "ruby"
    p s.reverse
    p s.chars.sort.join
    p s.chars.map(&:ord).sum
  choices: ["\"ybur\"\n\"bruy\"\n450", "\"ybur\"\n\"bruy\"\n\"ruby\"", "\"ybur\"\n[\"b\", \"r\", \"u\", \"y\"]\n450", "\"ruby\"\n\"bruy\"\n450"]
  answer: [0]
  verify: output
  exp: |
    `reverse` は文字を逆順にした文字列を返します。`chars` で1文字ずつの配列にすると、配列のメソッド（`sort`、`map` など）が使え、`join` で文字列に戻せます。

    `ord` は文字コードを返すので、`r`(114) + `u`(117) + `b`(98) + `y`(121) = 450 です。

- cat: 組み込みライブラリ
  topic: String（部分の書き換え）
  q: 次のコードを実行するとどうなりますか。
  code: |
    s = "Hello World"
    s[0] = "J"
    p s
    t = s.slice!(5..)
    p s, t
  choices: ["\"Jello World\"\n\"Jello\"\n\" World\"", "\"Jello World\"\n\"Jello World\"\n\" World\"", "\"Hello World\"\n\"Hello\"\n\" World\"", "\"Jello World\"\n\" World\"\n\"Jello\""]
  answer: [0]
  verify: output
  exp: |
    `s[位置] = 文字列` で、その部分を置き換えられます（破壊的）。

    `slice!` は指定した部分を取り出して返し、レシーバからはその部分を削除します。`slice`（`!` なし）なら取り出すだけでレシーバは変わりません。

- cat: 組み込みライブラリ
  topic: String#split（空要素）
  q: 次のコードを実行するとどうなりますか。
  code: |
    p "a,b,,c,,".split(",")
    p "a,b,,c,,".split(",", -1)
    p "a b  c".split(" ")
    p "a b  c".split(/ /)
  choices:
    - |-
      ["a", "b", "", "c"]
      ["a", "b", "", "c", "", ""]
      ["a", "b", "c"]
      ["a", "b", "", "c"]
    - |-
      ["a", "b", "c"]
      ["a", "b", "c"]
      ["a", "b", "c"]
      ["a", "b", "c"]
    - |-
      ["a", "b", "", "c", "", ""]
      ["a", "b", "", "c", "", ""]
      ["a", "b", "c"]
      ["a", "b", "", "c"]
    - |-
      ["a", "b", "", "c"]
      ["a", "b", "", "c", "", ""]
      ["a", "b", "", "c"]
      ["a", "b", "", "c"]
  answer: [0]
  verify: output
  exp: |
    `split` は途中の空文字列は残しますが、末尾の空文字列は取り除きます。第2引数に負の数を渡すと末尾の空文字列も残ります。

    区切りに半角空白1つの文字列 `" "` を渡したときだけ特別扱いで、連続する空白をまとめて区切ります。正規表現 `/ /` で区切ると、連続する空白の間に空文字列ができます。

- cat: 組み込みライブラリ
  topic: MatchData（名前付きキャプチャ）
  q: 次のコードを実行するとどうなりますか。
  code: |
    m = "2024-03-05".match(/(?<y>\d+)-(?<m>\d+)-(?<d>\d+)/)
    p m[:y]
    p m[2]
    p m.pre_match
    p "abc".match?(/b/)
  choices: ["\"2024\"\n\"03\"\n\"\"\ntrue", "\"2024\"\n\"2024\"\nnil\ntrue", "2024\n3\n\"\"\n1", "\"2024\"\n\"03\"\n\"\"\n1"]
  answer: [0]
  verify: output
  exp: |
    `(?<名前>...)` で名前付きキャプチャを書くと、MatchData から `m[:名前]` で取り出せます。番号（`m[2]`）でも取り出せ、値は文字列です。

    `pre_match` はマッチした部分より前の文字列（ここでは空文字列）です。`match?` はマッチするかどうかだけを `true` / `false` で返します。

- cat: 組み込みライブラリ
