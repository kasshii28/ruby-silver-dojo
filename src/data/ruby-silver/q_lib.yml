- cat: 組み込みライブラリ
  topic: Comparable
  q: 次のコードを実行するとどうなりますか。
  code: |
    class Score
      include Comparable
      attr_reader :value
      def initialize(value)
        @value = value
      end
      def <=>(other)
        value <=> other.value
      end
    end
    a, b, c = Score.new(70), Score.new(85), Score.new(70)
    p a < b, a == c, b.between?(a, c)
    top = [b, a, c].max
    p top.value
  choices: ["true\ntrue\nfalse\n85", "true\nfalse\nfalse\n85", "true\ntrue\ntrue\n85", '!`NoMethodError` が発生する']
  answer: [0]
  verify: output
  exp: |
    `Comparable` をインクルードして `<=>` を定義すると、`<`、`<=`、`==`、`>`、`>=`、`between?`、`clamp` が使えるようになります。

    `==` も `<=>` が 0 を返せば `true` なので、別のオブジェクトでも値が同じ `a` と `c` は等しくなります。`b.between?(a, c)` は 85 が 70〜70 の範囲にあるかなので `false` です。

    `max` や `sort` も `<=>` を使って比較します。

- cat: 組み込みライブラリ
  topic: Enumerable
  q: 次のコードを実行するとどうなりますか。
  code: |
    class NumberList
      include Enumerable
      def initialize(*nums)
        @nums = nums
      end
      def each
        @nums.each { |n| yield n }
      end
    end
    list = NumberList.new(3, 1, 2)
    p list.sort
    p list.map { |n| n * 10 }
    p list.include?(2)
  choices: ["[1, 2, 3]\n[30, 10, 20]\ntrue", "[1, 2, 3]\n[10, 20, 30]\ntrue", "[3, 1, 2]\n[30, 10, 20]\ntrue", '!`NoMethodError` が発生する']
  answer: [0]
  verify: output
  exp: |
    `Enumerable` をインクルードし、要素を順に `yield` する `each` メソッドを定義すると、`map`、`select`、`sort`、`include?`、`inject` など多くのメソッドが使えるようになります。

    `map` は `each` が渡す順番どおりに処理します。`sort` や `max` を使うには、要素どうしが `<=>` で比較できる必要があります。
