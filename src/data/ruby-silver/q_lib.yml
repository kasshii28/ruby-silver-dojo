  topic: Array（集合演算）
  q: 次のコードを実行するとどうなりますか。
  code: |
    a = [1, 2, 2, 3]
    b = [2, 3, 4]
    p a & b
    p a | b
    p a - b
  choices: ["[2, 3]\n[1, 2, 3, 4]\n[1]", "[2, 2, 3]\n[1, 2, 2, 3, 4]\n[1]", "[2, 3]\n[1, 2, 3, 4]\n[1, 2]", "[2, 3]\n[1, 2, 2, 3, 2, 3, 4]\n[1]"]
  answer: [0]
  verify: output
  exp: |
    - `&` … 両方に含まれる要素（積集合）。重複は除かれる
    - `|` … どちらかに含まれる要素（和集合）。重複は除かれる
    - `-` … 右辺に含まれる要素をすべて取り除く（2 は2つとも消える）

    `+` は単純な連結で、重複は残ります。

