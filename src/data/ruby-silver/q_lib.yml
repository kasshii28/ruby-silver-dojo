# 組み込みライブラリ
- cat: 組み込みライブラリ
  topic: 数値演算
  q: 次のコードを実行するとどうなりますか。
  code: |
    p 7 / 2
    p(-7 / 2)
    p 7 % -3
    p 7.0 / 2
  choices: ["3\n-4\n-2\n3.5", "3\n-3\n1\n3.5", "3\n-4\n1\n3", "3.5\n-3.5\n-2\n3.5"]
  answer: [0]
  verify: output
  exp: |
    整数どうしの `/` は整数除算で、結果は小さい方（負の無限大方向）に丸められます。-3.5 は -4 になります。

    `%` の結果の符号は右辺（割る数）と同じになります。7 = (-3) × (-3) + (-2) なので `-2` です。

    どちらかが Float なら結果も Float になります。

- cat: 組み込みライブラリ
  topic: 数値の丸め
  q: 次のコードを実行するとどうなりますか。
  code: |
    p 10.divmod(3)
    p 3.7.floor
    p 3.2.ceil
    p(-3.5.round)
    p 10.fdiv(4)
  choices: ["[3, 1]\n3\n4\n-4\n2.5", "[3, 1]\n3\n4\n-3\n2", "[3, 0]\n4\n3\n-4\n2.5", "3.3333333333333335\n3\n4\n-4\n2"]
  answer: [0]
  verify: output
  exp: |
    - `divmod` … 商と余りを配列で返す
    - `floor` … 切り捨て、`ceil` … 切り上げ
    - `round` … 四捨五入。ちょうど .5 のときは 0 から遠い方へ丸める（-3.5 → -4）
    - `fdiv` … Float として割り算した結果を返す（10 / 4 → 2.5）

- cat: 組み込みライブラリ
  topic: 破壊的メソッド
  q: 次のコードを実行するとどうなりますか。
  code: |
    s = "ruby"
    t = s.upcase
    u = s.upcase!
    p s, t, u
    v = s.upcase!
    p v
  choices: ["\"RUBY\"\n\"RUBY\"\n\"RUBY\"\nnil", "\"ruby\"\n\"RUBY\"\n\"RUBY\"\n\"RUBY\"", "\"RUBY\"\n\"RUBY\"\n\"RUBY\"\n\"RUBY\"", "\"ruby\"\n\"RUBY\"\nnil\nnil"]
  answer: [0]
  verify: output
  exp: |
    `!` 付きのメソッドの多くは破壊的で、レシーバ自身を変更します。

    `upcase!` は変更があればレシーバ自身を返しますが、変更がなければ `nil` を返します。すでに大文字になった `s` に再び `upcase!` を呼ぶと `nil` です。`downcase!`、`capitalize!`、`gsub!`、`strip!` なども同じ挙動です。

- cat: 組み込みライブラリ
  topic: オブジェクトの参照
  q: 次のコードを実行するとどうなりますか。
  code: |
    a = "hello"
    b = a
    c = a.dup
    b << " world"
    p a
    p c
  choices: ["\"hello world\"\n\"hello\"", "\"hello\"\n\"hello\"", "\"hello world\"\n\"hello world\"", "\"hello\"\n\"hello world\""]
  answer: [0]
  verify: output
  exp: |
    変数への代入はオブジェクトの参照をコピーするだけなので、`a` と `b` は同じ文字列オブジェクトを指します。`<<` は破壊的に連結するため、`a` からも変更が見えます。

    `dup` は別のオブジェクトを作るので影響を受けません。なお `b += " world"` と書いた場合は新しい文字列が作られ、`a` は変わりません。

- cat: 組み込みライブラリ
  topic: freeze
  q: 次のコードを実行するとどうなりますか。
  code: |
    arr = ["a", "b"].freeze
    arr[0] << "x"
    p arr
    arr << "c"
  choices:
    - '`["ax", "b"]` と出力された後、`FrozenError` が発生する'
    - '`["a", "b"]` と出力された後、`FrozenError` が発生する'
    - '2行目で `FrozenError` が発生する'
    - '`["ax", "b"]` と出力され、エラーは発生しない'
  answer: [0]
  verify: run
  expect: {out: '["ax", "b"]', error: FrozenError}
  exp: |
    `freeze` はそのオブジェクト自体（ここでは配列）を変更不可にしますが、中の要素までは凍結しません（浅い freeze）。

    そのため要素の文字列への `<<` は成功し、配列への `<<` で `FrozenError` が発生します。

- cat: 組み込みライブラリ
  topic: dupとclone
  q: 次のコードを実行するとどうなりますか。
  code: |
    s = "abc".freeze
    p s.dup.frozen?
    p s.clone.frozen?
    p s.frozen?
  choices: ["false\ntrue\ntrue", "true\ntrue\ntrue", "false\nfalse\ntrue", "true\nfalse\ntrue"]
  answer: [0]
  verify: output
  exp: |
    `dup` も `clone` もオブジェクトを複製しますが、`clone` は凍結状態（と特異メソッド）もコピーし、`dup` はコピーしません。

- cat: 組み込みライブラリ
  topic: オブジェクトの比較
  q: 次のコードを実行するとどうなりますか。
  code: |
    p 1 == 1.0
    p 1.eql?(1.0)
    p "a".equal?("a")
    p :a.equal?(:a)
  choices: ["true\nfalse\nfalse\ntrue", "true\ntrue\nfalse\ntrue", "true\nfalse\ntrue\ntrue", "false\nfalse\nfalse\ntrue"]
  answer: [0]
  verify: output
  exp: |
    - `==` … 値が等しいか（`1` と `1.0` は等しい）
    - `eql?` … 型も含めて等しいか（Integer と Float は別物）
    - `equal?` … 同一のオブジェクトか（`object_id` が同じか）

    文字列リテラルは評価されるたびに別のオブジェクトが作られますが、同じ名前のシンボルは常に同一のオブジェクトです。

- cat: 組み込みライブラリ
  topic: 型変換
  q: 次のコードを実行するとどうなりますか。
  code: |
    p "12abc".to_i
    p "abc".to_i
    p Integer("12abc")
  choices:
    - '`12`、`0` と出力された後、`ArgumentError` が発生する'
    - '`12`、`0`、`12` と出力される'
    - '`12`、`nil` と出力された後、`ArgumentError` が発生する'
    - '1行目で `ArgumentError` が発生する'
  answer: [0]
  verify: run
  expect: {out: "12\n0", error: ArgumentError}
  exp: |
    `String#to_i` は先頭から数値として読める部分だけを変換し、読めなければ `0` を返します（例外は発生しません）。

    `Kernel#Integer` は厳密で、数値として正しくない文字列を渡すと `ArgumentError` を発生させます。`to_f` と `Float()` も同じ関係です。

