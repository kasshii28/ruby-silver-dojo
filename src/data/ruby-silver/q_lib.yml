- cat: 組み込みライブラリ
  topic: String（分割）
  q: '__(1)__ に記述すると〔実行結果〕が出力されるコードを2つ選択してください。'
  code: |
    s = "apple banana cherry"
    p __(1)__
  result: '["apple", "banana", "cherry"]'
  choices: ['s.split', 's.split(" ")', 's.chars', 's.lines']
  answer: [0, 1]
  verify: blank
  exp: |
    引数なしの `split` と `split(" ")` は、空白（連続する空白もまとめて）で区切った配列を返します。

    `chars` は1文字ずつの配列、`lines` は改行で区切った配列（改行がなければ要素1つ）を返します。

- cat: 組み込みライブラリ
