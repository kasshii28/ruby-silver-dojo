  q: 次のコードを実行するとどうなりますか。
  code: |
    a = [1, 2, 3]
    a.push(4).unshift(0)
    x = a.pop
    y = a.shift
    p a, x, y
  choices: ["[1, 2, 3]\n4\n0", "[0, 1, 2, 3]\n4\n0", "[1, 2, 3]\n0\n4", "[0, 1, 2, 3, 4]\n4\n0"]
  answer: [0]
  verify: output
  exp: |
    - `push`（`<<`）… 末尾に追加
    - `unshift` … 先頭に追加
    - `pop` … 末尾の要素を取り出す
    - `shift` … 先頭の要素を取り出す

    `push` は配列自身を返すので、そのまま `unshift` をつなげられます。

- cat: 組み込みライブラリ
  topic: Array（select / map）
  q: 次のコードを実行するとどうなりますか。
  code: |
    nums = [1, 2, 3, 4, 5, 6]
    p nums.select(&:even?).map { |n| n * n }.sum
  choices: ['56', '91', '12', '35']
  answer: [0]
  verify: output
  exp: |
    `select` はブロックが真を返した要素を集めます → `[2, 4, 6]`。`&:even?` は `{ |n| n.even? }` の省略形です。

    `map` でそれぞれ2乗して `[4, 16, 36]`、`sum` で合計 56 です。

    `select` の別名は `filter`、逆に偽の要素を集めるのは `reject`、`map` の別名は `collect` です。

- cat: 組み込みライブラリ
  topic: Array（inject）
  q: 次のコードを実行するとどうなりますか。
  code: |
    p [1, 2, 3, 4].inject(10) { |sum, n| sum + n }
    p [1, 2, 3, 4].inject(:*)
  choices: ["20\n24", "10\n24", "20\n10", "11\n24"]
  answer: [0]
  verify: output
  exp: |
    `inject`（別名 `reduce`）は要素を順に畳み込みます。ブロックの第1引数が途中の結果、第2引数が要素です。初期値 10 に 1〜4 を足して 20 になります。

    初期値を省略すると先頭の要素が初期値になります。シンボルを渡すとその演算子を順に適用します（1 × 2 × 3 × 4 = 24）。

- cat: 組み込みライブラリ
  topic: Array（範囲外の参照）
  q: 次のコードを実行するとどうなりますか。
  code: |
    a = [10, 20, 30, 40, 50]
    p a[1, 2]
    p a[-2..]
    p a[5, 1]
    p a[6, 1]
  choices: ["[20, 30]\n[40, 50]\n[]\nnil", "[20, 30]\n[40, 50]\nnil\nnil", "[20, 30]\n[40, 50]\n[]\n[]", "[20, 30, 40]\n[40, 50]\n[]\nnil"]
  answer: [0]
  verify: output
  exp: |
    `a[開始位置, 長さ]` は部分配列を返します。

    開始位置がちょうど配列の長さ（ここでは 5）と等しいときは空配列 `[]`、それより大きいと `nil` を返すという特殊なルールがあります。

    なお `a[5]` のように位置だけを指定した場合は `nil` です。

- cat: 組み込みライブラリ
  topic: Array（整理系メソッド）
  q: 次のコードを実行するとどうなりますか。
  code: |
    a = [3, [1, nil], [2, [3, nil]]]
    p a.flatten.compact.uniq.sort
  choices: ['[1, 2, 3]', '[1, 2, 3, 3]', '[3, 1, 2]', '!`ArgumentError` が発生する']
  answer: [0]
  verify: output
  exp: |
    1. `flatten` で入れ子を平らにする → `[3, 1, nil, 2, 3, nil]`
    2. `compact` で `nil` を取り除く → `[3, 1, 2, 3]`
    3. `uniq` で重複を取り除く → `[3, 1, 2]`
    4. `sort` で並べ替える → `[1, 2, 3]`

    `nil` を残したまま `sort` すると、数値と `nil` を比較できず `ArgumentError` になります。

