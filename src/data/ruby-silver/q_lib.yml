  q: 次のコードを実行するとどうなりますか。
  code: |
    puts "ab" * 3
    puts "ab".center(6, "*")
    puts "ab".rjust(5, "0")
  choices: ["ababab\n**ab**\n000ab", "ababab\n*ab***\n000ab", "ab3\n**ab**\nab000", "ababab\n**ab**\nab000"]
  answer: [0]
  verify: output
  exp: |
    `String#*` は文字列を指定回数繰り返します。

    `center` は中央寄せ、`ljust` は左寄せ、`rjust` は右寄せです。第2引数で空いた部分を埋める文字を指定できます（省略すると空白）。

- cat: 組み込みライブラリ
  topic: 書式指定
  q: 次のコードを実行するとどうなりますか。
  code: |
    puts "%05.1f" % 3.14159
    puts format("%-5s|", "ab")
    puts "%x" % 255
  choices: ["003.1\nab   |\nff", "3.14159\nab|\n255", "00003.1\n   ab|\nFF", "003.1\n   ab|\nff"]
  answer: [0]
  verify: output
  exp: |
    - `%05.1f` … 全体5桁・小数点以下1桁で、足りない桁は0で埋める
    - `%-5s` … 5文字幅で左寄せ（`-` がなければ右寄せ）
    - `%x` … 16進数（小文字）。`%X` は大文字、`%b` は2進数、`%o` は8進数

    `String#%` と `format`（別名 `sprintf`）は同じ書式指定を使います。

- cat: 組み込みライブラリ
  topic: String（空白・改行の除去）
  q: 次のコードを実行するとどうなりますか。
  code: |
    s = "  ruby\n"
    p s.chomp
    p s.strip
    p s.chop.chop
  choices: ["\"  ruby\"\n\"ruby\"\n\"  rub\"", "\"ruby\"\n\"ruby\"\n\"  ru\"", "\"  ruby\"\n\"ruby\\n\"\n\"  rub\"", "\"  ruby\\n\"\n\"ruby\"\n\"  ru\""]
  answer: [0]
  verify: output
  exp: |
    - `chomp` … 末尾の改行だけを取り除く
    - `strip` … 先頭と末尾の空白（改行・タブも含む）を取り除く
    - `chop` … 末尾の1文字を取り除く（末尾が `\r\n` なら2文字まとめて）

    `chop` を2回呼ぶと、改行と `y` が取り除かれて `"  rub"` になります。

- cat: 組み込みライブラリ
  topic: 正規表現
  q: 次のコードを実行するとどうなりますか。
  code: |
    s = "tel: 03-1234-5678"
    if s =~ /(\d+)-(\d+)-(\d+)/
      p $1
      p $~[3]
    end
    p s.scan(/\d+/).size
  choices: ["\"03\"\n\"5678\"\n3", "\"03-1234-5678\"\n\"5678\"\n3", "\"03\"\n\"1234\"\n3", "\"03\"\n\"5678\"\n1"]
  answer: [0]
  verify: output
  exp: |
    `=~` はマッチした位置（マッチしなければ `nil`）を返します。マッチの結果は `$~`（MatchData オブジェクト）に入り、`()` で囲んだグループは `$1`、`$2`… で参照できます。`$~[0]` はマッチした部分全体、`$~[3]` は3番目のグループです。

    `scan` はマッチした部分をすべて配列で返します（`["03", "1234", "5678"]`）。

