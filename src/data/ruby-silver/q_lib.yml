    `delete(値)` は値が一致する要素を**すべて**削除し、削除した値を返します。

    `delete_at(位置)` は指定した位置の要素を削除し、その要素を返します。どちらも配列自身を変更する破壊的メソッドです。

- cat: 組み込みライブラリ
  topic: each_slice / each_cons
  q: 次のコードを実行するとどうなりますか。
  code: |
    a = [1, 2, 3, 4, 5]
    p a.each_slice(2).to_a
    p a.each_cons(3).to_a.size
  choices: ["[[1, 2], [3, 4], [5]]\n3", "[[1, 2], [3, 4]]\n3", "[[1, 2], [3, 4], [5]]\n2", "[[1, 2], [2, 3], [3, 4], [4, 5]]\n3"]
  answer: [0]
  verify: output
  exp: |
    `each_slice(n)` は n 個ずつに区切ります（最後は余りの要素だけ）。

    `each_cons(n)` は1つずつずらしながら、連続する n 個の組を作ります。`[1, 2, 3]`、`[2, 3, 4]`、`[3, 4, 5]` の3組です。

    どちらもブロックを渡さないと Enumerator を返すので、`to_a` で配列にできます。

- cat: 組み込みライブラリ
  topic: 並べ替え
  q: 次のコードを実行するとどうなりますか。
  code: |
    words = %w(pear fig banana kiwi)
    p words.sort_by { |w| [w.size, w] }
    p words.sort { |a, b| b <=> a }
  choices:
    - |-
      ["fig", "kiwi", "pear", "banana"]
      ["pear", "kiwi", "fig", "banana"]
    - |-
      ["fig", "pear", "kiwi", "banana"]
      ["pear", "kiwi", "fig", "banana"]
    - |-
      ["fig", "kiwi", "pear", "banana"]
      ["banana", "fig", "kiwi", "pear"]
    - |-
      ["banana", "fig", "kiwi", "pear"]
      ["pear", "kiwi", "fig", "banana"]
  answer: [0]
  verify: output
  exp: |
    `sort_by` はブロックの戻り値を基準に並べます。配列を返すと先頭の要素から順に比較されるので、「長さが短い順 → 同じ長さならアルファベット順」になります。

    `sort` にブロックを渡すと、2つの要素を受け取り `<=>` の結果（-1 / 0 / 1）で並べます。`b <=> a` と逆にすると降順になります。

- cat: 組み込みライブラリ
  topic: Hash（デフォルト値）
  q: 次のコードを実行するとどうなりますか。
  code: |
    h = Hash.new(0)
    "banana".each_char { |c| h[c] += 1 }
    p h
  choices: ['{"b"=>1, "a"=>3, "n"=>2}', '{"b"=>1, "a"=>1, "n"=>1}', '{}', '!`NoMethodError` が発生する']
  answer: [0]
  verify: output
  exp: |
    `Hash.new(0)` は、存在しないキーを参照したときに `0` を返すハッシュを作ります。`h[c] += 1` は `h[c] = h[c] + 1` と同じなので、初回でも `0 + 1` となり、文字の出現回数を数えられます。

    `Hash.new`（デフォルト値なし）だと初回が `nil + 1` になり `NoMethodError` です。ハッシュのキーは挿入した順に並びます。

- cat: 組み込みライブラリ
  topic: Hash（デフォルト値の共有）
  q: 次のコードを実行するとどうなりますか。
  code: |
    h = Hash.new([])
    h[:a] << 1
    h[:b] << 2
    p h
    p h[:c]
  choices: ["{}\n[1, 2]", "{:a=>[1], :b=>[2]}\n[]", "{:a=>[1, 2], :b=>[1, 2]}\n[1, 2]", "{}\n[]"]
  answer: [0]
  verify: output
  exp: |
    `Hash.new([])` のデフォルト値は1つの配列オブジェクトで、存在しないすべてのキーで共有されます。

    `h[:a] << 1` はデフォルトの配列に要素を追加するだけで、ハッシュへの代入は行われないため、キーは登録されません。結果としてハッシュは空のまま、デフォルトの配列が `[1, 2]` になります。

    キーごとに別の配列を持たせたいときは `Hash.new { |hash, key| hash[key] = [] }` と書きます。

