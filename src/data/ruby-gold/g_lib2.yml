# 組み込みライブラリ（追加分）
- cat: 組み込みライブラリ
  topic: Enumerator.produce
  q: 次のコードを実行するとどうなりますか。
  code: |
    p Enumerator.produce(1) { _1 * 2 }.take(5)
    p Enumerator.produce([0, 1]) { |a, b| [b, a + b] }.take(5).map(&:first)
  choices: ["[1, 2, 4, 8, 16]\n[0, 1, 1, 2, 3]", "[2, 4, 8, 16, 32]\n[0, 1, 1, 2, 3]", "[1, 2, 4, 8, 16]\n[1, 1, 2, 3, 5]", '!無限ループになる']
  answer: [0]
  verify: output
  exp: |
    `Enumerator.produce(初期値) { |前の値| 次の値 }` は、前の値から次の値を作り続ける無限の `Enumerator` です（Ruby 2.7 から）。最初の要素は初期値そのものです。

    `take` で必要な数だけ取り出せば止まります。2つ目は `[a, b]` の組を次々に作ってフィボナッチ数列を得ています。

- cat: 組み込みライブラリ
  topic: Enumerator#size
  q: 次のコードを実行するとどうなりますか。
  code: |
    p [1, 2, 3].each_slice(2).size
    p [1, 2, 3].map.size
    p loop.size
    p [1, 2, 3].select.with_index.size
  choices: ["2\n3\nInfinity\n3", "3\n3\nnil\n3", "2\n3\nnil\nnil", "2\n3\nInfinity\nnil"]
  answer: [0]
  verify: output
  exp: |
    `Enumerator#size` は、要素を実際に列挙せずに要素数を計算して返します。

    - `each_slice(2)` は 3 個を 2 個ずつに分けるので `2` です。
    - ブロックなしの `loop` は終わらない列挙なので `Float::INFINITY` です。
    - 計算できない場合は `nil` を返します（`Enumerator.new { }` など）。

- cat: 組み込みライブラリ
  topic: Lazy の評価順
  q: 次のコードを実行するとどうなりますか。
  code: |
    r = (1..4).lazy
              .map { |x| print "m#{x} "; x * 2 }
              .select { |x| print "s#{x} "; x > 2 }
              .first(1)
    puts
    p r
  choices: ["m1 s2 m2 s4 \n[4]", "m1 m2 m3 m4 s2 s4 s6 s8 \n[4]", "m1 s2 m2 s4 m3 s6 m4 s8 \n[4]", "m1 s2 \n[2]"]
  answer: [0]
  verify: output
  exp: |
    `lazy` を付けると、`map` → `select` を**1要素ずつ**通して処理します。`first(1)` で1つ見つかった時点で止まるので、`3` と `4` は処理されません。

    `lazy` なしだと、`map` がすべての要素を処理して配列を作ってから `select` が動くので、`m1 m2 m3 m4 s2 s4 s6 s8` の順になります。

- cat: 組み込みライブラリ
  topic: Lazy#eager と force
  q: 次のコードを実行するとどうなりますか。
  code: |
    lz = [3, 1, 2].lazy.map { _1 * 10 }
    p lz.class
    p lz.eager.class
    p lz.force
    p lz.sort
  choices: ["Enumerator::Lazy\nEnumerator\n[30, 10, 20]\n[10, 20, 30]", "Enumerator::Lazy\nEnumerator::Lazy\n[30, 10, 20]\n[10, 20, 30]", "Enumerator::Lazy\nArray\n[30, 10, 20]\n[10, 20, 30]", "Enumerator\nEnumerator\n[30, 10, 20]\n[10, 20, 30]"]
  answer: [0]
  verify: output
  exp: |
    - `eager` … 遅延評価をやめ、通常の `Enumerator` に戻します。以降の `map` などは配列を返すようになります。
    - `force`（`to_a`）… その場で評価して配列にします。
    - `sort` は `Lazy` で遅延版が定義されていないメソッドなので、呼んだ時点で評価されて配列を返します。

- cat: 組み込みライブラリ
  topic: Array.new の初期値
  q: 次のコードを実行するとどうなりますか。
  code: |
    a = Array.new(2, [])
    a[0] << 1
    b = Array.new(2) { [] }
    b[0] << 1
    c = Array.new(3) { |i| i * i }
    p a, b, c
  choices: ["[[1], [1]]\n[[1], []]\n[0, 1, 4]", "[[1], []]\n[[1], []]\n[0, 1, 4]", "[[1], [1]]\n[[1], [1]]\n[0, 1, 4]", "[[1], [1]]\n[[1], []]\n[1, 4, 9]"]
  answer: [0]
  verify: output
  exp: |
    `Array.new(n, obj)` は、**同じオブジェクト** `obj` を n 個並べます。`a[0]` と `a[1]` は同じ配列なので、片方への追加が両方に見えます。

    ブロックを渡すと、要素ごとにブロックが呼ばれ、別々のオブジェクトが作られます。ブロック引数は添字です。

- cat: 組み込みライブラリ
  topic: take_while / drop_while / chunk_while
  q: 次のコードを実行するとどうなりますか。
  code: |
    a = [1, 2, 4, 3, 5]
    p a.take_while { _1 < 4 }
    p a.drop_while { _1 < 4 }
    p a.chunk_while { |x, y| y > x }.to_a
  choices: ["[1, 2]\n[4, 3, 5]\n[[1, 2, 4], [3, 5]]", "[1, 2, 3]\n[4, 5]\n[[1, 2, 4], [3, 5]]", "[1, 2]\n[4, 3, 5]\n[[1, 2], [4], [3, 5]]", "[1, 2]\n[3, 5]\n[[1, 2, 4], [3, 5]]"]
  answer: [0]
  verify: output
  exp: |
    - `take_while` … 先頭から、条件が真の間だけ取り出します。偽になった時点で止まるので、あとにある `3` は含まれません。
    - `drop_while` … 条件が真の間を捨て、残りを返します。
    - `chunk_while` … 隣り合う2つで条件が真の間はまとめ、偽になったところで区切ります。

- cat: 組み込みライブラリ
  topic: rotate / cycle / bsearch
  q: 次のコードを実行するとどうなりますか。
  code: |
    a = [1, 2, 3]
    p a.rotate, a.rotate(-1)
    p a.cycle.first(5)
    p [1, 3, 5, 7].bsearch { _1 >= 4 }
  choices: ["[2, 3, 1]\n[3, 1, 2]\n[1, 2, 3, 1, 2]\n5", "[3, 1, 2]\n[2, 3, 1]\n[1, 2, 3, 1, 2]\n5", "[2, 3, 1]\n[3, 1, 2]\n[1, 2, 3]\n5", "[2, 3, 1]\n[3, 1, 2]\n[1, 2, 3, 1, 2]\n4"]
  answer: [0]
  verify: output
  exp: |
    - `rotate(n)` … 先頭の n 個を末尾に回した**新しい配列**を返します。負の数なら逆向きです。
    - `cycle` … 要素を無限に繰り返す `Enumerator` です。`first(5)` で5つだけ取り出せます。
    - `bsearch` … **ソート済み**の配列を二分探索します。ブロックが真になる最初の要素を返します。

- cat: 組み込みライブラリ
  topic: transpose / combination / permutation
  q: 次のコードを実行するとどうなりますか。
  code: |
    p [[1, 2], [3, 4], [5, 6]].transpose
    p [1, 2, 3, 4].combination(2).count
    p [1, 2, 3].permutation(2).first(3)
    p [[1, 2], [3]].transpose rescue p $!.class
  choices: ["[[1, 3, 5], [2, 4, 6]]\n6\n[[1, 2], [1, 3], [2, 1]]\nIndexError", "[[1, 3, 5], [2, 4, 6]]\n12\n[[1, 2], [1, 3], [2, 1]]\nIndexError", "[[1, 2, 3], [4, 5, 6]]\n6\n[[1, 2], [1, 3], [2, 3]]\nIndexError", "[[1, 3, 5], [2, 4, 6]]\n6\n[[1, 2], [1, 3], [2, 1]]\n[[1, 3], [2, nil]]"]
  answer: [0]
  verify: output
  exp: |
    - `transpose` … 行と列を入れ替えます。各要素の長さがそろっていないと `IndexError` です。
    - `combination(n)` … n 個を選ぶ組み合わせ（順序を区別しない）。4個から2個なら 6 通りです。
    - `permutation(n)` … n 個を並べる順列（順序を区別する）。

- cat: 組み込みライブラリ
  topic: max(n) と sort のブロック
  q: 次のコードを実行するとどうなりますか。
  code: |
    a = [5, 3, 9, 1]
    p a.max(2)
    p a.min_by(2) { -_1 }
    p a.sort { |x, y| y <=> x }
    p a.sort.reverse == a.sort_by { -_1 }
  choices: ["[9, 5]\n[9, 5]\n[9, 5, 3, 1]\ntrue", "9\n9\n[9, 5, 3, 1]\ntrue", "[9, 5]\n[1, 3]\n[9, 5, 3, 1]\ntrue", "[5, 9]\n[9, 5]\n[1, 3, 5, 9]\ntrue"]
  answer: [0]
  verify: output
  exp: |
    - `max(n)` / `min(n)` … 大きい（小さい）順に n 個を配列で返します。
    - `min_by(n) { }` … ブロックの値が小さい順に n 個。`-_1` が小さい順なので、元の値が大きい順です。
    - `sort { |x, y| y <=> x }` … ブロックで比較方法を決められます。`x` と `y` を逆にすると降順です。

- cat: 組み込みライブラリ
  topic: inject / reduce の初期値
  q: 次のコードを実行するとどうなりますか。
  code: |
    p [1, 2, 3].inject(10) { |sum, x| sum + x }
    p [1, 2, 3].reduce(:*)
    p [].inject(:+)
    p [].sum
    p %w[a b].inject { |s, x| s + x }
  choices: ["16\n6\nnil\n0\n\"ab\"", "16\n6\n0\n0\n\"ab\"", "6\n6\nnil\n0\n\"ab\"", "16\n6\nnil\nnil\n\"ab\""]
  answer: [0]
  verify: output
  exp: |
    - `inject(初期値) { |累積, 要素| }` … 初期値から始めて、ブロックの値を次の累積値にしていきます。
    - 初期値を省略すると先頭の要素が初期値になります。空の配列では `nil` を返します。
    - `sum` は初期値が `0` なので、空の配列でも `0` です。文字列を `sum` で連結するには `sum("")` と初期値を渡します。

- cat: 組み込みライブラリ
  topic: Float の足し算と sum
  q: 次のコードを実行するとどうなりますか。
  code: |
    a = [0.1] * 10
    p a.sum
    p a.inject(:+)
    p a.sum == 1.0
  choices: ["1.0\n0.9999999999999999\ntrue", "0.9999999999999999\n0.9999999999999999\nfalse", "1.0\n1.0\ntrue", "1\n1\ntrue"]
  answer: [0]
  verify: output
  exp: |
    `0.1` を2進数で正確に表せないため、普通に10回足すと誤差がたまって `0.9999999999999999` になります。

    `Array#sum`（と `Enumerable#sum`）は、浮動小数点数の誤差を小さくする補正（Kahan-Babuska の加算）を行うので、`1.0` になります。

- cat: 組み込みライブラリ
  topic: Float の丸め
  q: 次のコードを実行するとどうなりますか。
  code: |
    p 2.5.round, 3.5.round
    p 2.5.round(half: :even)
    p 12345.round(-2)
    p 1.99.floor(1), -1.5.ceil
  choices: ["3\n4\n2\n12300\n1.9\n-1", "2\n4\n2\n12300\n1.9\n-1", "3\n4\n2\n12345\n1.9\n-2", "3\n3\n2\n12300\n2.0\n-1"]
  answer: [0]
  verify: output
  exp: |
    - `round` は既定で**四捨五入**（0.5 は 0 から遠い方へ）です。`half: :even` を付けると偶数への丸め（銀行丸め）、`half: :down` で切り捨て側になります。
    - 負の桁数を渡すと、整数の上の桁で丸めます（`-2` は百の位）。
    - `floor(1)` は小数第1位で切り捨て、`ceil` は大きい方の整数（`-1.5` なら `-1`）です。

