  choices: ["\"AB\"\n[65, 66]\n\"aGVsbG8=\"\n\"hello\"", "\"6566\"\n[65, 66]\n\"aGVsbG8=\"\n\"hello\"", "\"AB\"\n[\"A\", \"B\"]\n\"aGVsbG8=\"\n\"hello\"", "\"AB\"\n[65, 66]\n\"hello\"\n\"aGVsbG8=\""]
  answer: [0]
  verify: output
  exp: |
    `Array#pack` はテンプレートに従って値をバイト列に詰め、`String#unpack` はその逆を行います。

    - `C` … 8ビットの符号なし整数（1バイト）。`*` は残りすべて。
    - `m` … Base64。`m0` は改行を入れない形式です。

    `unpack1` は結果の配列の最初の要素だけを返します。

- cat: 組み込みライブラリ
  topic: 文字と文字コード
  q: 次のコードを実行するとどうなりますか。
  code: |
    p "A".ord, 97.chr
    p "あ".ord.to_s(16)
    p "Ab".bytes, "あ".bytes.size
    p "abc".each_char.to_a == "abc".chars
  choices: ["65\n\"a\"\n\"3042\"\n[65, 98]\n3\ntrue", "65\n\"a\"\n\"3042\"\n[65, 98]\n1\ntrue", "\"65\"\n\"a\"\n\"3042\"\n[65, 98]\n3\ntrue", "65\n97\n\"3042\"\n[65, 98]\n3\ntrue"]
  answer: [0]
  verify: output
  exp: |
    - `ord` は最初の文字のコードポイント（Unicode の番号）、`Integer#chr` はその逆です。
    - `bytes` はバイト値の配列です。UTF-8 では「あ」は3バイトです。
    - `chars` は文字の配列、`each_char` は文字を1つずつたどる `Enumerator` を返します。

- cat: 組み込みライブラリ
  topic: Integer#times と each_with_index の Enumerator
  q: 次のコードを実行するとどうなりますか。
  code: |
    p 3.times.map { _1 * 2 }
    p %w[a b].each_with_index.to_a
    p %w[a b].each.with_index(1).map { |s, i| s * i }
    p 3.times.class
  choices: ["[0, 2, 4]\n[[\"a\", 0], [\"b\", 1]]\n[\"a\", \"bb\"]\nEnumerator", "[2, 4, 6]\n[[\"a\", 0], [\"b\", 1]]\n[\"a\", \"bb\"]\nEnumerator", "[0, 2, 4]\n[[0, \"a\"], [1, \"b\"]]\n[\"a\", \"bb\"]\nEnumerator", "[0, 2, 4]\n[[\"a\", 0], [\"b\", 1]]\n[\"\", \"b\"]\nArray"]
  answer: [0]
  verify: output
  exp: |
    ブロックなしで呼んだ繰り返しメソッドは `Enumerator` を返すので、`map` などをつなげられます。`3.times.map` は `0, 1, 2` を変換します。

    `each_with_index` は `[要素, 添字]` の組を作ります。`with_index(1)` で添字を 1 から始められます。
