  topic: 数値と文字列の基数変換
  q: 次のコードを実行するとどうなりますか。
  code: |
    p 255.to_s(2)
    p "ff".to_i(16)
    p "0b11".to_i(0)
    p "z".to_i(36)
    p Integer.sqrt(17), 10.bit_length
  choices: ["\"11111111\"\n255\n3\n35\n4\n4", "\"11111111\"\n255\n0\n35\n4\n4", "\"ff\"\n255\n3\n35\n4\n4", "\"11111111\"\n255\n3\n35\n4.123105625617661\n4"]
  answer: [0]
  verify: output
  exp: |
    - `Integer#to_s(基数)` / `String#to_i(基数)` で 2〜36 進数を相互に変換できます。
    - `to_i(0)` は接頭辞（`0b`、`0o`、`0x`）から基数を判断します。
    - `Integer.sqrt` は整数の平方根（切り捨て）、`bit_length` は2進数での桁数です。

- cat: 組み込みライブラリ
  topic: Float の特殊な値
  q: 次のコードを実行するとどうなりますか。
  code: |
    p 1 / 0.0
    p (0 / 0.0).nan?
    p Float::NAN == Float::NAN
    p 1.0.infinite?, (-1 / 0.0).infinite?
    1 / 0
  choices:
    - '5行出力された後、`ZeroDivisionError` が発生する'
    - '1行目で `ZeroDivisionError` が発生する'
    - '5行出力され、最後の行は `Infinity` を返す'
    - '3行出力された後、`ZeroDivisionError` が発生する'
  answer: [0]
  verify: run
  expect: {out: "Infinity\ntrue\nfalse\nnil\n-1", error: ZeroDivisionError}
  exp: |
    浮動小数点数の 0 で割ると、例外ではなく `Infinity`（無限大）や `NaN`（非数）になります。

    - `NaN` は自分自身とも等しくないので、`==` は `false` です。判定には `nan?` を使います。
    - `infinite?` は有限なら `nil`、正の無限大なら `1`、負の無限大なら `-1` を返します。

    整数どうしの `1 / 0` は `ZeroDivisionError` です。

- cat: 組み込みライブラリ
  topic: Range の step と %
  q: 次のコードを実行するとどうなりますか。
  code: |
    p (1.0..2.0).step(0.5).to_a
    p ((1..10) % 3).to_a
    p 1.step(10, 4).to_a
    p (1..10).sum, ("a".."c").sum("")
  choices: ["[1.0, 1.5, 2.0]\n[1, 4, 7, 10]\n[1, 5, 9]\n55\n\"abc\"", "[1.0, 1.5]\n[1, 4, 7]\n[1, 5, 9]\n55\n\"abc\"", "[1.0, 1.5, 2.0]\n[3, 6, 9]\n[1, 5, 9]\n55\n\"abc\"", '!`TypeError` が発生する']
  answer: [0]
  verify: output
  exp: |
    - `Range#step(n)` は n 刻みで列挙します。小数の範囲でも使えます。
    - `Range#%` は `step` の別名です（Ruby 2.6 から）。
    - `Integer#step(上限, 刻み)` も同じように数えます。
    - 整数の範囲の `sum` は公式で計算されます。文字列の範囲も `sum("")` で連結できます。

- cat: 組み込みライブラリ
  topic: String の分割と検索
  q: 次のコードを実行するとどうなりますか。
  code: |
    p "hello world ruby".partition(" ")
    p "a-b-c".rpartition("-")
    p "a,b,,c,,".split(",")
    p "a,b,,c,,".split(",", -1)
    p "a b  c".split
  choices: ["[\"hello\", \" \", \"world ruby\"]\n[\"a-b\", \"-\", \"c\"]\n[\"a\", \"b\", \"\", \"c\"]\n[\"a\", \"b\", \"\", \"c\", \"\", \"\"]\n[\"a\", \"b\", \"c\"]", "[\"hello\", \"world\", \"ruby\"]\n[\"a-b\", \"-\", \"c\"]\n[\"a\", \"b\", \"\", \"c\"]\n[\"a\", \"b\", \"\", \"c\", \"\", \"\"]\n[\"a\", \"b\", \"c\"]", "[\"hello\", \" \", \"world ruby\"]\n[\"a\", \"-\", \"b-c\"]\n[\"a\", \"b\", \"c\"]\n[\"a\", \"b\", \"\", \"c\", \"\", \"\"]\n[\"a\", \"b\", \"c\"]", "[\"hello\", \" \", \"world ruby\"]\n[\"a-b\", \"-\", \"c\"]\n[\"a\", \"b\", \"\", \"c\", \"\", \"\"]\n[\"a\", \"b\", \"\", \"c\", \"\", \"\"]\n[\"a\", \"b\", \"\", \"c\"]"]
  answer: [0]
  verify: output
  exp: |
    - `partition(sep)` … 最初の区切りで「前・区切り・後ろ」の3つに分けます。`rpartition` は最後の区切りで分けます。
    - `split(sep)` … 末尾の空文字列は取り除かれます。第2引数に負の数を渡すと、末尾の空文字列も残ります。
    - 引数なしの `split` は空白（連続した空白も1つとして）で分割します。

- cat: 組み込みライブラリ
  topic: tr / delete / squeeze / count
  q: 次のコードを実行するとどうなりますか。
  code: |
    s = "hello"
    p s.tr("el", "ip")
    p s.tr("a-y", "b-z")
    p s.delete("l"), "aaabbb".squeeze
    p s.count("lo"), s.count("a-z", "^l")
  choices: ["\"hippo\"\n\"ifmmp\"\n\"heo\"\n\"ab\"\n3\n3", "\"hippo\"\n\"ifmmp\"\n\"helo\"\n\"ab\"\n3\n3", "\"hippo\"\n\"ifmmp\"\n\"heo\"\n\"aabb\"\n2\n3", "\"hello\"\n\"ifmmp\"\n\"heo\"\n\"ab\"\n3\n5"]
  answer: [0]
  verify: output
  exp: |
    - `tr(from, to)` … 文字単位で置き換えます。`a-y` のような範囲や、`^` による否定も使えます。
    - `delete` … 指定した文字をすべて取り除きます。
    - `squeeze` … 連続した同じ文字を1つにまとめます。
    - `count` … 指定した文字の数を数えます。複数の引数を渡すと、すべてに当てはまる文字（積集合）を数えます。`"a-z"` かつ `"^l"`（l 以外）なので `h, e, o` の 3 です。

