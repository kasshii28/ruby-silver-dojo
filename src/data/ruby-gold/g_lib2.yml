    p "zz".succ
    p "a9".succ
    p "Zz".succ
    p ("a".."e").step(2).to_a
  choices: ["\"ba\"\n\"aaa\"\n\"b0\"\n\"AAa\"\n[\"a\", \"c\", \"e\"]", "\"b\"\n\"aaa\"\n\"b0\"\n\"AAa\"\n[\"a\", \"c\", \"e\"]", "\"ba\"\n\"zz{\"\n\"a10\"\n\"Za\"\n[\"a\", \"c\", \"e\"]", "\"ba\"\n\"aaa\"\n\"b0\"\n\"aaa\"\n[\"a\", \"b\", \"c\"]"]
  answer: [0]
  verify: output
  exp: |
    `succ`（`next`）は「次の」文字列を返します。英数字の右端を1つ進め、`z`→`a`、`Z`→`A`、`9`→`0` のように繰り上がると左の文字も進めます。左端で繰り上がると文字が1つ増えます（`"zz"` → `"aaa"`）。大文字小文字の種類は保たれます。

    文字列の範囲は `succ` を使って列挙されます。

