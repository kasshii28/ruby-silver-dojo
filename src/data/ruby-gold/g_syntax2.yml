# 文法・実行環境（追加分）
- cat: 実行環境
  topic: -a と -F
  q: '`printf "a:1\nb:2\n" | ruby -F: -lane ''print $F[1]''` を実行したときの出力として正しいものを選択してください。'
  choices: ["1\n2", "a\nb", "a:1\nb:2", "12"]
  cm: true
  answer: [0]
  verify: checks
  setup: 'out = IO.popen(["ruby", "-F:", "-lane", "print $F[1]"], "r+") { |io| io.write("a:1\nb:2\n"); io.close_write; io.read }'
  checks:
    - 'exit(out == "1\n2\n")'
    - 'exit(out == "a\nb\n")'
    - 'exit(out == "a:1\nb:2\n")'
    - 'exit(out == "12")'
  exp: |
    - `-n` … 各行について `while gets ... end` のように繰り返します。
    - `-a` … 読んだ行を分割して配列 `$F` に入れます（オートスプリット）。区切りは既定で空白です。
    - `-F:` … `-a` の区切り文字を `:` にします。
    - `-l` … 読んだ行の改行を取り除き、`print` の後に改行を付けます。

    `-lane` のようにまとめて書けますが、`-e` は直後にスクリプトが来るので最後に置きます。

- cat: 実行環境
  topic: -i（インプレース編集）
  q: '`data.txt` の中身が `hello` の1行のとき、`ruby -i.bak -pe ''$_.upcase!'' data.txt` を実行した結果として正しいものを選択してください。'
  choices:
    - '`data.txt` が `HELLO` に書き換わり、元の内容が `data.txt.bak` に残る'
    - '`data.txt.bak` に `HELLO` が書き出され、`data.txt` は変わらない'
    - '標準出力に `HELLO` が出力され、ファイルは変わらない'
    - '`.bak` という名前のファイルが作られる'
  answer: [0]
  verify: checks
  setup: 'File.write("data.txt", "hello\n"); out = IO.popen(["ruby", "-i.bak", "-pe", "$_.upcase!", "data.txt"], &:read)'
  checks:
    - 'exit(File.read("data.txt") == "HELLO\n" && File.read("data.txt.bak") == "hello\n")'
    - 'exit(File.exist?("data.txt.bak") && File.read("data.txt.bak") == "HELLO\n" && File.read("data.txt") == "hello\n")'
    - 'exit(out == "HELLO\n" && File.read("data.txt") == "hello\n")'
    - 'exit(File.exist?(".bak"))'
  exp: |
    `-i` は、引数のファイルを読みながら、出力でそのファイルを**書き換えます**（インプレース編集）。`-i.bak` のように拡張子を付けると、元のファイルを `data.txt.bak` として残します。

    `-p` と組み合わせると、各行を加工してファイルに書き戻す、という sed のような使い方ができます。標準出力には何も出ません。

- cat: 実行環境
  topic: require と load
  q: '`lib.rb` に `puts "loaded"` とだけ書かれているとき、次のコードを実行するとどうなりますか。'
  code: |
    p require "./lib"
    p require "./lib"
    p load "./lib.rb"
  choices: ["loaded\ntrue\nfalse\nloaded\ntrue", "loaded\ntrue\nloaded\ntrue\nloaded\ntrue", "loaded\ntrue\nfalse\ntrue", "loaded\ntrue\nfalse\nfalse"]
  answer: [0]
  verify: checks
  setup: 'File.write("lib.rb", "puts \"loaded\"\n"); File.write("main.rb", "p require \"./lib\"\np require \"./lib\"\np load \"./lib.rb\"\n"); out = IO.popen(["ruby", "main.rb"], &:read)'
  checks:
    - 'exit(out == "loaded\ntrue\nfalse\nloaded\ntrue\n")'
    - 'exit(out == "loaded\ntrue\nloaded\ntrue\nloaded\ntrue\n")'
    - 'exit(out == "loaded\ntrue\nfalse\ntrue\n")'
    - 'exit(out == "loaded\ntrue\nfalse\nfalse\n")'
  exp: |
    - `require` … 同じファイルは**1回だけ**読み込みます。読み込んだら `true`、すでに読み込み済みなら何もせず `false` を返します。拡張子 `.rb` は省略できます。
    - `load` … 呼ぶたびに**毎回**読み込んで実行します。拡張子は省略できません。

    読み込んだファイルは `$LOADED_FEATURES`（`$"`）に記録されます。`require_relative` は、呼び出したファイルのある場所を基準にパスを解決する `require` です。

- cat: 実行環境
  topic: exit と at_exit
  q: 次のコードを実行するとどうなりますか。
  code: |
    at_exit { puts "bye" }
    begin
      exit 2
    rescue SystemExit => e
      puts "status #{e.status}"
    ensure
      puts "ensure"
    end
    puts "after"
  choices: ["status 2\nensure\nafter\nbye", "ensure\nbye", "status 2\nensure\nbye", "bye\nstatus 2\nensure\nafter"]
  answer: [0]
  verify: output
  exp: |
    `exit` は `SystemExit` 例外を発生させてプログラムを終わらせます。例外なので `rescue SystemExit` で捕まえることもでき、`status` で終了ステータスを取り出せます。捕まえたのでプログラムは続き、`after` まで出力されます。

    `at_exit` に登録したブロックは、プログラムが終わる直前に実行されます。

    なお `exit!` は例外を使わずに即座に終了するので、`ensure` も `at_exit` も実行されません。

- cat: 実行環境
  topic: abort と終了ステータス
  q: '次のコードをファイルに保存して実行したとき、正しい説明を2つ選択してください。'
  code: |
    puts "start"
    abort "failed"
    puts "end"
  choices:
    - '`failed` は標準エラー出力に出力される'
    - '終了ステータスは `1` になる'
    - '`end` も出力される'
    - '終了ステータスは `0` になる'
  answer: [0, 1]
  verify: checks
  setup: 'require "open3"; File.write("a.rb", "puts \"start\"\nabort \"failed\"\nputs \"end\"\n"); out, err, st = Open3.capture3("ruby", "a.rb")'
  checks:
    - 'exit(err == "failed\n" && !out.include?("failed"))'
    - 'exit(st.exitstatus == 1)'
    - 'exit(out.include?("end"))'
    - 'exit(st.exitstatus == 0)'
  exp: |
    `abort(メッセージ)` は、メッセージを**標準エラー出力**に出してから、終了ステータス `1` でプログラムを終了します。`exit(false)` と同じく失敗を表す終了です。

    `exit` は既定で終了ステータス `0`（成功）、`exit(1)` や `exit(false)` で失敗を表せます。

- cat: 実行環境
  topic: __END__ と DATA
  q: 'ファイルに次の内容を書いて実行するとどうなりますか。'
  code: |
    DATA.each_line do |line|
      puts line.upcase
    end
    __END__
    apple
    banana
  choices: ["APPLE\nBANANA", "apple\nbanana", '!`NameError` が発生する', '!何も出力されない']
  answer: [0]
  verify: output
  exp: |
    行頭の `__END__` から後ろはプログラムとして解釈されず、その内容を定数 `DATA`（`File` オブジェクト）から読めます。小さなデータをスクリプトに同梱するときに使います。

    `DATA` が定義されるのは、`__END__` を含むファイルを**直接実行**したときだけです。

- cat: 実行環境
  topic: '$LOAD_PATH と $:'
  q: '`$LOAD_PATH` について正しい説明を2つ選択してください。'
  choices:
    - '`$:` は `$LOAD_PATH` の別名である'
    - '`ruby -I dir` で起動すると、`dir` が `$LOAD_PATH` に追加される'
    - '`require_relative` は `$LOAD_PATH` だけを探す'
    - '`$LOAD_PATH` は凍結されていて変更できない'
  answer: [0, 1]
  verify: checks
  checks:
    - 'exit($:.equal?($LOAD_PATH))'
    - 'exit(IO.popen(["ruby", "-I", "zzdir", "-e", "print $LOAD_PATH.any? { _1.end_with?(\"zzdir\") }"], &:read) == "true")'
    - 'Dir.mkdir("sub") unless Dir.exist?("sub"); File.write("sub/b.rb", "B = 1"); File.write("sub/a.rb", "require_relative \"b\"\np B"); exit(!system("ruby", "sub/a.rb", out: File::NULL, err: File::NULL))'
    - 'exit($LOAD_PATH.frozen?)'
  exp: |
    `require` はライブラリを `$LOAD_PATH`（別名 `$:`）に並んだディレクトリから順に探します。`ruby -I dir` や環境変数 `RUBYLIB` で追加でき、プログラムの中で `$LOAD_PATH.unshift(dir)` のように書き換えることもできます。

    `require_relative` は `$LOAD_PATH` を使わず、**そのファイル自身のある場所**を基準に探します。

- cat: 実行環境
  topic: ARGF と gets
  q: '`printf "x\ny\n" | ruby -e ''p gets; p ARGF.read''` の出力として正しいものを選択してください。'
  choices: ["\"x\\n\"\n\"y\\n\"", "\"x\"\n\"y\"", "\"x\\n\"\n\"x\\ny\\n\"", "\"x\\ny\\n\"\nnil"]
  cm: true
  answer: [0]
  verify: checks
  setup: 'out = IO.popen(["ruby", "-e", "p gets; p ARGF.read"], "r+") { |io| io.write("x\ny\n"); io.close_write; io.read }'
  checks:
    - "exit(out == %Q(\"x\\\\n\"\\n\"y\\\\n\"\\n))"
    - "exit(out == %Q(\"x\"\\n\"y\"\\n))"
    - "exit(out == %Q(\"x\\\\n\"\\n\"x\\\\ny\\\\n\"\\n))"
    - "exit(out == %Q(\"x\\\\ny\\\\n\"\\nnil\\n))"
  exp: |
    引数なしの `gets`（`Kernel#gets`）と `ARGF` は、コマンドライン引数にファイル名があればそのファイルを、なければ標準入力を読みます。

    `gets` は1行を改行付きで読み、続く `ARGF.read` はその続きを最後まで読みます。同じ入力をたどるので、2行目からになります。

- cat: 文法
  topic: break と next の値
  q: 次のコードを実行するとどうなりますか。
  code: |
    r1 = [1, 2, 3].each { |x| break x * 10 if x == 2 }
    r2 = [1, 2, 3].map { |x| next 0 if x == 2; x }
    r3 = [1, 2].each { }
    p r1, r2, r3
  choices: ["20\n[1, 0, 3]\n[1, 2]", "nil\n[1, 0, 3]\n[1, 2]", "20\n[1, 3]\n[1, 2]", "20\n[1, 0, 3]\nnil"]
  answer: [0]
  verify: output
  exp: |
    - `break 値` … ブロックを呼んだメソッド（`each`）をその場で終わらせ、その値がメソッドの戻り値になります。
    - `next 値` … そのブロックの1回分だけを終わらせ、その値がブロックの値になります。`map` では要素の変換結果です。
    - `each` は最後まで回ると**レシーバ自身**を返します。

- cat: 文法
  topic: loop と StopIteration
  q: 次のコードを実行するとどうなりますか。
  code: |
    e = [1, 2].each
    r = loop do
      p e.next
    end
    p r
  choices: ["1\n2\n[1, 2]", "1\n2\nnil", '!`StopIteration` が発生する', "1\n2\n2"]
  answer: [0]
  verify: output
  exp: |
    `loop` は `StopIteration` 例外を捕まえて繰り返しを終えます。`e.next` は要素がなくなると `StopIteration` を発生させるので、`loop` が自然に終わります。

    そのとき `loop` は `StopIteration#result`（列挙を終えたメソッドの戻り値。ここでは `each` が返す `[1, 2]`）を返します。

- cat: 文法
  topic: begin...end while
  q: 次のコードを実行するとどうなりますか。
  code: |
    i = 10
    begin
      i += 1
    end while i < 5
    j = 10
    j += 1 while j < 5
    p i, j
  choices: ["11\n10", "10\n10", "11\n11", "5\n5"]
  answer: [0]
  verify: output
  exp: |
    `begin ... end while 条件` は、**先に1回本体を実行してから**条件を調べます（do-while に相当）。そのため `i` は条件が偽でも1回足されて `11` です。

    1つの式に付けた `式 while 条件` は通常の `while` と同じで、条件が最初から偽なら一度も実行しません。

- cat: 文法
  topic: begin/rescue/else/ensure の順番
  q: 次のコードを実行するとどうなりますか。
  code: |
    def run(n)
      puts "body #{n}"
      raise "x" if n == 1
    rescue
      puts "rescue"
    else
      puts "else"
    ensure
      puts "ensure"
    end
    run(1)
    run(2)
  choices: ["body 1\nrescue\nensure\nbody 2\nelse\nensure", "body 1\nrescue\nelse\nensure\nbody 2\nelse\nensure", "body 1\nrescue\nensure\nbody 2\nensure", "body 1\nensure\nrescue\nbody 2\nelse\nensure"]
  answer: [0]
  verify: output
  exp: |
    - `rescue` … 本体で例外が発生したときだけ実行されます。
    - `else` … 本体で例外が**発生しなかった**ときだけ実行されます。
    - `ensure` … どちらの場合も最後に必ず実行されます。

    書く順番も `rescue` → `else` → `ensure` と決まっています。

- cat: 文法
  topic: ensureの中のreturn
  q: 次のコードを実行するとどうなりますか。
  code: |
    def risky
      raise "boom"
    ensure
      return "from ensure"
    end
    p risky
  choices: ['"from ensure"', '!`RuntimeError` が発生する', 'nil', '"boom"']
  answer: [0]
  verify: output
  exp: |
    `ensure` の中で明示的に `return` すると、その値がメソッドの戻り値になり、発生中の例外は**捨てられます**。

    例外が気づかないうちに消えてしまうので、`ensure` の中で `return` を書くのは避けるべき書き方です（Ruby も警告を出すことがあります）。

- cat: 文法
  topic: rescue で複数の例外
  q: 次のコードを実行するとどうなりますか。
  code: |
    [nil, "a", 0].each do |v|
      begin
        v + 1
        1 / v
      rescue NoMethodError, TypeError => e
        puts "type: #{e.class}"
      rescue ZeroDivisionError
        puts "zero"
      end
    end
  choices: ["type: NoMethodError\ntype: TypeError\nzero", "type: NoMethodError\ntype: NoMethodError\nzero", "type: NoMethodError\nzero\nzero", "type: TypeError\ntype: TypeError\nzero"]
  answer: [0]
  verify: output
  exp: |
    `rescue A, B => e` のように、1つの節に複数の例外クラスを並べられます。

    - `nil + 1` … `nil` に `+` メソッドがないので `NoMethodError`
    - `"a" + 1` … `String#+` に整数を渡したので `TypeError`
    - `0 + 1` は成功し、`1 / 0` で `ZeroDivisionError`

- cat: 文法
  topic: Exception#cause
  q: 次のコードを実行するとどうなりますか。
  code: |
    begin
      begin
        Integer("x")
      rescue ArgumentError
        raise KeyError, "wrapped"
      end
    rescue => e
      p e.class
      p e.cause.class
    end
  choices: ["KeyError\nArgumentError", "KeyError\nNilClass", "ArgumentError\nKeyError", "KeyError\nRuntimeError"]
  answer: [0]
  verify: output
  exp: |
    `rescue` の中で別の例外を `raise` すると、新しい例外の `cause` に、そのとき処理していた元の例外が自動で記録されます。

    例外を包み直しても元の原因をたどれるので、ログやデバッグで役立ちます。

- cat: 文法
  topic: raise の引数
  q: 次のコードを実行するとどうなりますか。
  code: |
    def try
      yield
    rescue => e
      "#{e.class}: #{e.message}"
    end
    p try { raise "plain" }
    p try { raise ArgumentError }
    p try { raise IOError.new("io") }
  choices: ["\"RuntimeError: plain\"\n\"ArgumentError: ArgumentError\"\n\"IOError: io\"", "\"StandardError: plain\"\n\"ArgumentError: \"\n\"IOError: io\"", "\"RuntimeError: plain\"\n\"ArgumentError: \"\n\"IOError: io\"", "\"RuntimeError: plain\"\n\"ArgumentError: ArgumentError\"\n\"IOError: IOError\""]
  answer: [0]
  verify: output
  exp: |
    - `raise "文字列"` … `RuntimeError` をそのメッセージで発生させます。
    - `raise クラス` … メッセージなしで作るので、メッセージは**クラス名**になります。
    - `raise 例外オブジェクト` … そのオブジェクトをそのまま発生させます。

    `raise クラス, "メッセージ"` の形も使えます。

- cat: 文法
  topic: defined?
  q: 次のコードを実行するとどうなりますか。
  code: |
    x = 1
    p defined?(x)
    p defined?(@y)
    p defined?(puts)
    p defined?(String)
    p defined?(zzz)
  choices: ["\"local-variable\"\nnil\n\"method\"\n\"constant\"\nnil", "\"local-variable\"\n\"instance-variable\"\n\"method\"\n\"constant\"\nnil", "\"local-variable\"\nnil\n\"method\"\n\"constant\"\n\"method\"", "true\nfalse\ntrue\ntrue\nfalse"]
  answer: [0]
  verify: output
  exp: |
    `defined?(式)` は、式が定義されていれば種類を表す文字列を、未定義なら `nil` を返します。`defined?` はメソッドではなく演算子なので、未定義の名前を書いても `NameError` になりません。

    - 代入されていないインスタンス変数 `@y` は `nil` です（代入済みなら `"instance-variable"`）。
    - 未定義の名前 `zzz` は `nil` です。
    - 主な戻り値は `"local-variable"`、`"instance-variable"`、`"method"`、`"constant"`、`"expression"`、`"yield"`、`"super"` などです。

- cat: 文法
  topic: block_given? と yield
  q: 次のコードを実行するとどうなりますか。
  code: |
    def wrap
      return "no block" unless block_given?
      "<" + yield + ">"
    end
    p wrap
    p wrap { "hi" }
    def bare = yield
    bare
  choices:
    - '`"no block"` と `"<hi>"` が出力された後、`LocalJumpError` が発生する'
    - '`"no block"` と `"<hi>"` が出力された後、`nil` が出力される'
    - '`"<>"` と `"<hi>"` が出力された後、`LocalJumpError` が発生する'
    - '1つ目の `wrap` で `LocalJumpError` が発生する'
  answer: [0]
  verify: run
  expect: {out: "\"no block\"\n\"<hi>\"", error: LocalJumpError}
  exp: |
    `block_given?` は、そのメソッドにブロックが渡されたかを調べます。ブロックなしで `yield` すると `LocalJumpError`（`no block given (yield)`）が発生します。

- cat: 文法
  topic: superとブロック
  q: 次のコードを実行するとどうなりますか。
  code: |
    class Base
      def each_item
        [1, 2].each { |x| yield x }
      end
    end
    class Child < Base
      def each_item
        super
      end
    end
    Child.new.each_item { |x| print x * 10, " " }
    puts
  choices: ['10 20 ', '1 2 ', '!`LocalJumpError` が発生する', '!何も出力されない']
  answer: [0]
  verify: output
  exp: |
    `super` は、明示しなくても**呼び出し元に渡されたブロックも親のメソッドに引き継ぎます**（`super()` と書いた場合も同じです）。

    ブロックを渡したくないときは `super(&nil)` と書きます。

- cat: 文法
  topic: ブロックローカル変数
  q: 次のコードを実行するとどうなりますか。
  code: |
    x = 10
    y = 20
    [1, 2].each do |i; y|
      y = i
      x += i
    end
    p x, y
  choices: ["13\n20", "13\n2", "10\n20", "10\n2"]
  answer: [0]
  verify: output
  exp: |
    ブロック引数の後ろに `; 変数名` と書くと、そのブロックだけのローカル変数（ブロックローカル変数）になります。外側に同じ名前の変数があっても、別の変数として扱われます。

    `x` は普通に外側の変数を参照するので、ブロックの中の変更が外にも残ります。

- cat: 文法
  topic: def とローカル変数のスコープ
  q: 次のコードを実行するとどうなりますか。
  code: |
    count = 0
    increment = -> { count += 1 }
    increment.call
    define_method(:show) { count }
    def plain = count
    p show
    p plain
  choices:
    - '`1` が出力された後、`NameError` が発生する'
    - '`1` と `1` が出力される'
    - '`0` が出力された後、`NameError` が発生する'
    - '`define_method` の行で `NoMethodError` が発生する'
  answer: [0]
  verify: run
  expect: {out: "1", error: NameError}
  exp: |
    `def` は新しいスコープを作るので、外側のローカル変数 `count` は見えません。`plain` の中の `count` はメソッド呼び出しとして探され、見つからず `NameError`（`undefined local variable or method`）です。

    ブロック（`->`、`define_method` のブロック）はクロージャなので、外側の `count` を読み書きできます。

- cat: 文法
  topic: '||= と &&='
  q: 次のコードを実行するとどうなりますか。
  code: |
    a = nil
    a ||= 1
    a ||= 2
    b = false
    b &&= 3
    c = 4
    c &&= c * 10
    h = {}
    h[:k] ||= []
    h[:k] << 5
    p a, b, c, h
  choices: ["1\nfalse\n40\n{:k=>[5]}", "2\nfalse\n40\n{:k=>[5]}", "1\n3\n40\n{:k=>[5]}", "1\nfalse\n4\n{}"]
  answer: [0]
  verify: output
  exp: |
    - `a ||= x` … `a || (a = x)` と同じで、`a` が `nil` か `false` のときだけ代入します。2回目は `a` が `1` なので代入されません。
    - `a &&= x` … `a && (a = x)` と同じで、`a` が真のときだけ代入します。

    ハッシュの値を初期化しながら使う `h[:k] ||= []` は定番の書き方です。

- cat: 文法
  topic: 複数の戻り値
  q: 次のコードを実行するとどうなりますか。
  code: |
    def minmax(a) = return a.min, a.max
    r = minmax([3, 1, 2])
    lo, hi = minmax([3, 1, 2])
    p r, lo, hi
  choices: ["[1, 3]\n1\n3", "1\n1\n3", '!文法エラーが発生する', "[1, 3]\n[1, 3]\nnil"]
  answer: [0]
