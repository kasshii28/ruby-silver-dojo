  exp: |
    `return a, b` のように複数の値を返すと、配列 `[a, b]` が返ります。受け取る側で多重代入すれば、別々の変数に分けられます。

    1行のメソッド定義 `def name(引数) = 式` の本体にも `return` を書けます。

- cat: 文法
  topic: ハッシュの省略記法
  q: 次のコードを実行するとどうなりますか。
  code: |
    name = "Ann"
    age = 20
    def show(name:, age:) = "#{name}(#{age})"
    h = {name:, age:}
    p h
    p show(name:, age:)
  choices: ["{:name=>\"Ann\", :age=>20}\n\"Ann(20)\"", '!文法エラーが発生する', "{:name=>nil, :age=>nil}\n\"(\"", "{\"name\"=>\"Ann\", \"age\"=>20}\n\"Ann(20)\""]
  answer: [0]
  verify: output
