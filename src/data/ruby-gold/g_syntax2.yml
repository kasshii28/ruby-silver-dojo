  answer: [0]
  verify: output
  exp: |
    Ruby の既定値の式は、**呼び出しのたびに評価されます**。そのため `list = []` は毎回新しい空配列になり、Python のように前回の配列が残ることはありません。

    `stamp` の既定値も呼ぶたびに評価されて `@n` が増えます。引数を渡したとき（`stamp(10)`）は既定値の式は評価されないので、`@n` は増えません。
