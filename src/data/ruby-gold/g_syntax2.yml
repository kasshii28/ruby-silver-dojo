    Ruby 3.1 から、ハッシュリテラルやキーワード引数で `{name:}` と書くと `{name: name}` の省略形になります。同じ名前のローカル変数（またはメソッド）の値が使われます。

    ※ ハッシュの表示は Ruby 3.4 から `{name: "Ann", age: 20}` の形に変わりました。

- cat: 文法
  topic: 無名のブロック引数
  q: 次のコードを実行するとどうなりますか。
  code: |
    def each_twice(&)
      [1, 2].each(&)
      [1, 2].each(&)
    end
    sum = 0
    each_twice { sum += _1 }
    p sum
  choices: ['6', '3', '!文法エラーが発生する', '0']
  answer: [0]
  verify: output
  exp: |
    Ruby 3.1 から、ブロック引数を名前なしで `&` と書き、そのまま別のメソッドに `&` で渡せるようになりました。`def m(&block) ... each(&block)` と同じ意味です。

    ブロックは2回の `each` で合計4回呼ばれ、`1 + 2 + 1 + 2 = 6` です。

- cat: 文法
  topic: 1行メソッド定義
  q: 1行のメソッド定義（endless method）として**文法エラーになる**ものを選択してください。
  choices:
    - 'def square(x) = x * x'
    - 'def hello = "hi"'
    - 'def name=(v) = @name = v'
    - 'def self.zero = 0'
  cm: true
  answer: [2]
  verify: checks
  checks:
    - 'begin; eval("def square(x) = x * x"); exit(false); rescue SyntaxError; exit(true); end'
    - 'begin; eval("def hello = \"hi\""); exit(false); rescue SyntaxError; exit(true); end'
    - 'begin; eval("def name=(v) = @name = v"); exit(false); rescue SyntaxError; exit(true); end'
    - 'begin; eval("def self.zero = 0"); exit(false); rescue SyntaxError; exit(true); end'
  exp: |
    Ruby 3.0 から、`def メソッド名(引数) = 式` の形で `end` のないメソッドを定義できます。引数なしならかっこも省略できます。

    ただし `name=` のような**セッターメソッド**は、`=` が紛らわしいため1行定義が禁止されています。

- cat: 文法
  topic: パターンマッチ（代替パターンと残り）
  q: 次のコードを実行するとどうなりますか。
  code: |
    def kind(v)
      case v
      in 0 | 1 then "bit"
      in Integer | Float => n if n.negative? then "negative"
      in [first, *rest] then "list #{first} +#{rest.size}"
      in String then "str"
      else "other"
      end
    end
    p kind(1), kind(-2.5), kind([7, 8, 9]), kind(:s)
  choices: ["\"bit\"\n\"negative\"\n\"list 7 +2\"\n\"other\"", "\"bit\"\n\"other\"\n\"list 7 +2\"\n\"str\"", "\"bit\"\n\"negative\"\n\"list 7 +3\"\n\"other\"", "\"other\"\n\"negative\"\n\"list 7 +2\"\n\"other\""]
  answer: [0]
  verify: output
  exp: |
    - `0 | 1` … 代替パターン。どれかに一致すれば成功です。
    - `Integer | Float => n` … クラスで照合（`===`）し、一致した値を `n` に束縛します。ガード節 `if` で条件を追加しています。
    - `[first, *rest]` … 先頭を `first` に、残りを配列 `rest` に取り出します。
    - シンボル `:s` は `String` ではないので `else` です。

    `in 条件 then 式` のように、`then` で1行に書くこともできます。

- cat: 文法
  topic: 右代入の失敗
  q: 次のコードを実行するとどうなりますか。
  code: |
    config = {port: 80}
    begin
      config => {host:}
    rescue NoMatchingPatternKeyError => e
      p e.key
    end
    ok = (config in {port: 1..1024})
    p ok
  choices: [":host\ntrue", "nil\ntrue", ":host\nfalse", '!`NoMatchingPatternError` が発生して停止する']
  answer: [0]
  verify: output
  exp: |
    `式 => パターン` は、一致しないと例外を発生させます。ハッシュパターンでキーが見つからないときは `NoMatchingPatternKeyError`（`NoMatchingPatternError` のサブクラス）で、`key` で足りないキーを取り出せます。

    パターンには範囲も使えます。`80` は `1..1024` に含まれるので `true` です。`in` は代入より優先順位が低いので、結果を変数に入れるときはかっこで囲みます。

- cat: 文法
  topic: case と ===
  q: 次のコードを実行するとどうなりますか。
  code: |
    def check(v)
      case v
      when ->(x) { x.respond_to?(:each) } then "enumerable"
      when /\A\d+\z/ then "digits #{$~[0]}"
      when Numeric then "number"
      when nil then "nil"
      end
    end
    p check([1]), check("42"), check(3.0), check(nil), check(:x)
  choices: ["\"enumerable\"\n\"digits 42\"\n\"number\"\n\"nil\"\nnil", "\"enumerable\"\n\"digits 42\"\n\"number\"\n\"nil\"\n\"nil\"", "nil\n\"digits 42\"\n\"number\"\n\"nil\"\nnil", "\"enumerable\"\n\"enumerable\"\n\"number\"\n\"nil\"\nnil"]
  answer: [0]
  verify: output
  exp: |
    `case` の `when` は `when の値 === 対象` で比べます。`===` の意味は値の種類によって違います。

    - `Proc#===` … その Proc を呼んだ結果
    - `Regexp#===` … マッチするか（マッチ情報は `$~` に入ります）
    - `Class#===` … そのクラス（またはサブクラス）のインスタンスか
    - `nil` などの値 … `==`

    どれにも一致せず `else` もないと、`case` 式の値は `nil` です。

- cat: 文法
  topic: 演算子メソッドの定義
  q: 次のコードを実行するとどうなりますか。
  code: |
    class Vec
      attr_reader :x, :y
      def initialize(x, y) = (@x, @y = x, y)
      def +(o) = Vec.new(x + o.x, y + o.y)
      def -@ = Vec.new(-x, -y)
      def [](i) = i.zero? ? x : y
      def ==(o) = o.is_a?(Vec) && x == o.x && y == o.y
      def to_s = "(#{x}, #{y})"
    end
    a = Vec.new(1, 2)
    puts a + Vec.new(3, 4)
    puts(-a)
    p a[1], a == Vec.new(1, 2), a != Vec.new(1, 2)
  choices: ["(4, 6)\n(-1, -2)\n2\ntrue\nfalse", "(4, 6)\n(-1, -2)\n2\ntrue\ntrue", "(4, 6)\n(1, 2)\n2\ntrue\nfalse", '!`NoMethodError` が発生する']
  answer: [0]
  verify: output
  exp: |
    多くの演算子はメソッドとして定義できます。

    - 2項演算子 `+`、`-`、`*`、`==`、`<=>` など
    - 単項のマイナス・プラスは `-@`・`+@` という名前で定義します。
    - 添字の `[]` と `[]=`

    `!=` は `==` の結果を反転して自動的に使われるので、`==` を定義すれば `!=` も期待どおり動きます。

- cat: 文法
  topic: coerce
  q: 次のコードを実行するとどうなりますか。
  code: |
    class Meter
      attr_reader :v
      def initialize(v) = @v = v
      def *(n) = Meter.new(v * n)
      def coerce(n) = [self, n]
      def inspect = "#{v}m"
    end
    p Meter.new(2) * 3
    p 3 * Meter.new(2)
  choices: ["6m\n6m", "6m\n!`TypeError` が発生する", '!1行目で `TypeError` が発生する', "6m\n6"]
  answer: [0]
  verify: output
  exp: |
    `3 * Meter.new(2)` は `Integer#*` が呼ばれますが、`Integer` は `Meter` との掛け算を知りません。このとき Ruby は相手の `coerce(3)` を呼び、返された `[a, b]` で `a * b` を計算し直します。

    ここでは `[self, 3]` を返すので `Meter.new(2) * 3` が呼ばれ、`6m` になります。`coerce` を定義しないと `TypeError` です。

- cat: 文法
  topic: 文字列リテラルの種類
  q: 次のコードを実行するとどうなりますか。
  code: |
    n = 1
    p %w[a#{n} b]
    p %W[a#{n} b]
    p %i[x y]
    p %q(it's #{n})
    p ?a + ?b
  choices: ["[\"a\\#{n}\", \"b\"]\n[\"a1\", \"b\"]\n[:x, :y]\n\"it's \\#{n}\"\n\"ab\"", "[\"a1\", \"b\"]\n[\"a1\", \"b\"]\n[:x, :y]\n\"it's 1\"\n\"ab\"", "[\"a\\#{n}\", \"b\"]\n[\"a1\", \"b\"]\n[\"x\", \"y\"]\n\"it's \\#{n}\"\n\"ab\"", "[\"a\\#{n}\", \"b\"]\n[\"a1\", \"b\"]\n[:x, :y]\n\"it's 1\"\n\"ab\""]
  answer: [0]
  verify: output
  exp: |
    - `%w[]` は文字列の配列で、式展開しません（シングルクォート相当）。`%W[]` は式展開します。
    - `%i[]` はシンボルの配列です（`%I[]` は式展開あり）。
    - `%q()` はシングルクォート、`%Q()`（または `%()`）はダブルクォートの文字列です。
    - `?a` は1文字の文字列 `"a"` です。

    `p` は `#{` を含む文字列を表示するとき、式展開と区別するため `\#{` とエスケープして表示します。

- cat: 文法
  topic: 整数の除算と剰余
  q: 次のコードを実行するとどうなりますか。
  code: |
    p(-7 / 2)
    p(-7 % 3)
    p 7.remainder(-3)
    p(-7.fdiv(2).round)
  choices: ["-4\n2\n1\n-4", "-3\n-1\n1\n-3", "-4\n-1\n-1\n-4", "-3\n2\n1\n-4"]
  answer: [0]
  verify: output
  exp: |
    Ruby の整数の `/` は**負の無限大の方向に切り捨て**ます。`-7 / 2` は `-3.5` を切り捨てて `-4` です。

    `%`（`modulo`）は `a == (a / b) * b + a % b` を満たすように決まるので、結果は**割る数と同じ符号**です（`-7 % 3` は `2`）。`remainder` は割られる数と同じ符号の余りを返します（`7.remainder(-3)` は `1`）。

    `-3.5.round` は、0.5 を 0 から遠い方に丸めるので `-4` です。

- cat: 文法
  topic: BEGIN と END
  q: 次のコードを実行するとどうなりますか。
  code: |
    puts "main"
    END { puts "END" }
    at_exit { puts "at_exit" }
    BEGIN { puts "BEGIN" }
  choices: ["BEGIN\nmain\nat_exit\nEND", "BEGIN\nmain\nEND\nat_exit", "main\nBEGIN\nEND\nat_exit", "BEGIN\nmain\nEND"]
  answer: [0]
  verify: output
  exp: |
    - `BEGIN { }` … ファイルのどこに書いても、プログラムの最初に実行されます。
    - `END { }` と `at_exit { }` … プログラムの終了時に実行されます。**登録したのと逆の順番**で実行されるので、後から登録した `at_exit` が先です。

    `END` は実行されたときに1回だけ登録されます（ループの中でも1回だけ）。

- cat: 文法
  topic: 条件式としての範囲と正規表現
  q: 次のコードを実行するとどうなりますか。
  code: |
    s = "2024-05-06"
    if s =~ /(\d+)-(\d+)/
      p [$1, $2, $~.post_match]
    end
    p $1
    "x" =~ /y/
    p $1
  choices: ["[\"2024\", \"05\", \"-06\"]\n\"2024\"\nnil", "[\"2024\", \"05\", \"-06\"]\nnil\nnil", "[\"2024\", \"05\", \"06\"]\n\"2024\"\nnil", "[\"2024\", \"05\", \"-06\"]\n\"2024\"\n\"2024\""]
  answer: [0]
  verify: output
  exp: |
    `=~` でマッチすると、`$~`（`MatchData`）と `$1`, `$2`, … が設定されます。これらはそのメソッド（スコープ）の中で、**次にマッチを試すまで**残ります。`if` の外でも参照できます。

    マッチに失敗すると `$~` は `nil` になり、`$1` も `nil` になります。

- cat: 文法
  topic: メソッドの戻り値（each / times / map）
  q: 次のコードを実行するとどうなりますか。
  code: |
    a = 3.times { |i| i * 2 }
    b = [1, 2].each_with_index { }
    c = {x: 1}.each { }
    d = 1.upto(3) { }
    p a, b, c, d
  choices: ["3\n[1, 2]\n{:x=>1}\n1", "[0, 2, 4]\n[1, 2]\n{:x=>1}\n[1, 2, 3]", "nil\nnil\nnil\nnil", "3\n[[1, 0], [2, 1]]\n{:x=>1}\n3"]
  answer: [0]
  verify: output
  exp: |
    繰り返しのためのメソッドの多くは、ブロックの値を集めずに**レシーバ自身**を返します。

    - `3.times { }` は `3`、`1.upto(3) { }` は `1`
    - `each` や `each_with_index` は配列・ハッシュ自身

    ブロックの値を集めたいときは `map` を使います（`3.times.map { |i| i * 2 }` は `[0, 2, 4]`）。

- cat: 文法
  topic: 可変長引数とキーワード引数の受け取り
  q: 次のコードを実行するとどうなりますか。
  code: |
    def show(*args, **opts, &blk)
      [args, opts, blk&.call]
    end
    p show(1, 2, a: 3) { :b }
    p show({a: 1})
    p show(**{})
  choices: ["[[1, 2], {:a=>3}, :b]\n[[{:a=>1}], {}, nil]\n[[], {}, nil]", "[[1, 2], {:a=>3}, :b]\n[[], {:a=>1}, nil]\n[[], {}, nil]", "[[1, 2, {:a=>3}], {}, :b]\n[[{:a=>1}], {}, nil]\n[[], {}, nil]", "[[1, 2], {:a=>3}, :b]\n[[{:a=>1}], {}, nil]\n[[{}], {}, nil]"]
  answer: [0]
  verify: output
  exp: |
    - `*args` … 位置引数をすべて配列で受け取ります。
    - `**opts` … キーワード引数をすべてハッシュで受け取ります。
    - `&blk` … ブロックを `Proc` で受け取ります（なければ `nil`）。

    Ruby 3.0 からは、`{a: 1}` のように**波かっこで書いたハッシュは位置引数**として扱われ、`**opts` には入りません。空のハッシュを `**{}` で展開すると、何も渡さないのと同じです。

- cat: 文法
  topic: メソッド呼び出しのかっこと優先順位
  q: 次のコードを実行するとどうなりますか。
  code: |
    def twice(x) = x * 2
    a = twice 1 + 2
    b = twice(1) + 2
    c = [1, 2].map do |x| x * 10 end
    p a, b, c
  choices: ["6\n4\n[10, 20]", "4\n4\n[10, 20]", "6\n4\n#<Enumerator: [1, 2]:map>", "6\n6\n[10, 20]"]
  answer: [0]
  verify: output
  exp: |
    かっこを省略すると、残りの式全体が引数になります。`twice 1 + 2` は `twice(1 + 2)` で `6` です。

    `do ... end` は `{ }` より結合が弱いですが、`c = [1, 2].map do ... end` の場合は `map` にブロックが渡されます。`p [1, 2].map do ... end` のように**メソッドの引数の中**で使うと、`do` のブロックは外側の `p` に渡されてしまう点に注意しましょう。

- cat: 文法
  topic: do...end と { } の結合
  q: 次のコードを実行するとどうなりますか。
  code: |
    def show(v)
      block_given? ? "#{v.inspect} + block" : v.inspect
    end
    puts show [1, 2].map { |x| x * 2 }
    puts show [1, 2].map do |x| x * 2 end
  choices: ["[2, 4]\n#<Enumerator: [1, 2]:map>", "[2, 4]\n#<Enumerator: [1, 2]:map> + block", "[2, 4]\n[2, 4]", "[2, 4]\n[2, 4] + block"]
  answer: [0]
  verify: output
  exp: |
    - `{ }` は直前のメソッド（`map`）に強く結び付きます。
    - `do ... end` は結合が弱く、かっこを省略して呼んでいる**いちばん外側のメソッド**（ここでは `puts`）に渡されます。

    2行目は `puts(show([1, 2].map)) do ... end` と解釈されます。`map` はブロックなしなので `Enumerator` を返し、`show` にもブロックは渡りません。`puts` はブロックを使わないので、ブロックは無視されます。

    かっこを付けて `show([1, 2].map do ... end)` のように書けば、意図どおり `map` に渡せます。

- cat: 文法
  topic: 定数の参照と class_eval
  q: 次のコードを実行するとどうなりますか。
  code: |
    X = "top"
    class Foo
      X = "foo"
    end
    p Foo.class_eval { X }
    p Foo.class_eval("X")
    p Foo::X
  choices: ["\"top\"\n\"foo\"\n\"foo\"", "\"foo\"\n\"foo\"\n\"foo\"", "\"top\"\n\"top\"\n\"foo\"", "\"foo\"\n\"top\"\n\"foo\""]
  answer: [0]
  verify: output
  exp: |
    定数はソースコードの書かれた場所（レキシカルスコープ）から探されます。

    - ブロック版の `class_eval { X }` … ブロックはトップレベルに書かれているので、トップレベルの `X`（`"top"`）が見つかります。`self` は `Foo` に変わっても、定数の探索範囲は変わりません。
    - 文字列版の `class_eval("X")` … 文字列は `Foo` の中で書かれたものとして解釈されるので、`Foo::X` です。

- cat: 文法
  topic: 文字列の凍結とchilled string
  q: 次のコードを実行するとどうなりますか（マジックコメントはなし）。
  code: |
    a = "abc"
    b = :sym.to_s
    c = 1.to_s
    p a.frozen?, :sym.frozen?, 1.frozen?, nil.frozen?
    p "x".equal?("x")
  choices: ["false\ntrue\ntrue\ntrue\nfalse", "true\ntrue\ntrue\ntrue\ntrue", "false\nfalse\nfalse\nfalse\nfalse", "false\ntrue\ntrue\nfalse\nfalse"]
  answer: [0]
  verify: output
  exp: |
    マジックコメントがなければ、文字列リテラルは評価のたびに**新しい、凍結されていない**文字列を作ります。そのため同じ内容でも `equal?` は `false` です。

    シンボル・整数・`nil`・`true`・`false` は最初から凍結されています（変更できない値）。

    ※ Ruby 3.4 からは、文字列リテラルを変更すると警告が出る「chilled string」になりましたが、`frozen?` は `false` のままです。

- cat: 文法
  topic: 再帰とデフォルト引数の評価
