  checks:
    - "Mixin.greet\nbegin; SomeClass.greet; exit(false); rescue NoMethodError; exit(true); end"
    - "begin; Mixin.greet; exit(false); rescue NoMethodError; end\nSomeClass.greet"
    - "Mixin.greet\nSomeClass.greet"
    - "begin; Mixin.greet; exit(false); rescue NoMethodError; end\nbegin; SomeClass.greet; exit(false); rescue NoMethodError; exit(true); end"
  exp: |
    `def self.greet` はモジュール `Mixin` 自身の特異メソッドです。`Mixin.greet` とは呼べますが、`include` してもクラスには引き継がれません（`include` で取り込まれるのはインスタンスメソッドだけです）。そのため `SomeClass.greet` は `NoMethodError` です。

    モジュール関数として呼べて、`include` もできるメソッドを作るには `module_function` を使います。

    **公式版からの修正**: 選択肢 D の「`Hello World!`を例外を発生する」は「例外を発生する」の誤記なので直しました。

- cat: オブジェクト指向
  official: 41
  topic: extend
  q: '以下の実行結果を出力するコードがあります。__(1)__ に入る適切な記述を選択してください。(1つ選択)'
  code: |
    module Mixin
      def greet
        puts "Hello World!"
      end
    end

    class SomeClass
      extend Mixin
    end

    __(1)__
  result: 'Hello World!'
  choices: ['Mixin.greet', 'SomeClass.new.greet', 'SomeClass.greet', 'Mixin.new.greet']
  answer: [2]
  verify: blank
  exp: |
    `extend` はモジュールのインスタンスメソッドを、レシーバ（ここではクラス `SomeClass` そのもの）の**特異メソッド**として取り込みます。そのため `SomeClass.greet` とクラスメソッドのように呼べます。

    インスタンスからは呼べず、モジュールは `new` できません。`extend` はクラス以外の任意のオブジェクトにも使えます（`obj.extend(Mixin)`）。

- cat: オブジェクト指向
  official: 42
  topic: include
  q: '以下の実行結果を出力するコードがあります。__(1)__ に入る適切な記述を選択してください。(1つ選択)'
  code: |
    module Mixin
      def greet
        puts "Hello World!"
      end
    end

    class SomeClass
      include Mixin
    end

    __(1)__
  result: 'Hello World!'
  choices: ['Mixin.greet', 'SomeClass.new.greet', 'SomeClass.greet', 'Mixin.new.greet']
  answer: [1]
  verify: blank
  exp: |
    `include` したモジュールのメソッドは、そのクラスの**インスタンスメソッド**になります。`SomeClass.new.greet` で呼べます。

    前の問題の `extend` との違いを押さえましょう（`include` → インスタンスメソッド、`extend` → 特異メソッド）。

- cat: オブジェクト指向
  official: 43
  topic: 可視性の変更
  q: '以下の実行結果を出力するコードがあります。__(1)__ に入る記述として**不適切なもの**を選択してください。(1つ選択)'
  code: |
    class BaseClass
      private

      def greet
        puts "Hello World!"
      end
    end

    class ChildClass < BaseClass
      __(1)__
    end


    ChildClass.new.greet
  result: 'Hello World!'
  choices:
    - 'public :greet'
    - 'protected :greet'
    - |-
      def greet
        super
      end
    - |-
      alias_method :original_greet, :greet

      def greet
        original_greet
      end
  answer: [1]
  verify: blank
  negate: true
  exp: |
    サブクラスでは、継承した private メソッドを public にし直したり、public なメソッドで包んだりできます。

    - `public :greet` … `ChildClass` では `greet` が public になります。
    - `def greet; super; end` … `def` は（`private` の指定がなければ）public なメソッドを定義し、中の `super` はレシーバなしの呼び出しなので private なメソッドも呼べます。
    - `alias_method` … 別名 `original_greet` は private のままですが、新しく定義した public な `greet` からレシーバなしで呼べます。
    - `protected :greet` … protected メソッドは、同じクラス（またはサブクラス）のインスタンスメソッドの中からしか呼べません。トップレベルから `ChildClass.new.greet` と呼ぶと `NoMethodError` です。

- cat: 文法
  official: 44
  topic: パターンマッチ（case/in）
  q: '以下の実行結果を出力するコードがあります。__(1)__ に入る適切な記述を選択してください。(1つ選択)'
  code: |
    h = [1, 2, 3]
    case h
    __(1)__ [x, y]
      p [:two, x, y]
    __(1)__  [x, y, z]
      p [:three, x, y, z]
    end
  result: '[:three, 1, 2, 3]'
  choices: ['when', 'in', 'if', '=>']
  answer: [1]
  verify: blank
  exp: |
    パターンマッチは `case` 式で `when` の代わりに `in` を使います。`in [x, y]` は「要素がちょうど2つの配列」に一致し、要素を変数 `x`, `y` に取り出します。

    `[1, 2, 3]` は要素が3つなので最初の `in` には一致せず、2つ目の `in [x, y, z]` で一致します。

    `when [x, y]` だと、`x` と `y` は未定義の変数を参照しようとして `NameError` になります。

- cat: 組み込みライブラリ
  official: 45
  topic: Enumerableとeach
  q: '以下の実行結果を出力するコードがあります。__(1)__ に入る適切な記述を選択してください。(1つ選択)'
  code: |
    class Alphabet
      include Enumerable

      def initialize
        @letters = ("A".."Z").to_a
      end

      def __(1)__
        @letters.each do |e|
          yield e
        end
      end
    end

    set = Alphabet.new

    p set.take(5)
    p set.select { |e| e > "W" }
  result: |-
    ["A", "B", "C", "D", "E"]
    ["X", "Y", "Z"]
  choices: ['all', 'each', 'to_a', 'to_ary', 'to_enum']
  answer: [1]
  verify: blank
  exp: |
    `Enumerable` を `include` したクラスは、`each` を定義するだけで `map`・`select`・`take`・`sort`・`include?` などの多くのメソッドが使えるようになります。`Enumerable` のメソッドはすべて `each` を使って作られているためです。

    ほかの名前で定義しても `Enumerable` からは使われず、`take` を呼んだところで `NoMethodError`（`each` がない）になります。

- cat: 組み込みライブラリ
  official: 46
  topic: Comparableと<=>
  q: 以下のコードを実行した結果として正しいものを選択してください。(1つ選択)
  code: |
    class TShirt
      SIZES = [:xs, :s, :m, :l, :xl, :xxl]

      include Comparable

      def initialize(size)
        @size = size
      end

      attr_reader :size

      def <=>(other)
        SIZES.index(size) <=> SIZES.index(other.size)
      end
    end

    medium = TShirt.new(:m)
    large  = TShirt.new(:l)

    p medium == large
    p medium <  large
    p medium <= large
    p medium >  large
    p medium >= large
  choices:
    - "true\nfalse\ntrue\nfalse\ntrue"
    - "false\ntrue\ntrue\nfalse\nfalse"
    - "false\nfalse\nfalse\ntrue\ntrue"
    - "false\nfalse\nfalse\nfalse\nfalse"
    - '!例外が発生する'
  answer: [1]
  verify: output
  exp: |
    `Comparable` を `include` して `<=>` を定義すると、`==`・`<`・`<=`・`>`・`>=`・`between?`・`clamp` が使えるようになります。

    `<=>` は「左が小さければ負、等しければ 0、大きければ正」を返すメソッドです。`:m` の位置は 2、`:l` は 3 なので `medium <=> large` は `-1` で、medium のほうが小さいことになります。

- cat: 標準添付ライブラリ
  official: 47
  topic: Date#<< と Date#>>
  q: 以下のコードを実行した結果として正しいものを選択してください。(1つ選択)
  code: |
    require "date"

    date = Date.new(2000, 2, 24)

    puts(date << 12)
    puts(date >> 12)
  choices: ["2000-02-12\n2000-03-07", "2000-03-07\n2000-02-12", "1999-02-24\n2001-02-24", "1988-02-24\n2012-02-24"]
  answer: [2]
  verify: output
  exp: |
    `Date#<<` は n か月**前**、`Date#>>` は n か月**後**の日付を返します。12か月なので、ちょうど1年前と1年後です。

    移動した先の月にその日がない場合は、その月の末日になります（例: `Date.new(2001, 3, 31) << 1` は `2001-02-28`）。日単位で動かすときは `date - 12` や `date + 12` を使います。

- cat: 標準添付ライブラリ
  official: 48
  topic: Time.strptime
  q: '以下の実行結果を出力するコードがあります。__(1)__ に入る適切な記述を選択してください。なお、タイムゾーンは日本時間（JST）とします。(1つ選択)'
  code: |
    require "time"

    t = Time.__(1)__("00000024021993", "%S%M%H%d%m%Y")
    puts t.iso8601
  result: '1993-02-24T00:00:00+09:00'
  choices: ['format', 'parse', 'strftime', 'strptime']
  answer: [3]
  verify: blank
  env: {TZ: Asia/Tokyo}
  exp: |
    `Time.strptime(文字列, フォーマット)` は、フォーマットどおりに文字列を解析して `Time` を作ります（`require "time"` が必要です）。

    - `Time.parse` は書式を推測して解析するメソッドで、フォーマットは受け取りません。
    - `strftime` は逆に `Time` を文字列にする**インスタンス**メソッドです。
    - `Time.format` というメソッドはありません。

    「**p**arse」の p、「**f**ormat」の f と覚えると区別しやすいです。

    **公式版からの修正**: 実行結果の `+09:00` は実行環境のタイムゾーンによって変わるので、「タイムゾーンは日本時間（JST）とします」と書き添えました。

- cat: 標準添付ライブラリ
  official: 49
  topic: Singleton
  q: '以下の実行結果を出力するコードがあります。__(1)__ に入る適切な記述を選択してください。(1つ選択)'
  code: |
    require "singleton"

    class Foo
      __(1)__
    end

    x = Foo.instance
    y = Foo.instance
    p x.equal?(y)
  result: 'true'
  choices: ['include Singleton', 'extend Singleton', 'using Singleton', 'singletonize']
  answer: [0]
  verify: blank
  exp: |
    `Singleton` モジュールを `include` すると、クラスにただ1つのインスタンスを返す `instance` メソッドが追加され、`new` は private になります（`Foo.new` は `NoMethodError`）。

    `equal?` は同じオブジェクトかどうかを調べるので、何度 `instance` を呼んでも `true` です。

- cat: 標準添付ライブラリ
  official: 50
  topic: Forwardable
  q: '以下の実行結果を出力するコードがあります。__(1)__ に入る適切な記述を選択してください。(1つ選択)'
  code: |
    require 'forwardable'

    class List
      extend Forwardable

      def initialize
        @contents = []
      end

      __(1)__ :@contents, :push
      __(1)__ :@contents, :[]
    end

    list = List.new
    list.push("a")
    list.push("b")
    list.push("c")
    p list[1]
  result: '"b"'
  choices: ['forward', 'def_forwarder', 'def_delegator', 'define']
  answer: [2]
  verify: blank
  exp: |
    `Forwardable` を `extend` すると、`def_delegator 委譲先, メソッド名` でメソッドの呼び出しを別のオブジェクトに転送（委譲）できます。

    複数のメソッドをまとめて委譲するには `def_delegators :@contents, :push, :[]` と書きます。`Forwardable` は `include` ではなく `extend` する点にも注意しましょう。
