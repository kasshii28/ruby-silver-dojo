    - `Identity.new.this_object` はインスタンスそのものなので、`.class` は `Identity` です。

- cat: オブジェクト指向
  official: 38
  topic: モジュールの中のself
  q: 以下のコードを実行した結果として正しいものを選択してください。(1つ選択)
  code: |
    module Mixin
