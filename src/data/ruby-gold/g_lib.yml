- cat: 組み込みライブラリ
  topic: Fiber
  q: 次のコードを実行するとどうなりますか。
  code: |
    f = Fiber.new do |x|
      y = Fiber.yield x * 2
      z = Fiber.yield y + 1
      z.to_s
    end
    p f.resume(5)
    p f.resume(10)
    p f.resume(:end)
    p f.alive?
  choices: ["10\n11\n\"end\"\nfalse", "10\n11\n\"end\"\ntrue", "5\n10\n\"end\"\nfalse", "10\n6\n\"end\"\nfalse"]
  answer: [0]
  verify: output
  exp: |
    `Fiber` は途中で中断・再開できる処理のかたまりです。

    1. `resume(5)` … ブロック引数 `x` が `5` で開始し、`Fiber.yield 10` で中断して `10` を返します。
    2. `resume(10)` … 中断した `Fiber.yield` が `10` を返して再開し（`y = 10`）、次の `Fiber.yield 11` で中断します。
    3. `resume(:end)` … `z = :end` で再開し、ブロックの最後の値 `"end"` を返して終了します。

    終了したファイバーの `alive?` は `false` で、さらに `resume` すると `FiberError` です。

- cat: 組み込みライブラリ
  topic: Thread
  q: 次のコードを実行するとどうなりますか。
  code: |
    t = Thread.new { 1 + 2 }
    p t.value
    e = Thread.new { raise "boom" }
    e.report_on_exception = false
    begin
      e.join
    rescue => ex
      p ex.message
    end
  choices: ["3\n\"boom\"", "3\nnil", "nil\n\"boom\"", '!`RuntimeError` でプログラムが停止する']
  answer: [0]
  verify: output
  exp: |
    `Thread.new { }` でスレッドを作ると、ブロックが並行して実行されます。

    - `value` はスレッドの終了を待ち、ブロックの値を返します。
    - スレッドの中で発生した例外は、`join` や `value` を呼んだ側で**もう一度発生**します。そのため `rescue` で捕捉できます。

    `report_on_exception = false` は、スレッドが例外で終わったときの警告表示を止める設定です。`Thread.abort_on_exception = true` にすると、例外の時点でメインスレッドごと止まります。

- cat: 組み込みライブラリ
