  verify: output
  exp: |
    - `step(n)` … n 個おきに取り出します。`1..10` は終端を含むので `10` も入ります。
    - `1...10` は終端を含まないので要素は9個です。
    - 文字列の範囲の `include?` は要素を順に列挙して調べるので、`"cc"` は `"a"`〜`"e"` の要素ではなく `false` です。`cover?` は `始端 <= 値 <= 終端` の比較だけで判定するので `true` です。
