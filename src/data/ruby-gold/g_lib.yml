  q: 次のコードを実行するとどうなりますか。
  code: |
    a = "x"
    b = a
    c = a.dup
    p a.object_id == b.object_id
    p a.object_id == c.object_id
    p 1.object_id == 1.object_id
    p :sym.object_id == :sym.object_id
  choices: ["true\nfalse\ntrue\ntrue", "true\nfalse\nfalse\ntrue", "true\ntrue\ntrue\ntrue", "false\nfalse\ntrue\nfalse"]
  answer: [0]
