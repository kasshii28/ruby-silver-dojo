    `uniq!`・`flatten!`・`compact!`・`reject!`・`select!` などは、**何も変更がなかったときに `nil` を返します**。そのため `a.uniq!.size` のようにつなげると、重複がない場合に `NoMethodError` になります。`sort!` は常にレシーバを返します。

