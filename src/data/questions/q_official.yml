  exp: |
    `str[開始, 長さ] = 文字列` は、その範囲を右辺の文字列で置き換えます（文字列自体が変わります）。

    位置1から1文字の `a` が `o` に置き換わり、`"bot"` になります。置き換える文字列の長さは元の範囲と違っても構いません（`"boat"` の `[1,2]` に `"uil"` を入れると `"built"`）。

- cat: 組み込みライブラリ
  official: 50
  topic: Integer と String の演算
  q: 以下のコードを実行した結果として正しいものを選択してください。(1つ選択)
  code: |
    puts 5 * "hi"
  choices: ['`"hihihihihi"`', '実行時にエラーになる', '`"5hi"`', '`"5*hi"`']
  answer: [1]
  verify: run
  expect: {error: TypeError}
  exp: |
    `5 * "hi"` は Integer の `*` メソッドに文字列を渡すことになり、文字列は数値に変換できないので `TypeError`（String can't be coerced into Integer）になります。

    順番を逆にした `"hi" * 5` なら String の `*` が呼ばれ、`hihihihihi` になります。
