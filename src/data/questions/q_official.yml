- cat: 組み込みライブラリ
  official: 28
  topic: Hash（キーの存在確認）
  q: '次のメソッドのうち `:c` がハッシュのキーとして存在するかどうかを「返さない」ものを選択してください。(1つ選択)'
  code: |
    h = {a: 2, b: 4, c: 6, d: 8, e: 10}
  choices: ['`p h.has_key?(:c)`', '`p h.contain?(:c)`', '`p h.include?(:c)`', '`p h.key?(:c)`', '`p h.member?(:c)`']
  answer: [1]
  verify: checks
  checks:
    - 'begin; p h.has_key?(:c); exit(false); rescue NoMethodError; exit(true); end'
    - 'begin; p h.contain?(:c); exit(false); rescue NoMethodError; exit(true); end'
    - 'begin; p h.include?(:c); exit(false); rescue NoMethodError; exit(true); end'
