- cat: 組み込みライブラリ
  official: 43
  topic: sort のブロック
  q: '配列を降順にソートするコードがあります。__(1)__ に入る適切な記述を選択してください。(1つ選択)'
  code: |
    ary = [2,4,8,1,16]
    p ary.__(1)__
  result: '[16, 8, 4, 2, 1]'
  choices: ['sort { |i,j| -i <= -j }', 'sort { |i,j| -i <=> -j }', 'sort { |i,j| i >= j }', 'sort{ |i,j| i <=> j }']
  answer: [1]
  verify: blank
  exp: |
    `sort` のブロックは2つの要素を受け取り、前に置くべきなら負、同じなら `0`、後ろに置くべきなら正の整数を返します。`<=>` はちょうどその値（`-1` / `0` / `1`）を返す演算子です。

    `-i <=> -j` は符号を反転して比べるので、大きい値ほど前に来る降順になります（`j <=> i` と書いても同じ）。`i <=> j` は昇順です。

    `<=` や `>=` は `true` / `false` を返すため、`sort` が比較結果として扱えずエラーになります。

