- cat: 組み込みライブラリ
  official: 45
  topic: ファイルのオープンモード（省略時）
  q: '以下のコードでは `open` メソッドの第2引数を省略してファイルを開いています。このケースで暗黙的に第2引数として指定されるものを選択してください。(1つ選択)'
  code: |
    file = open("sample.txt")
  setup: |
    # 各モードと、モード省略時の振る舞いを比べる
    def probe(*mode)
      File.delete("p.txt") if File.exist?("p.txt")
      missing = begin; open("p.txt", *mode).close; true; rescue Errno::ENOENT; false; end
      File.write("p.txt", "abc")
      f = open("p.txt", *mode)
      readable = begin; f.read; true; rescue IOError; false; end
      writable = begin; f.write("Z"); f.flush; true; rescue IOError; false; end
      f.close
      [missing, readable, writable, File.read("p.txt")]
    end
  choices: ['`r`', '`r+`', '`a`', '`a+`', '`w`', '`w+`']
  answer: [0]
  verify: checks
  checks:
    - 'exit(probe == probe("r"))'
    - 'exit(probe == probe("r+"))'
    - 'exit(probe == probe("a"))'
    - 'exit(probe == probe("a+"))'
    - 'exit(probe == probe("w"))'
    - 'exit(probe == probe("w+"))'
  exp: |
    モードを省略すると `"r"`（読み込み専用）で開かれます。ファイルがなければ `Errno::ENOENT` になり、書き込もうとすると `IOError` です。

    **公式版からの修正**: 問題文に選択する数（1つ選択）が書かれていなかったので補いました。

- cat: 組み込みライブラリ
  official: 46
  topic: ファイルのオープンモード（w / w+）
  q: 'test_one.txtの内容をtest_two.txtにコピーするコードがあります。test_two.txtがすでに存在する場合、このコードは最初にファイルサイズを0にし、先頭から内容を上書きするものとします。__(1)__ に入る適切な記述を選択してください。(2つ選択)'
  code: |
    open("test_one.txt") {|source|
      open("test_two.txt", "__(1)__") {|dest|
        dest.write(source.read)
      }
    }
  setup: |
    def copy(mode)
      File.write("test_one.txt", "new")
      File.write("test_two.txt", "old old old")
      open("test_one.txt") {|source|
        open("test_two.txt", mode) {|dest|
          dest.write(source.read)
        }
      }
      File.read("test_two.txt") == "new"
    end
  choices: ['`r+`', '`a`', '`a+`', '`w`', '`w+`']
  answer: [3, 4]
  verify: checks
  checks:
    - 'exit(copy("r+"))'
    - 'exit(copy("a"))'
    - 'exit(copy("a+"))'
    - 'exit(copy("w"))'
    - 'exit(copy("w+"))'
  exp: |
    主なオープンモードは次のとおりです。

    - `r` … 読み込み専用（省略時のモード）。ファイルがなければエラー
    - `r+` … 読み書き。先頭から書き込むが、切り詰めはしない
    - `w` … 書き込み専用。既存ファイルを0バイトに切り詰める（なければ作成）
    - `w+` … 読み書き。既存ファイルを0バイトに切り詰める（なければ作成）
    - `a` … 書き込み専用。末尾に追記（なければ作成）
    - `a+` … 読み書き。書き込みは末尾に追記（なければ作成）

    「サイズを0にしてから先頭から書く」のは `w` と `w+` です。`r+` だと古い内容の後半が残り、`new old old` のようになります。

