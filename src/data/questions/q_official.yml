    Java などの `new Shouter(...)` という書き方は Ruby にはなく、`Shouter(...)` は `Shouter` という名前のメソッド呼び出しとみなされて `NoMethodError` になります。

- cat: オブジェクト指向
  official: 38
  topic: super
  q: 以下のコードを実行した結果として正しいものを選択してください。(1つ選択)
  code: |
    class Foo
      attr_reader :var
      def initialize
        @var = "apple"
      end
    end

    class Bar < Foo
      def initialize
        @var = "banana"
        super
      end
    end

    bar = Bar.new
    puts bar.var
  choices: ['apple', 'banana', '!何も出力されない', '!実行時にエラーになる']
  answer: [0]
  verify: output
  exp: |
    `super` はスーパークラスの同じ名前のメソッド（ここでは `Foo#initialize`）を呼び出します。

    `Bar#initialize` で `@var = "banana"` としたあとに `super` で `Foo#initialize` が呼ばれ、同じインスタンスの `@var` が `"apple"` で上書きされます。そのため `apple` が出力されます。

