- cat: 組み込みライブラリ
  official: 29
  topic: Array（要素の削除）
  q: '以下の実行結果を出力するコードがあります。__(1)__ に入る適切な記述を選択してください。(2つ選択)'
  code: |
    a = [120, 40, 20, 80, 160, 60, 180]
    a.__(1)__
    p a
  result: '[120, 80, 160, 180]'
  choices:
    - 'reject! {|i| i < 80}'
    - 'slice {|i| i < 80 }'
    - 'slice! {|i| i < 80}'
    - 'delete_if! {|i| i < 80}'
    - 'delete_if {|i| i < 80}'
    - 'reject {|i| i < 80}'
  answer: [0, 4]
  verify: blank
  exp: |
    `a` 自身を変更する必要があるので、破壊的に要素を取り除く `reject!` と `delete_if` が正解です。

    - `reject` … 新しい配列を返すだけで `a` は変わりません。
    - `delete_if!` … そのような名前のメソッドはありません（`delete_if` は名前に `!` がなくても破壊的です）。
    - `slice` / `slice!` … インデックスや範囲を引数に取るメソッドで、ブロックで絞り込むことはできません。引数がないので `ArgumentError` です。

    **公式版からの修正**: 問題文の先頭に余分な `"` が入っていました。

