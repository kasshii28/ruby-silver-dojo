- cat: オブジェクト指向
  official: 36
  topic: initialize
  q: '以下の実行結果を出力するコードがあります。__(1)__ に入る適切な記述を選択してください。(1つ選択)'
  code: |
    class Shouter
      def __(1)__(message)
        @message = message
      end

      def greet
        puts @message.upcase
      end
    end

    g = Shouter.new("Hello, world!")
    g.greet
  result: HELLO, WORLD!
  choices: ['Shouter', 'new', 'initialize', '__init__']
  answer: [2]
  verify: blank
  exp: |
    `クラス名.new` でインスタンスを作ると、そのインスタンスの `initialize` メソッドが `new` に渡した引数で呼ばれます。

    Ruby ではクラス名と同じ名前のメソッドや `__init__` はコンストラクタになりません。`new` をインスタンスメソッドとして定義しても、`Shouter.new` で呼ばれるのはクラスメソッドの `new` です。

- cat: オブジェクト指向
  official: 37
  topic: インスタンスの生成
