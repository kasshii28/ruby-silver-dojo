- cat: オブジェクト指向
  official: 32
  topic: 例外クラスと rescue の順番
  q: 以下のコードを実行した結果として正しいものを選択してください。(1つ選択)
  code: |
    class SomeError < StandardError; end
    class SomeOtherError < SomeError; end

    def meth1
      raise SomeOtherError.new("error")
    end

    begin
      meth1
    rescue SomeError
      print "SomeError"
    rescue SomeOtherError
      print "SomeOtherError"
    end
  choices: ['!文法エラーが発生する', 'SomeError', 'SomeErrorSomeOtherError', 'SomeOtherError']
  answer: [1]
  verify: output
  exp: |
    `rescue` 節は上から順に調べられ、例外が指定したクラス（またはその**サブクラス**）のインスタンスなら、その節だけが実行されます。

    `SomeOtherError` は `SomeError` のサブクラスなので、最初の `rescue SomeError` で捕捉されて `SomeError` と出力されます。2つ目の節には到達しません。特定的な例外ほど先に書くのが定石です。

    **公式版からの修正**: 選択肢「A syntax error」が英語のままだったので日本語にしました。

- cat: オブジェクト指向
  official: 33
  topic: ensure と exit
  q: 以下のコードを実行した結果として正しいものを選択してください。(1つ選択)
  code: |
    begin
      ans = 100/0
      puts ans
    rescue ZeroDivisionError
      puts "Error: ZeroDivisionError"
      exit 1
    ensure
      puts "DONE!"
    end
  choices:
    - "0\nDONE!"
    - 'Error: ZeroDivisionError'
    - "Error: ZeroDivisionError\nDONE!"
    - "Error: ZeroDivisionError\n0"
  answer: [2]
  cm: true
  verify: run
  expect: {out: "Error: ZeroDivisionError\nDONE!", status: 1}
  exp: |
    整数の `100/0` は `ZeroDivisionError` になり、`puts ans` は実行されずに `rescue` 節へ移ります。

    `exit 1` はプログラムを終了させますが、内部的には `SystemExit` という例外を発生させる仕組みなので、終了する前に `ensure` 節が実行されて `DONE!` が出力されます。

- cat: オブジェクト指向
  official: 34
  topic: スーパークラス
  q: クラスのスーパークラスを明示的に指定しなかった場合の説明として正しいものを選択してください。(1つ選択)
  choices:
    - '例外 `UndefinedParentClassError` が発生する'
    - '文法エラーが発生する'
    - '`Module` クラスがスーパークラスになる'
    - 'スーパークラスのないクラスが作成される'
    - '`Object` クラスがスーパークラスになる'
  answer: [4]
  verify: checks
  checks:
    - 'exit(defined?(UndefinedParentClassError) ? true : false)'
    - 'begin; eval("class Foo; end"); exit(false); rescue SyntaxError; exit(true); end'
    - 'class Foo; end; exit(Foo.superclass == Module)'
    - 'class Foo; end; exit(Foo.superclass.nil?)'
    - 'class Foo; end; exit(Foo.superclass == Object)'
  exp: |
    `class Foo; end` のようにスーパークラスを書かないと、`Object` を継承したクラスになります（`Foo.superclass #=> Object`）。

    `Object` を継承しないクラスを作りたいときは、`class Foo < BasicObject` のように `BasicObject` を明示します。スーパークラスを持たないのは `BasicObject` だけです。

