<title>Ruby Silver 道場</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one exam-sheet column. Home (exam list + history) → quiz sheet → result & review. */
:root {
  --bg: #f6f4f5;
  --surface: #ffffff;
  --fg: #1f1b1e;
  --muted: #6c6468;
  --line: #e2dcdf;
  --ruby: #a3123a;
  --ok: #157656;
  --ok-bg: #e7f3ed;
  --ng-bg: #fbe9ee;
  --code-bg: #faf8f9;
  --chip: #efebed;
  --hl-kw: #a3123a;
  --hl-str: #2f6b2f;
  --hl-num: #8a4b00;
  --hl-com: #8b8287;
  --hl-sym: #6b3fa0;
  --hl-const: #0f5e8c;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  --font-code: "JetBrains Mono", "BIZ UDGothic", "Osaka-Mono", "MS Gothic", ui-monospace, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141215; --surface: #1c191d; --fg: #ece7ea; --muted: #a59da1; --line: #322d31;
    --ruby: #ff6582; --ok: #4cc896; --ok-bg: #13281f; --ng-bg: #2d1419; --code-bg: #120f12; --chip: #2a2529;
    --hl-kw: #ff7a93; --hl-str: #9bd68e; --hl-num: #f0b46a; --hl-com: #847a80; --hl-sym: #c7a4f5; --hl-const: #7cc4f0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141215; --surface: #1c191d; --fg: #ece7ea; --muted: #a59da1; --line: #322d31;
  --ruby: #ff6582; --ok: #4cc896; --ok-bg: #13281f; --ng-bg: #2d1419; --code-bg: #120f12; --chip: #2a2529;
  --hl-kw: #ff7a93; --hl-str: #9bd68e; --hl-num: #f0b46a; --hl-com: #847a80; --hl-sym: #c7a4f5; --hl-const: #7cc4f0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
main { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
code, pre, .mono { font-family: var(--font-code); }
h2, h3 { text-wrap: balance; }

/* header */
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 0; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand a { color: inherit; text-decoration: none; }
.brand h1 { margin: 0; font-size: 20px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
.gem { width: 14px; height: 14px; background: var(--ruby); clip-path: polygon(50% 100%, 0 38%, 22% 6%, 78% 6%, 100% 38%); flex: none; }
.brand small { color: var(--muted); font-size: 12px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 7px 14px; font-size: 14px; cursor: pointer; line-height: 1.4; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 700; }
.btn.primary:hover { opacity: .9; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--ruby); }
.btn.danger.armed { background: var(--ruby); color: var(--surface); border-color: var(--ruby); }

/* panels (home, review) */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 16px 20px 12px; border-bottom: 1px solid var(--line); }
.panel-head h2 { margin: 0; font-size: 16px; }
.panel-head .meta { font-size: 13px; color: var(--muted); }
.panel-head .meta b { color: var(--fg); font-family: var(--font-code); font-variant-numeric: tabular-nums; }
.intro { margin: 0; color: var(--muted); font-size: 14px; max-width: 65ch; }
.rows { list-style: none; margin: 0; padding: 0; }
.rows > li + li { border-top: 1px solid var(--line); }
.exam { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 20px; flex-wrap: wrap; }
.exam .txt { min-width: 0; flex: 1 1 260px; }
.exam h3 { margin: 0; font-size: 16px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.exam h3 .count { font-family: var(--font-code); font-size: 13px; color: var(--muted); font-weight: 400; }
.exam p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips .btn { padding: 6px 12px; }
.chips .btn span { font-family: var(--font-code); color: var(--muted); font-size: 12px; margin-left: 4px; }
.resume { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 18px; border: 1.5px solid var(--fg); border-radius: var(--r); background: var(--surface); }
.resume .txt { min-width: 0; flex: 1 1 260px; }
.resume strong { display: block; font-size: 15px; }
.resume span { font-size: 13px; color: var(--muted); }
.resume .acts { display: flex; gap: 8px; }
.hist-row { width: 100%; display: grid; grid-template-columns: 9.5em 1fr auto auto; align-items: center; gap: 12px; padding: 12px 20px; background: none; border: 0; text-align: left; cursor: pointer; }
.hist-row:hover { background: var(--bg); }
.hist-row .date { font-family: var(--font-code); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hist-row .ttl { min-width: 0; font-size: 14px; }
.hist-row .ttl small { color: var(--muted); margin-left: 6px; }
.hist-row .score { font-family: var(--font-code); font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; }
.badge { font-size: 12px; font-weight: 700; border-radius: 4px; padding: 2px 8px; white-space: nowrap; }
.badge.pass { background: var(--ok-bg); color: var(--ok); }
.badge.fail { background: var(--ng-bg); color: var(--ruby); }
.badge.part { background: var(--chip); color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; padding: 20px; margin: 0; }
.panel-foot { display: flex; justify-content: flex-end; padding: 12px 20px; border-top: 1px solid var(--line); }

/* quiz bar & progress */
.quizbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.quizbar .qtitle { font-weight: 700; font-size: 15px; flex: 1; min-width: 0; text-align: center; }
.progress { display: flex; flex-direction: column; gap: 6px; }
.progress-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.progress-row b { color: var(--fg); font-family: var(--font-code); font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--fg); width: 0; transition: width .25s ease; }

/* question sheet */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 22px 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.qhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.qno { font-family: var(--font-code); font-weight: 600; font-size: 15px; }
.tag { font-size: 12px; background: var(--chip); border-radius: 4px; padding: 2px 8px; color: var(--muted); }
.tag.multi { background: var(--fg); color: var(--bg); font-weight: 700; }
.tag.id { font-family: var(--font-code); }
.qtext { margin: 0; font-size: 17px; text-wrap: pretty; }
.blank { display: inline-block; font-family: var(--font-code); font-size: .9em; border: 1.5px solid currentColor; border-radius: 4px; padding: 0 .45em; line-height: 1.5; margin: 0 2px; }
.code { display: flex; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; font-size: 14px; line-height: 1.65; }
.code pre { margin: 0; padding: 12px 14px; white-space: pre; }
.code .ln { color: var(--hl-com); text-align: right; user-select: none; padding-right: 10px; border-right: 1px solid var(--line); position: sticky; left: 0; background: var(--code-bg); }
.code .src { flex: 1; min-width: 0; }
.result-box { display: flex; flex-direction: column; gap: 4px; }
.result-box .label { font-size: 13px; color: var(--muted); }
.result-box pre { margin: 0; background: var(--code-bg); border: 1px dashed var(--line); border-radius: 8px; padding: 10px 14px; font-size: 14px; overflow-x: auto; }

/* hljs tokens */
.hljs-keyword, .hljs-built_in, .hljs-literal { color: var(--hl-kw); }
.hljs-string, .hljs-regexp, .hljs-subst .hljs-string { color: var(--hl-str); }
.hljs-subst { color: var(--fg); }
.hljs-number { color: var(--hl-num); }
.hljs-comment { color: var(--hl-com); font-style: italic; }
.hljs-symbol { color: var(--hl-sym); }
.hljs-title, .hljs-title.class_, .hljs-type { color: var(--hl-const); }
.hljs-variable, .hljs-params { color: inherit; }

/* choices */
.choices { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.choice {
  width: 100%; display: grid; grid-template-columns: 30px 1fr auto; align-items: start; gap: 12px;
  text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px;
  padding: 11px 14px; cursor: pointer; transition: border-color .12s ease, background .12s ease;
}
button.choice:hover:not(:disabled) { border-color: var(--muted); }
.choice:disabled, div.choice { cursor: default; }
.choice .key { font-family: var(--font-code); font-weight: 600; font-size: 14px; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; line-height: 1; }
.choice .body { min-width: 0; padding-top: 2px; }
.choice pre { margin: 0; font-size: 14px; line-height: 1.6; white-space: pre; overflow-x: auto; }
.choice .prose { font-size: 15px; line-height: 1.65; }
.choice .mark { font-size: 13px; font-weight: 700; padding-top: 4px; white-space: nowrap; }
.choice.picked { border-color: var(--fg); }
.choice.picked .key { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.choice.right { border-color: var(--ok); background: var(--ok-bg); }
.choice.right .key { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.choice.right .mark { color: var(--ok); }
.choice.wrong { border-color: var(--ruby); background: var(--ng-bg); }
.choice.wrong .key { background: var(--ruby); border-color: var(--ruby); color: var(--surface); }
.choice.wrong .mark { color: var(--ruby); }
.choice.dim { opacity: .6; }
.submit-row { display: flex; justify-content: flex-end; }

/* verdict & explanation */
.verdict { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-radius: 8px; padding: 12px 16px; }
.verdict.ok { background: var(--ok-bg); color: var(--ok); }
.verdict.ng { background: var(--ng-bg); color: var(--ruby); }
.verdict.none { background: var(--chip); color: var(--muted); }
.verdict strong { font-size: 18px; }
.verdict span { color: var(--fg); font-size: 14px; }
.exp { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.exp h3 { margin: 0; font-size: 14px; letter-spacing: .08em; color: var(--muted); }
.exp p, .exp ul, .exp ol { margin: 0; max-width: 65ch; }
.exp ul, .exp ol { padding-left: 1.4em; display: flex; flex-direction: column; gap: 2px; }
.exp :not(pre) > code, .prose code, .qtext code { font-size: .88em; background: var(--chip); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.exp pre { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 14px; overflow-x: auto; }

/* nav */
nav.qnav { display: flex; justify-content: space-between; gap: 8px; }
.kbd-hint { font-size: 12px; color: var(--muted); text-align: center; margin: 0; }
@media (hover: none) { .kbd-hint { display: none; } }

/* result */
.summary { display: flex; flex-direction: column; gap: 16px; }
.summary h2 { margin: 0; font-size: 20px; }
.summary .when { margin: -10px 0 0; font-size: 13px; color: var(--muted); font-family: var(--font-code); }
.score { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.score .big { font-family: var(--font-code); font-size: 44px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.score .of { color: var(--muted); }
.gauge { position: relative; height: 10px; background: var(--line); border-radius: 5px; }
.gauge i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--fg); }
.gauge i.pass { background: var(--ok); }
.gauge .line { position: absolute; top: -6px; bottom: -6px; left: 75%; width: 2px; background: var(--ruby); }
.gauge-labels { position: relative; height: 18px; font-size: 12px; color: var(--muted); }
.gauge-labels span { position: absolute; left: 75%; transform: translateX(-50%); white-space: nowrap; }
.bycat { display: flex; gap: 8px 20px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.bycat b { color: var(--fg); font-family: var(--font-code); font-variant-numeric: tabular-nums; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); font-weight: 700; }
.review-list > li > details > summary { list-style: none; display: grid; grid-template-columns: 2.2em 2.6em 1fr auto; align-items: center; gap: 10px; padding: 11px 20px; cursor: pointer; }
.review-list > li > details > summary::-webkit-details-marker { display: none; }
.review-list > li > details > summary:hover { background: var(--bg); }
.review-list > li > details[open] > summary { background: var(--bg); }
.review-list .mk { font-weight: 700; text-align: center; }
.review-list .mk.ok { color: var(--ok); }
.review-list .mk.ng { color: var(--ruby); }
.review-list .mk.none { color: var(--muted); }
.review-list .n { font-family: var(--font-code); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.review-list .topic { min-width: 0; font-size: 14px; overflow-wrap: anywhere; }
.review-list .topic small { color: var(--muted); }
.review-list .ans { font-family: var(--font-code); font-size: 12px; color: var(--muted); white-space: nowrap; }
.review-body { padding: 4px 20px 22px; display: flex; flex-direction: column; gap: 14px; }

footer { font-size: 12px; color: var(--muted); line-height: 1.7; padding-top: 8px; }

@media (max-width: 520px) {
  .sheet { padding: 18px 14px 20px; }
  .qtext { font-size: 16px; }
  .choice { grid-template-columns: 26px 1fr; padding: 10px 12px; gap: 10px; }
  .choice .key { width: 26px; height: 26px; font-size: 13px; }
  .choice .mark { grid-column: 2; padding-top: 0; }
  .code { font-size: 13px; }
  .exam, .hist-row, .panel-head, .panel-foot { padding-left: 14px; padding-right: 14px; }
  .hist-row { grid-template-columns: 1fr auto; row-gap: 2px; }
  .hist-row .date { grid-column: 1 / -1; }
  .review-list > li > details > summary { grid-template-columns: 1.6em 2.4em 1fr; padding-left: 12px; padding-right: 12px; }
  .review-list .ans { grid-column: 3; }
  .review-body { padding-left: 12px; padding-right: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <a href="#home"><h1><span class="gem" aria-hidden="true"></span>Ruby Silver 道場</h1></a>

  <main id="main"></main>

<script>
const QUESTIONS = ([{"id":1,"cat":"文法","topic":"変数名","q":"ローカル変数名として有効なものを2つ選択してください。","choices":["_count","2nd_place","user-name","userName"],"answer":[0,3],"cm":true,"exp":"ローカル変数名は英小文字または `_` で始め、2文字目以降は英数字と `_` が使えます。\n\n`2nd_place` のように数字で始まる名前は使えず、`user-name` は `-` が減算演算子と解釈されるため使えません。`userName` のように途中に大文字を含むのは有効です（慣習的にはスネークケース `user_name` で書きます）。\n\nなお、大文字で始まると定数、`@` はインスタンス変数、`@@` はクラス変数、`$` はグローバル変数になります。\n"},{"id":2,"cat":"文法","topic":"数値リテラル","q":"次のコードを実行するとどうなりますか。","code":"p 1_000 + 0b1010 + 0o17 + 0x1F\n","choices":["1056","1046","1057","!`SyntaxError` が発生する"],"answer":[0],"cm":true,"exp":"数値リテラル中の `_` は桁区切りとして無視されるので `1_000` は 1000 です。\n\n- `0b` は2進数：`0b1010` → 10\n- `0o`（または先頭の `0`）は8進数：`0o17` → 15\n- `0x` は16進数：`0x1F` → 31\n\n合計 1000 + 10 + 15 + 31 = 1056 です。\n"},{"id":3,"cat":"文法","topic":"文字列リテラル","q":"次のコードを実行するとどうなりますか。","code":"name = \"Ruby\"\nputs 'Hello, #{name}\\n'\nputs \"Hello, #{name}\"\n","choices":["Hello, #{name}\\n\nHello, Ruby","Hello, Ruby\nHello, Ruby","Hello, #{name}\n\nHello, Ruby","Hello, Ruby\\n\nHello, Ruby"],"answer":[0],"cm":true,"exp":"シングルクォートの文字列では、式展開 `#{}` も `\\n` などのエスケープも行われず、書いたとおりに出力されます（例外は `\\'` と `\\\\` だけ）。\n\nダブルクォートの文字列では式展開とエスケープが有効になります。\n"},{"id":4,"cat":"文法","topic":"%記法","q":"次のコードを実行するとどうなりますか。","code":"lang = \"ruby\"\np %W(#{lang} rails)\np %i(ruby rails)\n","choices":["[\"ruby\", \"rails\"]\n[:ruby, :rails]","[\"\\#{lang}\", \"rails\"]\n[:ruby, :rails]","[\"ruby\", \"rails\"]\n[\"ruby\", \"rails\"]","[:ruby, :rails]\n[:ruby, :rails]"],"answer":[0],"cm":true,"exp":"- `%w` … 空白区切りで文字列の配列を作る（式展開なし）\n- `%W` … 文字列の配列（式展開あり）\n- `%i` … シンボルの配列（`%I` は式展開あり）\n\n小文字の `%w(#{lang} rails)` だと式展開されず `[\"\\#{lang}\", \"rails\"]` になります（`p` は `#{` を `\\#{` と表示します）。\n"},{"id":5,"cat":"文法","topic":"ヒアドキュメント","q":"次のコードを実行するとどうなりますか。","code":"text = \u003c\u003c~EOS\n    Hello\n      Ruby\n  EOS\np text\n","choices":["\"Hello\\n  Ruby\\n\"","\"    Hello\\n      Ruby\\n\"","\"Hello\\nRuby\\n\"","\"Hello\\n  Ruby\""],"answer":[0],"cm":true,"exp":"`\u003c\u003c~` は、最もインデントが浅い行に合わせて各行の先頭の空白を取り除きます（ここでは4つ）。行どうしの相対的なインデント（`Ruby` の前の2つ）は残ります。\n\n終端の `EOS` のインデント位置は関係ありません。ヒアドキュメントの最後の行にも改行が含まれます。\n\n`\u003c\u003c-` は終端識別子をインデントできるだけで、本文の空白はそのまま残ります。\n"},{"id":6,"cat":"文法","topic":"コメント","q":"次のコードを実行するとどうなりますか。","code":"# p 1\np 2 # p 3\n=begin\np 4\n=end\np 5\n","choices":["2\n5","2\n4\n5","1\n2\n3\n4\n5","2"],"answer":[0],"cm":true,"exp":"`#` から行末まではコメントです。`=begin` から `=end` までは複数行コメントになります。\n\n`=begin` と `=end` は行頭に書く必要があります。インデントするとコメントとして扱われません。\n"},{"id":7,"cat":"文法","topic":"文字リテラル","q":"次のコードを実行するとどうなりますか。","code":"p ?a\np ?a.ord\np 98.chr\n","choices":["\"a\"\n97\n\"b\"","?a\n97\n\"b\"","\"a\"\n97\n98","\"a\"\n\"97\"\n\"b\""],"answer":[0],"cm":true,"exp":"`?a` は1文字の文字列 `\"a\"` を表すリテラルです。\n\n`String#ord` は文字のコードポイント（`\"a\"` は 97）を返し、`Integer#chr` は逆に数値から1文字の文字列を返します。\n"},{"id":8,"cat":"文法","topic":"定数","q":"次のコードを実行するとどうなりますか。","code":"MAX = 10\nMAX = 20\nputs MAX\n","choices":["`20` と表示され、警告（already initialized constant）が出る","`10` と表示される","`20` とだけ表示され、警告は出ない","エラーが発生し、何も表示されない"],"answer":[0],"cm":false,"exp":"定数への再代入はエラーにはならず、警告が出たうえで値が変わります。\n\nただし、メソッドの中で定数に代入しようとすると `dynamic constant assignment` という `SyntaxError` になります。\n\n```ruby\ndef set_max\n  MAX = 100   # SyntaxError\nend\n```\n"},{"id":9,"cat":"文法","topic":"変数のスコープ","q":"次のコードを実行するとどうなりますか。","code":"x = 10\ndef show\n  puts x\nend\nshow\n","choices":["`10` と出力される","空行が出力される","`NameError` が発生する","`SyntaxError` が発生する"],"answer":[2],"cm":false,"exp":"`def` は新しいスコープを作るため、メソッドの外で定義したローカル変数 `x` はメソッド内から参照できません。`x` は未定義のローカル変数またはメソッドとみなされ、`NameError` になります。\n\n一方、ブロック・`if`・`while` は新しいスコープを作らないので、外側のローカル変数を参照できます。\n"},{"id":10,"cat":"文法","topic":"ブロックローカル変数","q":"次のコードを実行するとどうなりますか。","code":"x = 10\n[1, 2].each do |i; x|\n  x = i * 100\nend\np x\n","choices":["10","100","200","nil"],"answer":[0],"cm":true,"exp":"ブロック引数の `;` の後ろに書いた変数はブロックローカル変数で、外側の同名の変数とは別物になります。そのため外側の `x` は 10 のままです。\n\n`|i|` だけにすると、ブロック内の `x = ...` は外側の `x` を書き換えるので `200` になります。\n"},{"id":11,"cat":"文法","topic":"ループとスコープ","q":"次のコードを実行するとどうなりますか。","code":"for i in 1..3\n  j = i * 2\nend\np i\np j\n","choices":["3\n6","!`NameError` が発生する","nil\nnil","1\n2"],"answer":[0],"cm":true,"exp":"`for` は `each` と違って新しいスコープを作りません。ループ変数 `i` や、ループ内で初めて代入した `j` は、ループの後でも参照できます。\n\n`(1..3).each { |i| j = i * 2 }` のようにブロックで書いた場合、ブロック内で初めて定義された変数はブロックの外から参照できず `NameError` になります。\n"},{"id":12,"cat":"文法","topic":"真偽値","q":"if の条件式で「偽」として扱われる値を2つ選択してください。","choices":["0","\"\"","nil","false","[]"],"answer":[2,3],"cm":true,"exp":"Ruby で偽になるのは `false` と `nil` の2つだけです。\n\n`0`、空文字列 `\"\"`、空配列 `[]` はすべて真として扱われます。C や JavaScript、Python と違う点なので注意しましょう。\n"},{"id":13,"cat":"文法","topic":"case式","q":"次のコードを実行するとどうなりますか。","code":"def judge(v)\n  case v\n  when Integer then \"int\"\n  when 1.0..2.0 then \"range\"\n  when /ab/ then \"regexp\"\n  else \"other\"\n  end\nend\nputs judge(1.5), judge(\"cab\"), judge(2)\n","choices":["range\nregexp\nint","other\nregexp\nint","range\nother\nint","range\nregexp\nrange"],"answer":[0],"cm":true,"exp":"`case` の `when` は `===` で比較します。`===` の意味は左辺のクラスによって変わります。\n\n- `Integer === 2` … クラスのインスタンスか\n- `(1.0..2.0) === 1.5` … 範囲に含まれるか\n- `/ab/ === \"cab\"` … 正規表現にマッチするか\n\n上から順に評価され、最初に一致した節だけが実行されます。`2` は範囲 `1.0..2.0` にも含まれますが、先に `Integer` に一致するので `\"int\"` です。\n"},{"id":14,"cat":"文法","topic":"自己代入","q":"次のコードを実行するとどうなりますか。","code":"a = nil\nb = false\nc = 0\na ||= 1\nb ||= 2\nc ||= 3\np [a, b, c]\n","choices":["[1, 2, 0]","[1, false, 0]","[1, 2, 3]","[nil, false, 0]"],"answer":[0],"cm":true,"exp":"`a ||= x` は `a || (a = x)` と同じ意味で、`a` が `nil` か `false` のときだけ代入されます。\n\n`c` の `0` は真なので代入されず、そのまま `0` です。\n"},{"id":15,"cat":"文法","topic":"演算子の優先順位","q":"次のコードを実行するとどうなりますか。","code":"a = false || true\nb = false or true\np a, b\n","choices":["true\nfalse","true\ntrue","false\ntrue","false\nfalse"],"answer":[0],"cm":true,"exp":"`||` は `=` より優先順位が高いので、`a = (false || true)` となり `a` は `true` です。\n\n一方 `or` は `=` より優先順位が低いので、`(b = false) or true` と解釈され、`b` には `false` が入ります。`and` と `not` も同様に優先順位が低い演算子です。\n"},{"id":16,"cat":"文法","topic":"多重代入","q":"次のコードを実行するとどうなりますか。","code":"a, *b, c = 1, 2, 3, 4, 5\np b\nx, y = [10, 20, 30]\np y\n","choices":["[2, 3, 4]\n20","[2, 3, 4, 5]\n20","2\n[20, 30]","[2, 3, 4]\n[20, 30]"],"answer":[0],"cm":true,"exp":"`*` を付けた変数は、他の変数に割り当てた残りの要素を配列で受け取ります。先頭の `a` に 1、末尾の `c` に 5 が入り、残りの `[2, 3, 4]` が `b` に入ります。\n\n右辺が配列1つの場合は展開されて各変数に代入され、余った `30` は捨てられます。\n"},{"id":17,"cat":"文法","topic":"ループ制御","q":"次のコードを実行するとどうなりますか。","code":"i = 0\nresult = while i \u003c 5\n  i += 1\n  next if i == 2\n  break i * 10 if i == 4\nend\np result\n","choices":["40","nil","4","50"],"answer":[0],"cm":true,"exp":"`while` は通常 `nil` を返しますが、`break` に値を渡すと、その値が `while` 式の戻り値になります。\n\n`next` はその回の残りの処理を飛ばして次の繰り返し（条件判定）へ進みます。`i` が 4 のとき `break i * 10` が実行され、結果は `40` です。\n"},{"id":18,"cat":"文法","topic":"繰り返しメソッド","q":"次のコードを実行するとどうなりますか。","code":"1.step(10, 4) { |i| print i, \" \" }\n","choices":["1 5 9","1 4 7 10","1 5 9 13","4 8"],"answer":[0],"cm":true,"exp":"`Numeric#step(上限, 増分)` は、自身から上限まで増分ずつ増やしながらブロックを実行します。1, 5, 9 と進み、次の 13 は上限 10 を超えるので実行されません。\n\n似たメソッドに `upto`（1ずつ増やす）、`downto`（1ずつ減らす）、`times`（0 から n-1 まで）があります。\n"},{"id":19,"cat":"文法","topic":"例外処理","q":"次のコードを実行するとどうなりますか。","code":"begin\n  puts \"A\"\n  raise ArgumentError\nrescue TypeError\n  puts \"B\"\nrescue ArgumentError, NameError\n  puts \"C\"\nelse\n  puts \"D\"\nensure\n  puts \"E\"\nend\n","choices":["A\nC\nE","A\nB\nE","A\nC\nD\nE","A\nE"],"answer":[0],"cm":true,"exp":"発生した例外は、上の `rescue` 節から順に照合されます。`ArgumentError` は2つ目の節で捕捉されます（1つの `rescue` にカンマ区切りで複数のクラスを書けます）。\n\n- `else` … 例外が発生しなかったときだけ実行\n- `ensure` … 例外の有無にかかわらず必ず実行\n"},{"id":20,"cat":"文法","topic":"retry","q":"次のコードを実行するとどうなりますか。","code":"count = 0\nbegin\n  count += 1\n  raise \"error\" if count \u003c 3\n  puts \"ok: #{count}\"\nrescue\n  retry\nend\n","choices":["ok: 3","ok: 1","ok: 2","!無限ループになる"],"answer":[0],"cm":true,"exp":"`rescue` 節の中で `retry` を呼ぶと、`begin` 節の先頭からやり直します。\n\n`count` は `begin` の外で定義した変数で、`begin` は新しいスコープを作らないのでリセットされません。3回目で例外が発生しなくなり `ok: 3` と出力されます。\n"},{"id":21,"cat":"文法","topic":"例外クラス","q":"次のコードを実行するとどうなりますか。","code":"begin\n  raise \"oops\"\nrescue => e\n  p e.class\n  p e.message\nend\n","choices":["RuntimeError\n\"oops\"","StandardError\n\"oops\"","Exception\n\"oops\"","String\n\"oops\""],"answer":[0],"cm":true,"exp":"`raise` に文字列だけを渡すと `RuntimeError` が発生し、その文字列がメッセージになります。\n\n`rescue => e` のように例外クラスを省略すると、`StandardError` とそのサブクラスを捕捉します。`RuntimeError` は `StandardError` のサブクラスなので捕捉されます。\n"},{"id":22,"cat":"文法","topic":"メソッドの引数","q":"次のコードを実行するとどうなりますか。","code":"def foo(a, b = 2, *c, d)\n  p [a, b, c, d]\nend\nfoo(1, 3, 5, 7, 9)\n","choices":["[1, 3, [5, 7], 9]","[1, 2, [3, 5, 7], 9]","[1, 3, [5, 7, 9], nil]","!`ArgumentError` が発生する"],"answer":[0],"cm":true,"exp":"引数はまず必須引数に割り当てられます。先頭の `a` に 1、末尾の `d` に 9 が入ります。\n\n残った 3, 5, 7 のうち、デフォルト値付きの `b` に 3 が入り、さらに残った 5, 7 が可変長引数 `c` に配列で入ります。\n"},{"id":23,"cat":"文法","topic":"キーワード引数","q":"__(1)__ に記述すると〔実行結果〕が出力されるコードを2つ選択してください。","code":"def order(item, size: \"M\", count:)\n  \"#{item}-#{size}-#{count}\"\nend\nputs __(1)__\n","result":"coffee-M-2","choices":["order(\"coffee\", count: 2)","order(\"coffee\", 2)","order(item: \"coffee\", count: 2)","order(\"coffee\", size: \"M\", count: 2)"],"answer":[0,3],"cm":true,"exp":"`count:` のようにデフォルト値のないキーワード引数は必須で、省略すると `ArgumentError` になります。`size:` はデフォルト値 `\"M\"` があるので省略できます。\n\nキーワード引数は名前を付けて渡す必要があり、`order(\"coffee\", 2)` のように位置で渡すことはできません。また `item` は通常の引数なので、`item: \"coffee\"` のようにキーワード形式では渡せません。\n"},{"id":24,"cat":"文法","topic":"可変長キーワード引数","q":"次のコードを実行するとどうなりますか。","code":"def setup(name, **opts)\n  p name\n  p opts\nend\nsetup(\"app\", port: 80, debug: true)\n","choices":["\"app\"\n{:port=>80, :debug=>true}","\"app\"\n[:port, 80, :debug, true]","\"app\"\n[{:port=>80, :debug=>true}]","!`ArgumentError` が発生する"],"answer":[0],"cm":true,"exp":"`**` を付けた引数は、定義されていないキーワード引数をまとめてハッシュ（キーはシンボル）で受け取ります。\n\n`*` を付けた可変長引数が配列で受け取るのと区別して覚えましょう。\n"},{"id":25,"cat":"文法","topic":"ブロックとyield","q":"次のコードを実行するとどうなりますか。","code":"def calc(x)\n  return x unless block_given?\n  yield(x) * 2\nend\np calc(3)\np calc(3) { |n| n + 1 }\n","choices":["3\n8","3\n4","nil\n8","6\n8"],"answer":[0],"cm":true,"exp":"`block_given?` はメソッドにブロックが渡されたかどうかを返します。\n\nブロックなしの呼び出しでは `x` をそのまま返して `3`。ブロックありでは `yield(x)` でブロックを実行し（3 + 1 = 4）、それを2倍して `8` になります。\n"},{"id":26,"cat":"文法","topic":"Procとlambda","q":"次のコードを実行するとどうなりますか。","code":"pr = Proc.new { |a, b| \"#{a}-#{b}\" }\nla = ->(a, b) { \"#{a}-#{b}\" }\nputs pr.call(1)\nputs la.call(1)\n","choices":["`1-` と出力された後、`ArgumentError` が発生する","`ArgumentError` が発生し、何も出力されない","`1-` が2回出力される","`1-` と `1-nil` が出力される"],"answer":[0],"cm":false,"exp":"`Proc.new`（や `proc`）で作った Proc は引数の数に寛容で、足りない引数は `nil`、余分な引数は無視されます。`\"#{nil}\"` は空文字列なので `1-` と出力されます。\n\nlambda（`->` や `lambda`）は引数の数を厳密にチェックするため、`ArgumentError` が発生します。\n\nまた、`return` の動きも異なり、lambda 内の `return` は lambda 自身から抜けるだけです。\n"},{"id":27,"cat":"文法","topic":"メソッドの戻り値","q":"次のコードを実行するとどうなりますか。","code":"def minmax(a)\n  return a.min, a.max\nend\nx = minmax([3, 1, 4])\np x\n","choices":["[1, 4]","1","4","!`SyntaxError` が発生する"],"answer":[0],"cm":true,"exp":"`return` にカンマ区切りで複数の値を渡すと、配列にまとめて返されます。\n\n`min, max = minmax([3, 1, 4])` のように多重代入で受け取るのが定番の使い方です。\n"},{"id":28,"cat":"文法","topic":"定数のスコープ","q":"次のコードを実行するとどうなりますか。","code":"NAME = \"top\"\nmodule App\n  NAME = \"app\"\n  class Config\n    def name\n      NAME\n    end\n  end\nend\np App::Config.new.name\np ::NAME\n","choices":["\"app\"\n\"top\"","\"top\"\n\"top\"","\"app\"\n\"app\"","!`NameError` が発生する"],"answer":[0],"cm":true,"exp":"定数は、まずコードの入れ子構造（レキシカルスコープ）の内側から順に探されます。`App` の中にあるクラスから参照した `NAME` は `App::NAME` なので `\"app\"` です。\n\n`::NAME` のように先頭に `::` を付けると、トップレベルの定数を参照します。\n"},{"id":29,"cat":"組み込みライブラリ","topic":"数値演算","q":"次のコードを実行するとどうなりますか。","code":"p 7 / 2\np(-7 / 2)\np 7 % -3\np 7.0 / 2\n","choices":["3\n-4\n-2\n3.5","3\n-3\n1\n3.5","3\n-4\n1\n3","3.5\n-3.5\n-2\n3.5"],"answer":[0],"cm":true,"exp":"整数どうしの `/` は整数除算で、結果は小さい方（負の無限大方向）に丸められます。-3.5 は -4 になります。\n\n`%` の結果の符号は右辺（割る数）と同じになります。7 = (-3) × (-3) + (-2) なので `-2` です。\n\nどちらかが Float なら結果も Float になります。\n"},{"id":30,"cat":"組み込みライブラリ","topic":"数値の丸め","q":"次のコードを実行するとどうなりますか。","code":"p 10.divmod(3)\np 3.7.floor\np 3.2.ceil\np(-3.5.round)\np 10.fdiv(4)\n","choices":["[3, 1]\n3\n4\n-4\n2.5","[3, 1]\n3\n4\n-3\n2","[3, 0]\n4\n3\n-4\n2.5","3.3333333333333335\n3\n4\n-4\n2"],"answer":[0],"cm":true,"exp":"- `divmod` … 商と余りを配列で返す\n- `floor` … 切り捨て、`ceil` … 切り上げ\n- `round` … 四捨五入。ちょうど .5 のときは 0 から遠い方へ丸める（-3.5 → -4）\n- `fdiv` … Float として割り算した結果を返す（10 / 4 → 2.5）\n"},{"id":31,"cat":"組み込みライブラリ","topic":"破壊的メソッド","q":"次のコードを実行するとどうなりますか。","code":"s = \"ruby\"\nt = s.upcase\nu = s.upcase!\np s, t, u\nv = s.upcase!\np v\n","choices":["\"RUBY\"\n\"RUBY\"\n\"RUBY\"\nnil","\"ruby\"\n\"RUBY\"\n\"RUBY\"\n\"RUBY\"","\"RUBY\"\n\"RUBY\"\n\"RUBY\"\n\"RUBY\"","\"ruby\"\n\"RUBY\"\nnil\nnil"],"answer":[0],"cm":true,"exp":"`!` 付きのメソッドの多くは破壊的で、レシーバ自身を変更します。\n\n`upcase!` は変更があればレシーバ自身を返しますが、変更がなければ `nil` を返します。すでに大文字になった `s` に再び `upcase!` を呼ぶと `nil` です。`downcase!`、`capitalize!`、`gsub!`、`strip!` なども同じ挙動です。\n"},{"id":32,"cat":"組み込みライブラリ","topic":"オブジェクトの参照","q":"次のコードを実行するとどうなりますか。","code":"a = \"hello\"\nb = a\nc = a.dup\nb \u003c\u003c \" world\"\np a\np c\n","choices":["\"hello world\"\n\"hello\"","\"hello\"\n\"hello\"","\"hello world\"\n\"hello world\"","\"hello\"\n\"hello world\""],"answer":[0],"cm":true,"exp":"変数への代入はオブジェクトの参照をコピーするだけなので、`a` と `b` は同じ文字列オブジェクトを指します。`\u003c\u003c` は破壊的に連結するため、`a` からも変更が見えます。\n\n`dup` は別のオブジェクトを作るので影響を受けません。なお `b += \" world\"` と書いた場合は新しい文字列が作られ、`a` は変わりません。\n"},{"id":33,"cat":"組み込みライブラリ","topic":"freeze","q":"次のコードを実行するとどうなりますか。","code":"arr = [\"a\", \"b\"].freeze\narr[0] \u003c\u003c \"x\"\np arr\narr \u003c\u003c \"c\"\n","choices":["`[\"ax\", \"b\"]` と出力された後、`FrozenError` が発生する","`[\"a\", \"b\"]` と出力された後、`FrozenError` が発生する","2行目で `FrozenError` が発生する","`[\"ax\", \"b\"]` と出力され、エラーは発生しない"],"answer":[0],"cm":false,"exp":"`freeze` はそのオブジェクト自体（ここでは配列）を変更不可にしますが、中の要素までは凍結しません（浅い freeze）。\n\nそのため要素の文字列への `\u003c\u003c` は成功し、配列への `\u003c\u003c` で `FrozenError` が発生します。\n"},{"id":34,"cat":"組み込みライブラリ","topic":"dupとclone","q":"次のコードを実行するとどうなりますか。","code":"s = \"abc\".freeze\np s.dup.frozen?\np s.clone.frozen?\np s.frozen?\n","choices":["false\ntrue\ntrue","true\ntrue\ntrue","false\nfalse\ntrue","true\nfalse\ntrue"],"answer":[0],"cm":true,"exp":"`dup` も `clone` もオブジェクトを複製しますが、`clone` は凍結状態（と特異メソッド）もコピーし、`dup` はコピーしません。\n"},{"id":35,"cat":"組み込みライブラリ","topic":"オブジェクトの比較","q":"次のコードを実行するとどうなりますか。","code":"p 1 == 1.0\np 1.eql?(1.0)\np \"a\".equal?(\"a\")\np :a.equal?(:a)\n","choices":["true\nfalse\nfalse\ntrue","true\ntrue\nfalse\ntrue","true\nfalse\ntrue\ntrue","false\nfalse\nfalse\ntrue"],"answer":[0],"cm":true,"exp":"- `==` … 値が等しいか（`1` と `1.0` は等しい）\n- `eql?` … 型も含めて等しいか（Integer と Float は別物）\n- `equal?` … 同一のオブジェクトか（`object_id` が同じか）\n\n文字列リテラルは評価されるたびに別のオブジェクトが作られますが、同じ名前のシンボルは常に同一のオブジェクトです。\n"},{"id":36,"cat":"組み込みライブラリ","topic":"型変換","q":"次のコードを実行するとどうなりますか。","code":"p \"12abc\".to_i\np \"abc\".to_i\np Integer(\"12abc\")\n","choices":["`12`、`0` と出力された後、`ArgumentError` が発生する","`12`、`0`、`12` と出力される","`12`、`nil` と出力された後、`ArgumentError` が発生する","1行目で `ArgumentError` が発生する"],"answer":[0],"cm":false,"exp":"`String#to_i` は先頭から数値として読める部分だけを変換し、読めなければ `0` を返します（例外は発生しません）。\n\n`Kernel#Integer` は厳密で、数値として正しくない文字列を渡すと `ArgumentError` を発生させます。`to_f` と `Float()` も同じ関係です。\n"},{"id":37,"cat":"組み込みライブラリ","topic":"String（部分文字列）","q":"次のコードを実行するとどうなりますか。","code":"s = \"Hello, Ruby\"\np s[0, 5]\np s[-4..]\np s[7]\n","choices":["\"Hello\"\n\"Ruby\"\n\"R\"","\"Hello,\"\n\"Ruby\"\n\"R\"","\"Hello\"\n\"Ruby\"\n\" \"","\"Hell\"\n\"uby\"\n\"R\""],"answer":[0],"cm":true,"exp":"- `s[開始位置, 長さ]` … 開始位置から指定した長さの部分文字列\n- `s[-4..]` … 末尾から4文字目以降（終端を省略した範囲）\n- `s[7]` … 位置7の1文字（先頭は0）\n"},{"id":38,"cat":"組み込みライブラリ","topic":"String（分割）","q":"__(1)__ に記述すると〔実行結果〕が出力されるコードを2つ選択してください。","code":"s = \"apple banana cherry\"\np __(1)__\n","result":"[\"apple\", \"banana\", \"cherry\"]","choices":["s.split","s.split(\" \")","s.chars","s.lines"],"answer":[0,1],"cm":true,"exp":"引数なしの `split` と `split(\" \")` は、空白（連続する空白もまとめて）で区切った配列を返します。\n\n`chars` は1文字ずつの配列、`lines` は改行で区切った配列（改行がなければ要素1つ）を返します。\n"},{"id":39,"cat":"組み込みライブラリ","topic":"String（整形）","q":"次のコードを実行するとどうなりますか。","code":"puts \"ab\" * 3\nputs \"ab\".center(6, \"*\")\nputs \"ab\".rjust(5, \"0\")\n","choices":["ababab\n**ab**\n000ab","ababab\n*ab***\n000ab","ab3\n**ab**\nab000","ababab\n**ab**\nab000"],"answer":[0],"cm":true,"exp":"`String#*` は文字列を指定回数繰り返します。\n\n`center` は中央寄せ、`ljust` は左寄せ、`rjust` は右寄せです。第2引数で空いた部分を埋める文字を指定できます（省略すると空白）。\n"},{"id":40,"cat":"組み込みライブラリ","topic":"書式指定","q":"次のコードを実行するとどうなりますか。","code":"puts \"%05.1f\" % 3.14159\nputs format(\"%-5s|\", \"ab\")\nputs \"%x\" % 255\n","choices":["003.1\nab   |\nff","3.14159\nab|\n255","00003.1\n   ab|\nFF","003.1\n   ab|\nff"],"answer":[0],"cm":true,"exp":"- `%05.1f` … 全体5桁・小数点以下1桁で、足りない桁は0で埋める\n- `%-5s` … 5文字幅で左寄せ（`-` がなければ右寄せ）\n- `%x` … 16進数（小文字）。`%X` は大文字、`%b` は2進数、`%o` は8進数\n\n`String#%` と `format`（別名 `sprintf`）は同じ書式指定を使います。\n"},{"id":41,"cat":"組み込みライブラリ","topic":"String（空白・改行の除去）","q":"次のコードを実行するとどうなりますか。","code":"s = \"  ruby\\n\"\np s.chomp\np s.strip\np s.chop.chop\n","choices":["\"  ruby\"\n\"ruby\"\n\"  rub\"","\"ruby\"\n\"ruby\"\n\"  ru\"","\"  ruby\"\n\"ruby\\n\"\n\"  rub\"","\"  ruby\\n\"\n\"ruby\"\n\"  ru\""],"answer":[0],"cm":true,"exp":"- `chomp` … 末尾の改行だけを取り除く\n- `strip` … 先頭と末尾の空白（改行・タブも含む）を取り除く\n- `chop` … 末尾の1文字を取り除く（末尾が `\\r\\n` なら2文字まとめて）\n\n`chop` を2回呼ぶと、改行と `y` が取り除かれて `\"  rub\"` になります。\n"},{"id":42,"cat":"組み込みライブラリ","topic":"正規表現","q":"次のコードを実行するとどうなりますか。","code":"s = \"tel: 03-1234-5678\"\nif s =~ /(\\d+)-(\\d+)-(\\d+)/\n  p $1\n  p $~[3]\nend\np s.scan(/\\d+/).size\n","choices":["\"03\"\n\"5678\"\n3","\"03-1234-5678\"\n\"5678\"\n3","\"03\"\n\"1234\"\n3","\"03\"\n\"5678\"\n1"],"answer":[0],"cm":true,"exp":"`=~` はマッチした位置（マッチしなければ `nil`）を返します。マッチの結果は `$~`（MatchData オブジェクト）に入り、`()` で囲んだグループは `$1`、`$2`… で参照できます。`$~[0]` はマッチした部分全体、`$~[3]` は3番目のグループです。\n\n`scan` はマッチした部分をすべて配列で返します（`[\"03\", \"1234\", \"5678\"]`）。\n"},{"id":43,"cat":"組み込みライブラリ","topic":"Array（追加・取り出し）","q":"次のコードを実行するとどうなりますか。","code":"a = [1, 2, 3]\na.push(4).unshift(0)\nx = a.pop\ny = a.shift\np a, x, y\n","choices":["[1, 2, 3]\n4\n0","[0, 1, 2, 3]\n4\n0","[1, 2, 3]\n0\n4","[0, 1, 2, 3, 4]\n4\n0"],"answer":[0],"cm":true,"exp":"- `push`（`\u003c\u003c`）… 末尾に追加\n- `unshift` … 先頭に追加\n- `pop` … 末尾の要素を取り出す\n- `shift` … 先頭の要素を取り出す\n\n`push` は配列自身を返すので、そのまま `unshift` をつなげられます。\n"},{"id":44,"cat":"組み込みライブラリ","topic":"Array（select / map）","q":"次のコードを実行するとどうなりますか。","code":"nums = [1, 2, 3, 4, 5, 6]\np nums.select(&:even?).map { |n| n * n }.sum\n","choices":["56","91","12","35"],"answer":[0],"cm":true,"exp":"`select` はブロックが真を返した要素を集めます → `[2, 4, 6]`。`&:even?` は `{ |n| n.even? }` の省略形です。\n\n`map` でそれぞれ2乗して `[4, 16, 36]`、`sum` で合計 56 です。\n\n`select` の別名は `filter`、逆に偽の要素を集めるのは `reject`、`map` の別名は `collect` です。\n"},{"id":45,"cat":"組み込みライブラリ","topic":"Array（inject）","q":"次のコードを実行するとどうなりますか。","code":"p [1, 2, 3, 4].inject(10) { |sum, n| sum + n }\np [1, 2, 3, 4].inject(:*)\n","choices":["20\n24","10\n24","20\n10","11\n24"],"answer":[0],"cm":true,"exp":"`inject`（別名 `reduce`）は要素を順に畳み込みます。ブロックの第1引数が途中の結果、第2引数が要素です。初期値 10 に 1〜4 を足して 20 になります。\n\n初期値を省略すると先頭の要素が初期値になります。シンボルを渡すとその演算子を順に適用します（1 × 2 × 3 × 4 = 24）。\n"},{"id":46,"cat":"組み込みライブラリ","topic":"Array（範囲外の参照）","q":"次のコードを実行するとどうなりますか。","code":"a = [10, 20, 30, 40, 50]\np a[1, 2]\np a[-2..]\np a[5, 1]\np a[6, 1]\n","choices":["[20, 30]\n[40, 50]\n[]\nnil","[20, 30]\n[40, 50]\nnil\nnil","[20, 30]\n[40, 50]\n[]\n[]","[20, 30, 40]\n[40, 50]\n[]\nnil"],"answer":[0],"cm":true,"exp":"`a[開始位置, 長さ]` は部分配列を返します。\n\n開始位置がちょうど配列の長さ（ここでは 5）と等しいときは空配列 `[]`、それより大きいと `nil` を返すという特殊なルールがあります。\n\nなお `a[5]` のように位置だけを指定した場合は `nil` です。\n"},{"id":47,"cat":"組み込みライブラリ","topic":"Array（整理系メソッド）","q":"次のコードを実行するとどうなりますか。","code":"a = [3, [1, nil], [2, [3, nil]]]\np a.flatten.compact.uniq.sort\n","choices":["[1, 2, 3]","[1, 2, 3, 3]","[3, 1, 2]","!`ArgumentError` が発生する"],"answer":[0],"cm":true,"exp":"1. `flatten` で入れ子を平らにする → `[3, 1, nil, 2, 3, nil]`\n2. `compact` で `nil` を取り除く → `[3, 1, 2, 3]`\n3. `uniq` で重複を取り除く → `[3, 1, 2]`\n4. `sort` で並べ替える → `[1, 2, 3]`\n\n`nil` を残したまま `sort` すると、数値と `nil` を比較できず `ArgumentError` になります。\n"},{"id":48,"cat":"組み込みライブラリ","topic":"Array（集合演算）","q":"次のコードを実行するとどうなりますか。","code":"a = [1, 2, 2, 3]\nb = [2, 3, 4]\np a & b\np a | b\np a - b\n","choices":["[2, 3]\n[1, 2, 3, 4]\n[1]","[2, 2, 3]\n[1, 2, 2, 3, 4]\n[1]","[2, 3]\n[1, 2, 3, 4]\n[1, 2]","[2, 3]\n[1, 2, 2, 3, 2, 3, 4]\n[1]"],"answer":[0],"cm":true,"exp":"- `&` … 両方に含まれる要素（積集合）。重複は除かれる\n- `|` … どちらかに含まれる要素（和集合）。重複は除かれる\n- `-` … 右辺に含まれる要素をすべて取り除く（2 は2つとも消える）\n\n`+` は単純な連結で、重複は残ります。\n"},{"id":49,"cat":"組み込みライブラリ","topic":"Array（zip）","q":"次のコードを実行するとどうなりますか。","code":"names = [\"a\", \"b\", \"c\"]\nnums = [1, 2]\np names.zip(nums)\n","choices":["[[\"a\", 1], [\"b\", 2], [\"c\", nil]]","[[\"a\", 1], [\"b\", 2]]","[[\"a\", \"b\", \"c\"], [1, 2]]","{\"a\"=>1, \"b\"=>2, \"c\"=>nil}"],"answer":[0],"cm":true,"exp":"`zip` はレシーバと引数の同じ位置にある要素を組にした配列を返します。引数側の要素が足りない場合は `nil` で埋められます。\n\n続けて `.to_h` を呼ぶとハッシュに変換できます。\n"},{"id":50,"cat":"組み込みライブラリ","topic":"Array.new","q":"次のコードを実行するとどうなりますか。","code":"a = Array.new(3, \"x\")\nb = Array.new(3) { \"x\" }\na[0] \u003c\u003c \"y\"\nb[0] \u003c\u003c \"y\"\np a, b\n","choices":["[\"xy\", \"xy\", \"xy\"]\n[\"xy\", \"x\", \"x\"]","[\"xy\", \"x\", \"x\"]\n[\"xy\", \"x\", \"x\"]","[\"xy\", \"xy\", \"xy\"]\n[\"xy\", \"xy\", \"xy\"]","[\"xy\", \"x\", \"x\"]\n[\"xy\", \"xy\", \"xy\"]"],"answer":[0],"cm":true,"exp":"`Array.new(3, \"x\")` は、同じ1つの文字列オブジェクトを3回参照する配列を作ります。そのため1つの要素への破壊的な変更（`\u003c\u003c`）が、すべての要素に反映されます。\n\nブロックを渡すと要素ごとにブロックが評価され、それぞれ別のオブジェクトになります。\n"},{"id":51,"cat":"組み込みライブラリ","topic":"Array（削除）","q":"次のコードを実行するとどうなりますか。","code":"a = [1, 2, 3, 2, 1]\np a.delete(2)\np a\np a.delete_at(0)\np a\n","choices":["2\n[1, 3, 1]\n1\n[3, 1]","2\n[1, 3, 2, 1]\n1\n[3, 2, 1]","[1, 3, 1]\n[1, 3, 1]\n[3, 1]\n[3, 1]","2\n[1, 3, 1]\n3\n[1, 1]"],"answer":[0],"cm":true,"exp":"`delete(値)` は値が一致する要素を**すべて**削除し、削除した値を返します。\n\n`delete_at(位置)` は指定した位置の要素を削除し、その要素を返します。どちらも配列自身を変更する破壊的メソッドです。\n"},{"id":52,"cat":"組み込みライブラリ","topic":"each_slice / each_cons","q":"次のコードを実行するとどうなりますか。","code":"a = [1, 2, 3, 4, 5]\np a.each_slice(2).to_a\np a.each_cons(3).to_a.size\n","choices":["[[1, 2], [3, 4], [5]]\n3","[[1, 2], [3, 4]]\n3","[[1, 2], [3, 4], [5]]\n2","[[1, 2], [2, 3], [3, 4], [4, 5]]\n3"],"answer":[0],"cm":true,"exp":"`each_slice(n)` は n 個ずつに区切ります（最後は余りの要素だけ）。\n\n`each_cons(n)` は1つずつずらしながら、連続する n 個の組を作ります。`[1, 2, 3]`、`[2, 3, 4]`、`[3, 4, 5]` の3組です。\n\nどちらもブロックを渡さないと Enumerator を返すので、`to_a` で配列にできます。\n"},{"id":53,"cat":"組み込みライブラリ","topic":"並べ替え","q":"次のコードを実行するとどうなりますか。","code":"words = %w(pear fig banana kiwi)\np words.sort_by { |w| [w.size, w] }\np words.sort { |a, b| b \u003c=> a }\n","choices":["[\"fig\", \"kiwi\", \"pear\", \"banana\"]\n[\"pear\", \"kiwi\", \"fig\", \"banana\"]","[\"fig\", \"pear\", \"kiwi\", \"banana\"]\n[\"pear\", \"kiwi\", \"fig\", \"banana\"]","[\"fig\", \"kiwi\", \"pear\", \"banana\"]\n[\"banana\", \"fig\", \"kiwi\", \"pear\"]","[\"banana\", \"fig\", \"kiwi\", \"pear\"]\n[\"pear\", \"kiwi\", \"fig\", \"banana\"]"],"answer":[0],"cm":true,"exp":"`sort_by` はブロックの戻り値を基準に並べます。配列を返すと先頭の要素から順に比較されるので、「長さが短い順 → 同じ長さならアルファベット順」になります。\n\n`sort` にブロックを渡すと、2つの要素を受け取り `\u003c=>` の結果（-1 / 0 / 1）で並べます。`b \u003c=> a` と逆にすると降順になります。\n"},{"id":54,"cat":"組み込みライブラリ","topic":"Hash（デフォルト値）","q":"次のコードを実行するとどうなりますか。","code":"h = Hash.new(0)\n\"banana\".each_char { |c| h[c] += 1 }\np h\n","choices":["{\"b\"=>1, \"a\"=>3, \"n\"=>2}","{\"b\"=>1, \"a\"=>1, \"n\"=>1}","{}","!`NoMethodError` が発生する"],"answer":[0],"cm":true,"exp":"`Hash.new(0)` は、存在しないキーを参照したときに `0` を返すハッシュを作ります。`h[c] += 1` は `h[c] = h[c] + 1` と同じなので、初回でも `0 + 1` となり、文字の出現回数を数えられます。\n\n`Hash.new`（デフォルト値なし）だと初回が `nil + 1` になり `NoMethodError` です。ハッシュのキーは挿入した順に並びます。\n"},{"id":55,"cat":"組み込みライブラリ","topic":"Hash（デフォルト値の共有）","q":"次のコードを実行するとどうなりますか。","code":"h = Hash.new([])\nh[:a] \u003c\u003c 1\nh[:b] \u003c\u003c 2\np h\np h[:c]\n","choices":["{}\n[1, 2]","{:a=>[1], :b=>[2]}\n[]","{:a=>[1, 2], :b=>[1, 2]}\n[1, 2]","{}\n[]"],"answer":[0],"cm":true,"exp":"`Hash.new([])` のデフォルト値は1つの配列オブジェクトで、存在しないすべてのキーで共有されます。\n\n`h[:a] \u003c\u003c 1` はデフォルトの配列に要素を追加するだけで、ハッシュへの代入は行われないため、キーは登録されません。結果としてハッシュは空のまま、デフォルトの配列が `[1, 2]` になります。\n\nキーごとに別の配列を持たせたいときは `Hash.new { |hash, key| hash[key] = [] }` と書きます。\n"},{"id":56,"cat":"組み込みライブラリ","topic":"Hash（Enumerableのメソッド）","q":"次のコードを実行するとどうなりますか。","code":"h = { a: 1, b: 2, c: 3 }\np h.select { |k, v| v > 1 }\np h.map { |k, v| v * 2 }\np h.find { |k, v| v > 1 }\n","choices":["{:b=>2, :c=>3}\n[2, 4, 6]\n[:b, 2]","[[:b, 2], [:c, 3]]\n[2, 4, 6]\n[:b, 2]","{:b=>2, :c=>3}\n{:a=>2, :b=>4, :c=>6}\n[:b, 2]","{:b=>2, :c=>3}\n[2, 4, 6]\n{:b=>2}"],"answer":[0],"cm":true,"exp":"`Hash#select`（`filter`、`reject` も）はハッシュを返します。\n\n一方 `map` は Enumerable のメソッドなので配列を返し、`find` は条件を満たした最初の要素を `[キー, 値]` の配列で返します。\n"},{"id":57,"cat":"組み込みライブラリ","topic":"Hash（fetch）","q":"__(1)__ に記述すると〔実行結果〕が出力されるコードを2つ選択してください。","code":"h = { \"apple\" => 100 }\np __(1)__\n","result":"0","choices":["h[\"orange\"]","h.fetch(\"orange\", 0)","h.fetch(\"orange\")","h.fetch(\"orange\") { 0 }"],"answer":[1,3],"cm":true,"exp":"`h[キー]` は存在しないキーに対してデフォルト値（指定がなければ `nil`）を返します。\n\n`fetch` は存在しないキーに対して `KeyError` を発生させますが、第2引数またはブロックで「キーがないときの値」を指定できます。\n"},{"id":58,"cat":"組み込みライブラリ","topic":"Hash（merge）","q":"次のコードを実行するとどうなりますか。","code":"a = { x: 1, y: 2 }\nb = { y: 10, z: 20 }\np a.merge(b)\np a.merge(b) { |key, old, new| old + new }\np a\n","choices":["{:x=>1, :y=>10, :z=>20}\n{:x=>1, :y=>12, :z=>20}\n{:x=>1, :y=>2}","{:x=>1, :y=>2, :z=>20}\n{:x=>1, :y=>12, :z=>20}\n{:x=>1, :y=>2}","{:x=>1, :y=>10, :z=>20}\n{:x=>1, :y=>12, :z=>20}\n{:x=>1, :y=>12, :z=>20}","{:x=>1, :y=>10, :z=>20}\n{:x=>1, :y=>10, :z=>20}\n{:x=>1, :y=>2}"],"answer":[0],"cm":true,"exp":"`merge` はキーが重複すると引数側の値で上書きします。ブロックを渡すと、重複したキーの値をブロックの戻り値で決められます（ブロック引数はキー、元の値、新しい値）。\n\n`merge` は非破壊的なので `a` は変わりません。レシーバを変更するのは `merge!`（別名 `update`）です。\n"},{"id":59,"cat":"組み込みライブラリ","topic":"Hash（並べ替え・最大値）","q":"次のコードを実行するとどうなりますか。","code":"scores = { alice: 80, bob: 95, carol: 70 }\np scores.sort_by { |name, score| -score }.first[0]\np scores.max_by { |_, s| s }\np scores.sum { |_, s| s }\n","choices":[":bob\n[:bob, 95]\n245",":carol\n[:bob, 95]\n245","\"bob\"\n{:bob=>95}\n245",":bob\n95\n[80, 95, 70]"],"answer":[0],"cm":true,"exp":"ハッシュに Enumerable のメソッドを使うと、各要素は `[キー, 値]` の配列として扱われます。\n\n`sort_by` は `[[キー, 値], ...]` という配列の配列を返すので、`.first[0]` で最高得点のキー `:bob` が取れます。`max_by` は最大の `[キー, 値]` を返します。\n"},{"id":60,"cat":"組み込みライブラリ","topic":"Hashリテラル","q":"次のコードを実行するとどうなりますか。","code":"h = { \"name\": \"Ruby\", \"ver\" => 3 }\np h.keys\n","choices":["[:name, \"ver\"]","[\"name\", \"ver\"]","[:name, :ver]","!`SyntaxError` が発生する"],"answer":[0],"cm":true,"exp":"`\"name\": 値` のように文字列の直後に `:` を書くと、キーはシンボル（`:name`）になります。`\"ver\" => 3` はキーが文字列のままです。\n\n1つのハッシュにシンボルと文字列のキーを混在させられます。`h[:name]` と `h[\"name\"]` は別のキーとして扱われます。\n"},{"id":61,"cat":"組み込みライブラリ","topic":"Range","q":"次のコードを実行するとどうなりますか。","code":"a = (1..5).to_a\nb = (1...5).to_a\nc = (1..10).step(3).to_a\np a.size, b.size\np c\n","choices":["5\n4\n[1, 4, 7, 10]","5\n5\n[1, 4, 7, 10]","4\n5\n[1, 4, 7]","5\n4\n[3, 6, 9]"],"answer":[0],"cm":true,"exp":"`..` は終端を含み、`...` は終端を含みません。`(1...5)` は 1〜4 です。\n\n`step(n)` は先頭から n おきに要素を取り出します（1, 4, 7, 10）。\n"},{"id":62,"cat":"組み込みライブラリ","topic":"Integer#times","q":"次のコードを実行するとどうなりますか。","code":"r = 3.times { |i| print i }\nputs\np r\n","choices":["012\n3","123\n3","012\nnil","012\n[0, 1, 2]"],"answer":[0],"cm":true,"exp":"`times` はブロックに 0 から n-1 までの数を順に渡します。戻り値はレシーバ自身（`3`）です。`each` もレシーバ自身を返します。\n\n`print` は改行しないので `012` と続けて出力されます。\n"},{"id":63,"cat":"組み込みライブラリ","topic":"出力メソッド","q":"次のコードを実行するとどうなりますか。","code":"a = puts \"x\"\nb = p \"y\"\np a\np b\n","choices":["x\n\"y\"\nnil\n\"y\"","x\n\"y\"\n\"x\"\n\"y\"","x\ny\nnil\nnil","x\n\"y\"\nnil\nnil"],"answer":[0],"cm":true,"exp":"`puts` と `print` は `nil` を返します。`p` は引数をそのまま返します（デバッグ中に式の途中に挟めて便利）。\n\nまた `puts` はオブジェクトの `to_s`、`p` は `inspect` の結果を出力するため、`p` では文字列が `\"` 付きで表示されます。\n"},{"id":64,"cat":"組み込みライブラリ","topic":"File","q":"次のコードを実行するとどうなりますか（memo.txt は書き込み可能とします）。","code":"File.open(\"memo.txt\", \"w\") { |f| f.puts \"one\" }\nFile.open(\"memo.txt\", \"a\") { |f| f.print \"two\" }\np File.read(\"memo.txt\")\n","choices":["\"one\\ntwo\"","\"two\"","\"one\\ntwo\\n\"","\"onetwo\""],"answer":[0],"cm":true,"exp":"- `\"w\"` … 書き込み。ファイルがなければ作成し、あれば中身を空にする\n- `\"a\"` … 末尾への追記\n- `\"r\"` … 読み込み（デフォルト）、`\"r+\"` … 読み書き\n\n`puts` は末尾に改行を付け、`print` は付けません。ブロック付きの `File.open` は、ブロックを抜けると自動でファイルを閉じます。\n"},{"id":65,"cat":"組み込みライブラリ","topic":"Time","q":"次のコードを実行するとどうなりますか。","code":"t = Time.new(2024, 3, 5, 9, 7, 0)\nputs t.strftime(\"%Y/%m/%d %H:%M\")\nputs t.strftime(\"%y%m%d\")\n","choices":["2024/03/05 09:07\n240305","2024/3/5 9:7\n240305","2024/03/05 09:07\n2024035","24/03/05 09:07\n240305"],"answer":[0],"cm":true,"exp":"`%Y` は西暦4桁、`%y` は下2桁、`%m` は月、`%d` は日、`%H` は時（24時間制）、`%M` は分、`%S` は秒です。数値は2桁にゼロ埋めされます。\n\n`%m`（月）と `%M`（分）の大文字・小文字の違いに注意しましょう。\n"},{"id":66,"cat":"組み込みライブラリ","topic":"Comparable","q":"次のコードを実行するとどうなりますか。","code":"class Score\n  include Comparable\n  attr_reader :value\n  def initialize(value)\n    @value = value\n  end\n  def \u003c=>(other)\n    value \u003c=> other.value\n  end\nend\na, b, c = Score.new(70), Score.new(85), Score.new(70)\np a \u003c b, a == c, b.between?(a, c)\ntop = [b, a, c].max\np top.value\n","choices":["true\ntrue\nfalse\n85","true\nfalse\nfalse\n85","true\ntrue\ntrue\n85","!`NoMethodError` が発生する"],"answer":[0],"cm":true,"exp":"`Comparable` をインクルードして `\u003c=>` を定義すると、`\u003c`、`\u003c=`、`==`、`>`、`>=`、`between?`、`clamp` が使えるようになります。\n\n`==` も `\u003c=>` が 0 を返せば `true` なので、別のオブジェクトでも値が同じ `a` と `c` は等しくなります。`b.between?(a, c)` は 85 が 70〜70 の範囲にあるかなので `false` です。\n\n`max` や `sort` も `\u003c=>` を使って比較します。\n"},{"id":67,"cat":"組み込みライブラリ","topic":"Enumerable","q":"次のコードを実行するとどうなりますか。","code":"class NumberList\n  include Enumerable\n  def initialize(*nums)\n    @nums = nums\n  end\n  def each\n    @nums.each { |n| yield n }\n  end\nend\nlist = NumberList.new(3, 1, 2)\np list.sort\np list.map { |n| n * 10 }\np list.include?(2)\n","choices":["[1, 2, 3]\n[30, 10, 20]\ntrue","[1, 2, 3]\n[10, 20, 30]\ntrue","[3, 1, 2]\n[30, 10, 20]\ntrue","!`NoMethodError` が発生する"],"answer":[0],"cm":true,"exp":"`Enumerable` をインクルードし、要素を順に `yield` する `each` メソッドを定義すると、`map`、`select`、`sort`、`include?`、`inject` など多くのメソッドが使えるようになります。\n\n`map` は `each` が渡す順番どおりに処理します。`sort` や `max` を使うには、要素どうしが `\u003c=>` で比較できる必要があります。\n"},{"id":68,"cat":"オブジェクト指向","topic":"セッターとローカル変数","q":"次のコードを実行するとどうなりますか。","code":"class Counter\n  attr_accessor :count\n  def initialize\n    @count = 0\n  end\n  def increment\n    count = count + 1\n  end\nend\nc = Counter.new\nc.increment\np c.count\n","choices":["`1` と出力される","`0` と出力される","`NoMethodError` が発生する","`nil` と出力される"],"answer":[2],"cm":false,"exp":"メソッド内の `count = ...` はセッター `count=` の呼び出しではなく、ローカル変数 `count` への代入とみなされます。\n\n右辺の `count` もこの時点で値が `nil` のローカル変数を指すため、`nil + 1` となり `NoMethodError` です。\n\nセッターを呼ぶには `self.count = count + 1`（または `@count += 1`）と書きます。\n"},{"id":69,"cat":"オブジェクト指向","topic":"継承とsuper","q":"__(1)__ に記述すると〔実行結果〕が出力されるコードを2つ選択してください。","code":"class Animal\n  def initialize(name)\n    @name = name\n  end\n  def speak\n    \"#{@name}です\"\n  end\nend\n\nclass Dog \u003c Animal\n  def initialize(name, breed)\n    __(1)__\n    @breed = breed\n  end\n  def speak\n    super + \"（#{@breed}）\"\n  end\nend\n\nputs Dog.new(\"ポチ\", \"柴犬\").speak\n","result":"ポチです（柴犬）","choices":["super(name)","super","super()","@name = name"],"answer":[0,3],"cm":true,"exp":"括弧も引数もない `super` は、現在のメソッドが受け取った引数をそのまま親クラスのメソッドに渡します。ここでは2つの引数を渡すことになり `ArgumentError` です。`super()` は引数0個を渡すので、これも `ArgumentError` になります。\n\n`super(name)` なら必要な引数だけを渡せます。また、親と同じインスタンス変数 `@name` に直接代入しても同じ結果になります。\n\n`speak` の中の `super` は、親クラスの `speak` を呼び出してその戻り値を返します。\n"},{"id":70,"cat":"オブジェクト指向","topic":"アクセス制御","q":"次のコードを実行するとどうなりますか。","code":"class Account\n  def initialize(balance)\n    @balance = balance\n  end\n  def richer_than?(other)\n    balance > other.balance\n  end\n\n  protected\n\n  def balance\n    @balance\n  end\nend\na = Account.new(100)\nb = Account.new(50)\np a.richer_than?(b)\np a.balance\n","choices":["`true` と出力された後、`NoMethodError` が発生する","`true` と `100` が出力される","1回目の `p` の時点で `NoMethodError` が発生する","`false` と出力された後、`NoMethodError` が発生する"],"answer":[0],"cm":false,"exp":"`protected` のメソッドは、同じクラス（またはサブクラス）のインスタンスメソッドの中であれば、他のオブジェクトをレシーバにして呼び出せます（`other.balance`）。クラスの外からは呼び出せないので、`a.balance` は `NoMethodError` です。\n\n`private` にした場合は、レシーバを指定した `other.balance` もエラーになります（レシーバとして書けるのは `self` だけ）。\n"},{"id":71,"cat":"オブジェクト指向","topic":"クラス変数とインスタンス変数","q":"次のコードを実行するとどうなりますか。","code":"class Foo\n  @@count = 0\n  @name = \"class-level\"\n  def initialize\n    @@count += 1\n  end\n  def self.count\n    @@count\n  end\n  def name\n    @name\n  end\nend\nFoo.new\nf = Foo.new\np Foo.count, f.name\n","choices":["2\nnil","2\n\"class-level\"","1\nnil","1\n\"class-level\""],"answer":[0],"cm":true,"exp":"`@@` で始まるクラス変数は、クラスとそのすべてのインスタンス（サブクラスも）で共有されます。`new` を2回呼んだので `2` です。\n\nクラス定義の直下で代入した `@name` は、クラスオブジェクト自身のインスタンス変数（クラスインスタンス変数）で、各インスタンスの `@name` とは別物です。代入されていないインスタンス変数を参照すると `nil` になります。\n"},{"id":72,"cat":"オブジェクト指向","topic":"Mix-in（include）","q":"次のコードを実行するとどうなりますか。","code":"module Greet\n  def hello\n    \"Greet\"\n  end\nend\nclass Parent\n  def hello\n    \"Parent\"\n  end\nend\nclass Child \u003c Parent\n  include Greet\nend\nputs Child.new.hello\np Child.ancestors.take(3)\n","choices":["Greet\n[Child, Greet, Parent]","Parent\n[Child, Parent, Greet]","Greet\n[Greet, Child, Parent]","Parent\n[Child, Greet, Parent]"],"answer":[0],"cm":true,"exp":"`include` したモジュールは、継承チェーン上でそのクラスの直後（親クラスより前）に挿入されます。\n\nメソッドは `ancestors` の順に探されるため、`Parent#hello` より先に `Greet#hello` が見つかります。\n"},{"id":73,"cat":"オブジェクト指向","topic":"Mix-in（prepend）","q":"次のコードを実行するとどうなりますか。","code":"module Loud\n  def say\n    super.upcase + \"!\"\n  end\nend\nclass Person\n  prepend Loud\n  def say\n    \"hello\"\n  end\nend\nputs Person.new.say\n","choices":["HELLO!","hello","hello!","!`NoMethodError` が発生する"],"answer":[0],"cm":true,"exp":"`prepend` したモジュールはクラスの**前**に挿入されるため、`Person#say` より先に `Loud#say` が呼ばれます。その中の `super` で本来の `Person#say` を呼び出せます。\n\n`include` だった場合は `Person#say` が優先されるので `hello` と出力されます。\n"},{"id":74,"cat":"オブジェクト指向","topic":"モジュール","q":"次のモジュールについての説明として正しいものを2つ選択してください。","code":"module Util\n  VERSION = \"1.0\"\n  def self.hello\n    \"hi\"\n  end\nend\n","choices":["`Util.new` でインスタンスを生成できる","`Util::VERSION` で定数を参照できる","`Util.hello` でメソッドを呼び出せる","`module Tool \u003c Util` のように継承して別のモジュールを作れる"],"answer":[1,2],"cm":false,"exp":"モジュールはインスタンスを作れず（`new` メソッドがない）、継承もできません。\n\nモジュール内の定数は `モジュール名::定数名`、`self.` を付けて定義したモジュールメソッドは `モジュール名.メソッド名` で呼び出せます。\n\nモジュールの主な用途は、名前空間と Mix-in（`include` / `extend` / `prepend`）です。\n"},{"id":75,"cat":"オブジェクト指向","topic":"to_s","q":"次のコードを実行するとどうなりますか。","code":"class Point\n  def initialize(x, y)\n    @x, @y = x, y\n  end\n  def to_s\n    \"(#{@x}, #{@y})\"\n  end\nend\npt = Point.new(1, 2)\nputs pt\nputs \"点: #{pt}\"\n","choices":["(1, 2)\n点: (1, 2)","#\u003cPoint:0x...>\n点: (1, 2)","(1, 2)\n点: #\u003cPoint:0x...>","#\u003cPoint:0x...>\n点: #\u003cPoint:0x...>"],"answer":[0],"cm":true,"exp":"`puts` や式展開 `#{}` は、内部でオブジェクトの `to_s` を呼び出します。`to_s` を定義すると独自の文字列表現にできます。\n\n`p` は `inspect` を使うので、`p pt` とした場合は `#\u003cPoint:0x... @x=1, @y=2>` のような表示になります。\n"},{"id":76,"cat":"オブジェクト指向","topic":"オープンクラス","q":"次のコードを実行するとどうなりますか。","code":"class String\n  def shout\n    upcase + \"!\"\n  end\nend\nclass Greeter\n  def hi\n    \"hello\"\n  end\nend\nclass Greeter\n  def hi\n    \"hey\".shout\n  end\nend\nputs Greeter.new.hi\n","choices":["HEY!","hello","hey","!`NoMethodError` が発生する"],"answer":[0],"cm":true,"exp":"Ruby のクラスはオープンクラスで、定義済みのクラス（組み込みの `String` なども）を再オープンしてメソッドを追加できます。\n\n同じ名前のメソッドを再定義すると、後から定義した内容で上書きされます。\n"},{"id":77,"cat":"オブジェクト指向","topic":"クラスの継承関係","q":"次のコードを実行するとどうなりますか。","code":"p Integer.superclass\np 1.is_a?(Comparable)\np 1.instance_of?(Numeric)\n","choices":["Numeric\ntrue\nfalse","Object\ntrue\nfalse","Numeric\nfalse\nfalse","Numeric\ntrue\ntrue"],"answer":[0],"cm":true,"exp":"`Integer` の親クラスは `Numeric` です（`Integer` → `Numeric` → `Object`）。\n\n`is_a?`（別名 `kind_of?`）は、親クラスやインクルードしているモジュールまで含めて判定します。`Numeric` は `Comparable` をインクルードしているので `true` です。\n\n`instance_of?` はクラスが完全に一致する場合だけ `true` です。\n"},{"id":78,"cat":"オブジェクト指向","topic":"クラスメソッド","q":"__(1)__ に記述すると〔実行結果〕が出力されるコードを2つ選択してください。","code":"class Config\n  class \u003c\u003c self\n    def env\n      \"production\"\n    end\n  end\nend\np __(1)__\n","result":"\"production\"","choices":["Config.env","Config.new.env","Config::env","Config#env"],"answer":[0,2],"cm":true,"exp":"`class \u003c\u003c self` の中で定義したメソッドはクラスメソッド（クラスの特異メソッド）になり、`def self.env` と書くのと同じです。インスタンスからは呼び出せません。\n\nクラスメソッドは `Config.env` のほか、`Config::env` の形でも呼び出せます。\n\n`#` 以降はコメントになるため、`p Config#env` は `p Config` と同じで `Config` と出力されます。\n"},{"id":79,"cat":"オブジェクト指向","topic":"attr系メソッド","q":"次のコードを実行するとどうなりますか。","code":"class User\n  attr_writer :name\n  def greet\n    \"Hi, #{@name}\"\n  end\nend\nu = User.new\nputs u.greet\nu.name = \"Ken\"\nputs u.greet\np u.name\n","choices":["`Hi, ` と `Hi, Ken` が出力された後、`NoMethodError` が発生する","`Hi, ` と `Hi, Ken` と `\"Ken\"` が出力される","1回目の `puts` の時点で `NoMethodError` が発生する","`Hi, nil` と `Hi, Ken` が出力された後、`NoMethodError` が発生する"],"answer":[0],"cm":false,"exp":"`attr_writer` は書き込み用のメソッド（`name=`）だけを定義します。読み出し用は `attr_reader`、両方まとめて定義するのは `attr_accessor` です。読み出し用メソッドがないため `u.name` は `NoMethodError` です。\n\n代入されていない `@name` は `nil` で、`\"#{nil}\"` は空文字列になるので、1回目は `Hi, ` と出力されます。\n"},{"id":80,"cat":"文法","topic":"演算子の優先順位（**）","q":"次のコードを実行するとどうなりますか。","code":"p(-2 ** 2)\np 2 ** 3 ** 2\n","choices":["-4\n512","4\n512","-4\n64","4\n64"],"answer":[0],"cm":true,"exp":"`**` は単項マイナスより優先順位が高いので、`-2 ** 2` は `-(2 ** 2)` となり `-4` です。\n\nまた `**` は右結合なので、`2 ** 3 ** 2` は `2 ** (3 ** 2)` = `2 ** 9` = 512 です。\n"},{"id":81,"cat":"文法","topic":"論理演算子の戻り値","q":"次のコードを実行するとどうなりますか。","code":"p(1 && 2)\np(nil && 1)\np(false || nil)\np(nil || \"x\")\n","choices":["2\nnil\nnil\n\"x\"","true\nfalse\nfalse\ntrue","1\nnil\nfalse\n\"x\"","2\nfalse\nnil\n\"x\""],"answer":[0],"cm":true,"exp":"`&&` と `||` は `true` / `false` ではなく、最後に評価したオペランドの値を返します。\n\n- `a && b` … `a` が偽ならその値（`nil`）、真なら `b` を返す\n- `a || b` … `a` が真ならその値、偽なら `b` を返す（`false || nil` は `nil`）\n"},{"id":82,"cat":"文法","topic":"unless","q":"次のコードを実行するとどうなりますか。","code":"x = 5\nunless x > 3\n  puts \"small\"\nelse\n  puts \"big\"\nend\nputs \"even\" unless x.odd?\nputs \"end\"\n","choices":["big\nend","small\nend","big\neven\nend","small\neven\nend"],"answer":[0],"cm":true,"exp":"`unless` は条件が偽のときに本体を実行します。`else` も書けます（`elsif` は書けません）。\n\n`x > 3` は真なので `else` 側の `big` が出力されます。後置の `unless x.odd?` は、`x` が奇数なので実行されません。\n"},{"id":83,"cat":"文法","topic":"後置while","q":"次のコードを実行するとどうなりますか。","code":"i = 10\nbegin\n  i += 1\nend while i \u003c 5\np i\nj = 10\nj += 1 while j \u003c 5\np j\n","choices":["11\n10","10\n10","11\n11","5\n5"],"answer":[0],"cm":true,"exp":"`begin ... end while 条件` は、本体を先に1回実行してから条件を判定します（do-while）。そのため条件が最初から偽でも1回実行され、`i` は 11 になります。\n\n一方、`式 while 条件` の形は先に条件を判定するので、`j += 1` は一度も実行されません。\n"},{"id":84,"cat":"文法","topic":"until","q":"次のコードを実行するとどうなりますか。","code":"n = 0\nuntil n >= 3\n  print n\n  n += 1\nend\n","choices":["012","0123","123","!何も出力されない"],"answer":[0],"cm":true,"exp":"`until` は条件が偽の間くり返します（`while` の逆）。`n` が 0, 1, 2 のときに出力され、3 になった時点で条件が真になって終了します。\n"},{"id":85,"cat":"文法","topic":"loopとbreak","q":"次のコードを実行するとどうなりますか。","code":"i = 0\nv = loop do\n  i += 1\n  break i * i if i > 3\nend\np v\n","choices":["16","9","nil","4"],"answer":[0],"cm":true,"exp":"`loop` はブロックを無限にくり返すメソッドです。`break` に値を渡すと、それが `loop` の戻り値になります。\n\n`i` が 4 になったとき `break 4 * 4` が実行され、`v` は 16 です。\n"},{"id":86,"cat":"文法","topic":"ブロック内のnext","q":"次のコードを実行するとどうなりますか。","code":"r = [1, 2, 3, 4].map do |x|\n  next 0 if x.even?\n  x * 10\nend\np r\n","choices":["[10, 0, 30, 0]","[10, 30]","[10, nil, 30, nil]","[1, 0, 3, 0]"],"answer":[0],"cm":true,"exp":"ブロック内の `next` は、そのブロックの1回分の処理を終えて値を返します。`next 0` なら、その要素に対するブロックの戻り値は `0` です。\n\n`map` はブロックの戻り値を集めるので、偶数は `0`、奇数は10倍になります。値を付けずに `next` だけ書くと `nil` が返ります。\n"},{"id":87,"cat":"文法","topic":"case式（対象なし）","q":"次のコードを実行するとどうなりますか。","code":"def grade(score)\n  case\n  when score >= 80 then \"A\"\n  when score >= 60 then \"B\"\n  else \"C\"\n  end\nend\nputs grade(85), grade(60), grade(59)\n","choices":["A\nB\nC","A\nC\nC","B\nB\nC","A\nA\nB"],"answer":[0],"cm":true,"exp":"`case` の後ろに対象を書かない場合、各 `when` の式がそのまま条件として評価され、最初に真になった節が実行されます。`if` / `elsif` の連続と同じ動きです。\n\n60 は `score >= 60` を満たすので `\"B\"` です。\n"},{"id":88,"cat":"文法","topic":"case式の戻り値","q":"次のコードを実行するとどうなりますか。","code":"def kind(x)\n  case x\n  when 1, 2 then \"small\"\n  when 3..5 then \"mid\"\n  end\nend\np kind(2), kind(4), kind(9)\n","choices":["\"small\"\n\"mid\"\nnil","\"small\"\n\"mid\"\n\"\"","\"small\"\nnil\nnil","!`NoMatchingPatternError` が発生する"],"answer":[0],"cm":true,"exp":"`when` にはカンマ区切りで複数の値を書けます（どれか1つに一致すればよい）。\n\nどの `when` にも一致せず `else` もない場合、`case` 式の値は `nil` になります。エラーにはなりません（`NoMatchingPatternError` はパターンマッチ `case ... in` のときのエラーです）。\n"},{"id":89,"cat":"文法","topic":"条件演算子","q":"次のコードを実行するとどうなりますか。","code":"a = 7\ns = a > 5 ? (a > 6 ? \"x\" : \"y\") : \"z\"\nt = (1 if false)\np s, t\n","choices":["\"x\"\nnil","\"y\"\nnil","\"x\"\nfalse","\"z\"\n1"],"answer":[0],"cm":true,"exp":"`条件 ? 真のときの値 : 偽のときの値` は条件演算子（三項演算子）です。入れ子にすると内側から順に評価されます。`a` は 7 なので `\"x\"` です。\n\n`if` も式なので値を返します。条件が偽で `else` がない場合の値は `nil` です。\n"},{"id":90,"cat":"文法","topic":"ぼっち演算子（&.）","q":"次のコードを実行するとどうなりますか。","code":"s = nil\np s&.length\np s.to_s.length\nt = \"abc\"\np t&.length\n","choices":["nil\n0\n3","0\n0\n3","!1行目の `p` で `NoMethodError` が発生する","nil\nnil\n3"],"answer":[0],"cm":true,"exp":"`&.`（safe navigation 演算子）は、レシーバが `nil` のときはメソッドを呼ばずに `nil` を返します。レシーバが `nil` 以外なら通常のメソッド呼び出しと同じです。\n\n`nil.to_s` は空文字列 `\"\"` なので、長さは 0 です。\n"},{"id":91,"cat":"文法","topic":"defined?","q":"次のコードを実行するとどうなりますか。","code":"x = 1\n@v = 2\np defined?(x)\np defined?(y)\np defined?(puts)\np defined?(@v)\n","choices":["\"local-variable\"\nnil\n\"method\"\n\"instance-variable\"","\"local-variable\"\nfalse\n\"method\"\n\"instance-variable\"","true\nfalse\ntrue\ntrue","!3行目で `NameError` が発生する"],"answer":[0],"cm":true,"exp":"`defined?` は式が定義済みかを調べ、定義されていればその種類を表す文字列、未定義なら `nil` を返します。未定義の変数を渡してもエラーにはなりません。\n\nローカル変数は `\"local-variable\"`、メソッドは `\"method\"`、インスタンス変数は `\"instance-variable\"` です。\n"},{"id":92,"cat":"文法","topic":"文字列リテラルの連結・%q","q":"次のコードを実行するとどうなりますか。","code":"s = \"Ruby\" \" \" 'Silver'\nputs s\nname = \"R\"\nputs %q(#{name} 'ok')\nputs %Q(#{name} \"ok\")\n","choices":["Ruby Silver\n#{name} 'ok'\nR \"ok\"","Ruby Silver\nR 'ok'\nR \"ok\"","RubySilver\n#{name} 'ok'\n#{name} \"ok\"","!1行目で `SyntaxError` が発生する"],"answer":[0],"cm":true,"exp":"文字列リテラルを空白をはさんで並べると、1つの文字列として連結されます（シングルとダブルの混在も可）。\n\n`%q()` はシングルクォート相当（式展開なし）、`%Q()`（または `%()`）はダブルクォート相当（式展開あり）です。中でクォートをエスケープせずに書けるのが利点です。\n"},{"id":93,"cat":"文法","topic":"数値リテラル（Float・Rational）","q":"次のコードを実行するとどうなりますか。","code":"p 1e3\np 3r / 2\np 7.fdiv(2).class\np 10.0 == 10\n","choices":["1000.0\n(3/2)\nFloat\ntrue","1000\n1.5\nFloat\ntrue","1000.0\n1\nInteger\nfalse","1000.0\n(3/2)\nFloat\nfalse"],"answer":[0],"cm":true,"exp":"`1e3` は指数表記で、Float の `1000.0` です。`3r` は Rational（有理数）のリテラルで、`3r / 2` は `(3/2)` になります。\n\n`==` は値を比べるので `10.0 == 10` は `true` です（`eql?` なら `false`）。\n"},{"id":94,"cat":"文法","topic":"自己代入（&&=）","q":"次のコードを実行するとどうなりますか。","code":"a = 5\nb = nil\na &&= a + 1\nb &&= b + 1\np a, b\n","choices":["6\nnil","6\n1","5\nnil","!`NoMethodError` が発生する"],"answer":[0],"cm":true,"exp":"`a &&= x` は `a && (a = x)` と同じ意味で、`a` が真のときだけ代入します。\n\n`b` は `nil` なので右辺は評価されず、`nil + 1` によるエラーも起きません。\n"},{"id":95,"cat":"文法","topic":"多重代入（入れ替え・入れ子）","q":"次のコードを実行するとどうなりますか。","code":"a, b = 1, 2\na, b = b, a\nx, (y, z), w = 1, [2, 3], 4\np [a, b, y, w]\n","choices":["[2, 1, 2, 4]","[1, 2, 2, 4]","[2, 1, [2, 3], 4]","[2, 1, 2, 3]"],"answer":[0],"cm":true,"exp":"多重代入では右辺がすべて評価されてから代入されるので、`a, b = b, a` で値を入れ替えられます。\n\n左辺を `( )` で囲むと、対応する右辺の配列を分解して代入できます。`(y, z)` に `[2, 3]` が分解されて `y` は 2、`z` は 3 になります。\n"},{"id":96,"cat":"文法","topic":"グローバル変数","q":"次のコードを実行するとどうなりますか。","code":"$count = 0\ndef up\n  $count += 1\nend\n3.times { up }\np $count\n","choices":["3","0","!`NameError` が発生する","!`NoMethodError` が発生する"],"answer":[0],"cm":true,"exp":"`$` で始まるグローバル変数は、プログラムのどこからでも参照・変更できます。メソッドの中からも外側の値が見えるので、3回呼ぶと 3 になります。\n\nローカル変数（`count`）の場合は `def` の中から参照できず `NameError` になります。\n"},{"id":97,"cat":"文法","topic":"ブロックの結合（{} と do...end）","q":"次のコードを実行するとどうなりますか。","code":"p [1, 2].map { |x| x * 2 }\np [1, 2].map do |x| x * 2 end\n","choices":["[2, 4]\n#\u003cEnumerator: [1, 2]:map>","[2, 4]\n[2, 4]","#\u003cEnumerator: [1, 2]:map>\n[2, 4]","!2行目で `SyntaxError` が発生する"],"answer":[0],"cm":true,"exp":"`{ }` は直前のメソッド（`map`）と強く結びつきますが、`do ... end` は結びつきが弱く、外側のメソッド（`p`）に渡されます。\n\n2行目は `p([1, 2].map) do ... end` と解釈され、`map` はブロックなしで Enumerator を返し、`p` はそれを表示します（`p` に渡されたブロックは使われません）。\n"},{"id":98,"cat":"文法","topic":"ブロック引数の展開","q":"次のコードを実行するとどうなりますか。","code":"pairs = [[1, 2], [3, 4]]\npairs.each { |a, b| print a + b, \" \" }\nputs\npairs.each { |a| print a.inspect, \" \" }\n","choices":["3 7\n[1, 2] [3, 4]","3 7\n1 3","[1, 2] [3, 4]\n[1, 2] [3, 4]","!`ArgumentError` が発生する"],"answer":[0],"cm":true,"exp":"ブロック引数を2つ以上書いた場合、渡された配列は自動的に展開されて各引数に入ります（`a` に 1、`b` に 2）。\n\nブロック引数が1つだけなら展開されず、配列 `[1, 2]` がそのまま入ります。\n"},{"id":99,"cat":"文法","topic":"yieldと引数の数","q":"次のコードを実行するとどうなりますか。","code":"def two\n  yield 1, 2\nend\ntwo { |a| p a }\ntwo { |a, b, c| p [a, b, c] }\ntwo { |*a| p a }\n","choices":["1\n[1, 2, nil]\n[1, 2]","[1, 2]\n[1, 2, nil]\n[1, 2]","1\n[1, 2]\n[1, 2]","1\n[1, 2, nil]\n[[1, 2]]"],"answer":[0],"cm":true,"exp":"ブロックは Proc と同じく引数の数に寛容です。`yield` で渡した値が多ければ余りは捨てられ（`|a|` には 1 だけ）、足りなければ `nil` が入ります。\n\n`|*a|` のように可変長で受け取ると、渡された値がすべて配列になります。\n"},{"id":100,"cat":"文法","topic":"Procの呼び出し方","q":"__(1)__ に記述したとき、〔実行結果〕が出力されないもの（エラーになるもの）を1つ選択してください。","code":"add = proc { |a, b| a + b }\np __(1)__\n","result":"3","choices":["add.call(1, 2)","add.(1, 2)","add[1, 2]","add(1, 2)"],"answer":[3],"cm":true,"exp":"Proc は `call`、`.()`、`[]`（ほかに `yield`、`===`）で呼び出せます。\n\n`add(1, 2)` は `add` という名前の**メソッド**を呼ぼうとするため `NoMethodError` になります。変数に入れた Proc は、メソッドのように括弧だけでは呼び出せません。\n"},{"id":101,"cat":"文法","topic":"ブロック・lambda内のreturn","q":"次のコードを実行するとどうなりますか。","code":"def m1\n  [1, 2, 3].each { |x| return x * 10 if x == 2 }\n  0\nend\ndef m2\n  l = -> { return 5 }\n  l.call\n  0\nend\np m1, m2\n","choices":["20\n0","0\n0","20\n5","0\n5"],"answer":[0],"cm":true,"exp":"ブロック（や `proc`）の中の `return` は、そのブロックを定義したメソッド自体から抜けます。`m1` は `x` が 2 のときに `20` を返して終了します。\n\nlambda の中の `return` は lambda から抜けるだけなので、`m2` は次の行に進んで `0` を返します。\n"},{"id":102,"cat":"文法","topic":"デフォルト引数","q":"次のコードを実行するとどうなりますか。","code":"def area(w, h = w)\n  w * h\nend\np area(3), area(3, 4)\n","choices":["9\n12","!`NameError` が発生する","3\n12","nil\n12"],"answer":[0],"cm":true,"exp":"デフォルト値には任意の式を書けます。前にある引数を参照することもできるので、`h = w` とすれば `h` を省略したときに `w` と同じ値になります。\n"},{"id":103,"cat":"文法","topic":"引数の展開（* と **）","q":"次のコードを実行するとどうなりますか。","code":"def f(a, b, c)\n  a + b + c\nend\nnums = [1, 2]\np f(*nums, 3)\ndef g(x:, y: 0)\n  x - y\nend\nopts = { x: 10, y: 3 }\np g(**opts)\n","choices":["6\n7","!`ArgumentError` が発生する","6\n10","[1, 2, 3]\n7"],"answer":[0],"cm":true,"exp":"メソッド呼び出しで配列の前に `*` を付けると、要素が展開されて個別の引数として渡されます（`f(1, 2, 3)` と同じ）。\n\nハッシュの前に `**` を付けると、キーワード引数として展開されます（`g(x: 10, y: 3)` と同じ）。\n"},{"id":104,"cat":"文法","topic":"ハッシュを受け取る引数","q":"次のコードを実行するとどうなりますか。","code":"def show(opts = {})\n  p opts\nend\nshow(a: 1, b: 2)\nshow\n","choices":["{:a=>1, :b=>2}\n{}","[:a, 1, :b, 2]\n{}","{:a=>1, :b=>2}\nnil","!`ArgumentError` が発生する"],"answer":[0],"cm":true,"exp":"キーワード引数を定義していないメソッドに `a: 1, b: 2` の形で渡すと、最後の引数として1つのハッシュにまとめて渡されます。\n\n引数を省略した場合はデフォルト値の `{}` になります。\n"},{"id":105,"cat":"文法","topic":"セッターの戻り値","q":"次のコードを実行するとどうなりますか。","code":"class Box\n  def size=(v)\n    @size = v * 2\n    999\n  end\n  def size\n    @size\n  end\nend\nb = Box.new\np(b.size = 5)\np b.size\n","choices":["5\n10","999\n10","10\n10","5\n5"],"answer":[0],"cm":true,"exp":"`obj.size = 5` のような代入形式でセッターを呼ぶと、式の値はメソッドの戻り値ではなく、右辺の値（`5`）になります。メソッド内の `999` は使われません。\n\nセッター内で `@size` には `10` が入っています。\n"},{"id":106,"cat":"文法","topic":"メソッドの戻り値（nil）","q":"次のコードを実行するとどうなりますか。","code":"def a; end\ndef b\n  return\nend\ndef c\n  if false\n    1\n  end\nend\np a, b, c\n","choices":["nil\nnil\nnil","!`SyntaxError` が発生する","nil\nnil\nfalse","\"\"\nnil\nnil"],"answer":[0],"cm":true,"exp":"メソッドは最後に評価した式の値を返します。中身が空のメソッド、値を付けない `return`、条件が偽で `else` のない `if` は、どれも `nil` を返します。\n"},{"id":107,"cat":"文法","topic":"ensureとreturn","q":"次のコードを実行するとどうなりますか。","code":"def m\n  puts \"start\"\n  return 1\nensure\n  puts \"ensure\"\nend\np m\n","choices":["start\nensure\n1","start\n1","start\n1\nensure","start\nensure\nnil"],"answer":[0],"cm":true,"exp":"`def` の中に直接 `ensure` を書けます（`begin` は省略可）。`return` でメソッドを抜けるときも `ensure` 節は必ず実行されます。\n\n`ensure` 節の値は戻り値に影響しないので、戻り値は `return` した `1` です。\n"},{"id":108,"cat":"文法","topic":"rescue修飾子","q":"次のコードを実行するとどうなりますか。","code":"a = Integer(\"x\") rescue -1\nb = Integer(\"12\") rescue -1\np a, b\n","choices":["-1\n12","-1\n-1","nil\n12","!`ArgumentError` が発生する"],"answer":[0],"cm":true,"exp":"`式 rescue 値` の形（rescue 修飾子）は、式で `StandardError` が発生したときに右側の値を返します。\n\n`Integer(\"x\")` は `ArgumentError` になるので `-1`、`Integer(\"12\")` は成功するので `12` です。\n"},{"id":109,"cat":"文法","topic":"例外の発生（raise）","q":"次のコードを実行するとどうなりますか。","code":"begin\n  raise ArgumentError, \"bad value\"\nrescue => e\n  puts \"#{e.class}: #{e.message}\"\nend\n","choices":["ArgumentError: bad value","RuntimeError: bad value","StandardError: bad value","ArgumentError: ArgumentError"],"answer":[0],"cm":true,"exp":"`raise 例外クラス, メッセージ` で、指定したクラスの例外をメッセージ付きで発生させます。\n\n`rescue => e` で受け取った例外オブジェクトから、`class` でクラス、`message` でメッセージを取り出せます。\n"},{"id":110,"cat":"文法","topic":"独自の例外クラス","q":"次のコードを実行するとどうなりますか。","code":"class MyError \u003c StandardError; end\nclass FatalError \u003c Exception; end\nbegin\n  raise MyError, \"a\"\nrescue => e\n  puts \"1: #{e.message}\"\nend\nbegin\n  raise FatalError, \"b\"\nrescue => e\n  puts \"2: #{e.message}\"\nend\n","choices":["`1: a` と出力された後、`FatalError` でプログラムが異常終了する","`1: a` と `2: b` が出力される","何も出力されずに `MyError` で異常終了する","`2: b` だけが出力される"],"answer":[0],"cm":false,"exp":"クラス名を省略した `rescue` が捕捉するのは `StandardError` とそのサブクラスだけです。\n\n`MyError` は `StandardError` を継承しているので捕捉されますが、`Exception` を直接継承した `FatalError` は捕捉されず、プログラムが終了します。独自の例外は `StandardError` を継承して作るのが基本です。\n"},{"id":111,"cat":"文法","topic":"ゼロ除算","q":"次のコードを実行するとどうなりますか。","code":"p 1.0 / 0\nbegin\n  1 / 0\nrescue ZeroDivisionError => e\n  p e.class.superclass\nend\n","choices":["Infinity\nStandardError","!1行目で `ZeroDivisionError` が発生する","NaN\nStandardError","Infinity\nException"],"answer":[0],"cm":true,"exp":"Float を 0 で割ってもエラーにはならず、`Infinity`（無限大）になります。\n\n整数を整数の 0 で割ると `ZeroDivisionError` が発生します。`ZeroDivisionError` は `StandardError` のサブクラスです。\n"},{"id":112,"cat":"文法","topic":"rescueとelseの戻り値","q":"次のコードを実行するとどうなりますか。","code":"def parse(s)\n  Integer(s)\nrescue ArgumentError\n  0\nelse\n  100\nend\np parse(\"5\"), parse(\"x\")\n","choices":["100\n0","5\n0","5\n100","100\n100"],"answer":[0],"cm":true,"exp":"`rescue` 節と `else` 節がある場合、例外が発生しなければ `else` 節が実行され、その値が全体（ここではメソッド）の戻り値になります。\n\nそのため `parse(\"5\")` は `5` ではなく `100` を返します。例外が発生した `parse(\"x\")` は `rescue` 節の値 `0` です。\n"},{"id":113,"cat":"文法","topic":"catchとthrow","q":"次のコードを実行するとどうなりますか。","code":"r = catch(:done) do\n  10.times { |i| throw :done, i if i == 3 }\n  :never\nend\np r\n","choices":["3",":never",":done","nil"],"answer":[0],"cm":true,"exp":"`throw` を呼ぶと、同じタグ（ここでは `:done`）の `catch` ブロックまで一気に抜けます。`throw` の第2引数が `catch` の戻り値になります。\n\n多重ループから一度に抜けたいときに使えます（例外処理とは別の仕組みです）。\n"},{"id":114,"cat":"文法","topic":"マジックコメント","q":"次のコードを実行するとどうなりますか。","code":"# frozen_string_literal: true\ns = \"abc\"\nt = String.new(\"abc\")\nt \u003c\u003c \"d\"\np t\ns \u003c\u003c \"d\"\n","choices":["`\"abcd\"` と出力された後、`FrozenError` が発生する","`\"abcd\"` と出力され、エラーは発生しない","4行目で `FrozenError` が発生する","1行目で `SyntaxError` が発生する"],"answer":[0],"cm":false,"exp":"ファイルの先頭に `# frozen_string_literal: true` と書くと、そのファイル内の文字列リテラルはすべて凍結（freeze）されます。リテラルの `s` に `\u003c\u003c` すると `FrozenError` です。\n\n`String.new` で作った文字列はリテラルではないので凍結されず、変更できます。\n"},{"id":115,"cat":"文法","topic":"文字エンコーディング","q":"次のコードを実行するとどうなりますか。","code":"s = \"日本語\"\np s.size\np s.bytesize\np s.encoding\n","choices":["3\n9\n#\u003cEncoding:UTF-8>","9\n9\n#\u003cEncoding:UTF-8>","3\n3\n#\u003cEncoding:UTF-8>","3\n6\n#\u003cEncoding:Shift_JIS>"],"answer":[0],"cm":true,"exp":"Ruby のソースコードはデフォルトで UTF-8 として扱われます。`size`（`length`）は文字数、`bytesize` はバイト数を返します。UTF-8 では日本語は1文字3バイトなので、3文字で9バイトです。\n"},{"id":116,"cat":"文法","topic":"出力メソッドとnil・配列","q":"次のコードを実行するとどうなりますか。","code":"puts [1, [2, 3]]\nputs nil\np nil\nprint \"a\", \"b\", \"\\n\"\n","choices":["1\n2\n3\n\nnil\nab","[1, [2, 3]]\nnil\nnil\nab","1\n2\n3\nnil\nnil\nab","[1, [2, 3]]\n\nnil\nab"],"answer":[0],"cm":true,"exp":"`puts` に配列を渡すと、入れ子も平らにして要素を1行ずつ出力します。`puts nil` は空行を出力します。\n\n`p nil` は `nil` と表示します。`print` は複数の引数を区切りも改行もなしで続けて出力します。\n"},{"id":117,"cat":"文法","topic":"文字列と数値の演算","q":"次のコードを実行するとどうなりますか。","code":"p \"a\" + 1.to_s\np \"a\" * 2\np \"a\" + 1\n","choices":["`\"a1\"`、`\"aa\"` と出力された後、`TypeError` が発生する","`\"a1\"`、`\"aa\"`、`\"a1\"` と出力される","1行目で `TypeError` が発生する","`\"a1\"`、`\"a2\"` と出力された後、`TypeError` が発生する"],"answer":[0],"cm":false,"exp":"Ruby は文字列と数値を自動では変換しないので、`\"a\" + 1` は `TypeError` です。`to_s` で文字列にしてから連結します。\n\n`String#*` は文字列を指定回数くり返すメソッドなので、`\"a\" * 2` は `\"aa\"` です。\n"},{"id":118,"cat":"文法","topic":"文字列の比較","q":"次のコードを実行するとどうなりますか。","code":"p \"10\" \u003c \"9\"\np \"apple\" \u003c \"banana\"\np \"Z\" \u003c \"a\"\np \"abc\" \u003c=> \"abd\"\n","choices":["true\ntrue\ntrue\n-1","false\ntrue\nfalse\n-1","false\ntrue\ntrue\n1","true\ntrue\nfalse\n-1"],"answer":[0],"cm":true,"exp":"文字列は先頭から1文字ずつ文字コードで比較されます（辞書順）。`\"10\"` と `\"9\"` は1文字目の `\"1\"` と `\"9\"` で比べられるので `\"10\"` の方が小さくなります。\n\n大文字は小文字より文字コードが小さいので `\"Z\" \u003c \"a\"` は `true`。`\u003c=>` は小さければ `-1` を返します。\n"},{"id":119,"cat":"文法","topic":"大きな整数と浮動小数点","q":"次のコードを実行するとどうなりますか。","code":"x = 2 ** 64\np x\np x.class\np 0.1 + 0.2 == 0.3\n","choices":["18446744073709551616\nInteger\nfalse","1.8446744073709552e+19\nFloat\nfalse","18446744073709551616\nBignum\ntrue","18446744073709551616\nInteger\ntrue"],"answer":[0],"cm":true,"exp":"Ruby の整数は桁あふれせず、大きな値もそのまま `Integer` で扱えます（以前の `Bignum` / `Fixnum` は `Integer` に統合されています）。\n\nFloat は2進数の近似値なので、`0.1 + 0.2` は `0.30000000000000004` となり `0.3` と等しくなりません。\n"},{"id":120,"cat":"文法","topic":"基数の変換","q":"次のコードを実行するとどうなりますか。","code":"p 255.to_s(2)\np 255.to_s(16)\np \"ff\".to_i(16)\np \"11\".to_i(2)\n","choices":["\"11111111\"\n\"ff\"\n255\n3","11111111\nff\n255\n3","\"11111111\"\n\"FF\"\n255\n11","\"0b11111111\"\n\"0xff\"\n255\n3"],"answer":[0],"cm":true,"exp":"`Integer#to_s(基数)` は指定した基数の文字列に、`String#to_i(基数)` は指定した基数の文字列として整数に変換します。\n\n`to_s` の結果は接頭辞（`0b` や `0x`）の付かない文字列で、16進数は小文字になります。\n"},{"id":121,"cat":"文法","topic":"否定演算子","q":"次のコードを実行するとどうなりますか。","code":"a = true\nb = !a\nc = (not a)\np b, c, !!nil, !!0\n","choices":["false\nfalse\nfalse\ntrue","false\nfalse\nfalse\nfalse","false\ntrue\nfalse\ntrue","false\nfalse\nnil\n0"],"answer":[0],"cm":true,"exp":"`!` と `not` はどちらも真偽を反転します（`not` は優先順位が低い）。`!!` と2回反転すると、値を `true` / `false` に変換できます。\n\n`nil` は偽なので `!!nil` は `false`、`0` は真なので `!!0` は `true` です。\n"},{"id":122,"cat":"文法","topic":"演算子はメソッド","q":"次のコードを実行するとどうなりますか。","code":"p 1.+(2)\np 10.send(:-, 3)\np [1, 2].\u003c\u003c(3)\n","choices":["3\n7\n[1, 2, 3]","!1行目で `SyntaxError` が発生する","3\n-7\n[1, 2, 3]","3\n7\n[1, 2, [3]]"],"answer":[0],"cm":true,"exp":"Ruby の多くの演算子はメソッドとして定義されています。`1 + 2` は `1.+(2)` と同じで、`send` を使ってシンボルで呼び出すこともできます。\n\nそのため、自分のクラスで `+` や `==`、`\u003c\u003c` などを定義して使うこともできます。\n"},{"id":123,"cat":"文法","topic":"多重代入（*の位置）","q":"次のコードを実行するとどうなりますか。","code":"first, *rest = \"a,b,c\".split(\",\")\np first, rest\n*init, last = [1, 2, 3]\np init, last\n","choices":["\"a\"\n[\"b\", \"c\"]\n[1, 2]\n3","\"a\"\n\"b\"\n[1, 2]\n3","[\"a\"]\n[\"b\", \"c\"]\n[1, 2]\n[3]","\"a\"\n[\"b\", \"c\"]\n1\n[2, 3]"],"answer":[0],"cm":true,"exp":"`*` を付けた変数は、ほかの変数に割り当てた残りをすべて配列で受け取ります。先頭に付けた場合は「最後以外」、末尾に付けた場合は「先頭以外」を受け取ります。\n"},{"id":124,"cat":"文法","topic":"変数とメソッドの名前の衝突","q":"次のコードを実行するとどうなりますか。","code":"def foo\n  \"method\"\nend\np foo\nfoo = \"var\"\np foo\np foo()\n","choices":["\"method\"\n\"var\"\n\"method\"","\"method\"\n\"var\"\n\"var\"","\"var\"\n\"var\"\n\"method\"","!5行目で `SyntaxError` が発生する"],"answer":[0],"cm":true,"exp":"同じ名前のローカル変数とメソッドがある場合、代入より後ろでは変数が優先されます。代入の前ではメソッド呼び出しになります。\n\n`foo()` のように括弧を付けると、変数があってもメソッド呼び出しになります。\n"},{"id":125,"cat":"文法","topic":"実行されない代入","q":"次のコードを実行するとどうなりますか。","code":"if false\n  z = 1\nend\np z\n","choices":["nil","1","!`NameError` が発生する","false"],"answer":[0],"cm":true,"exp":"ローカル変数は、代入文が実行されたかではなく、パーサーが代入を見つけた時点で定義されます。代入が実行されなかった変数の値は `nil` です。\n\nそのため `NameError` にはならず、`nil` と出力されます。\n"},{"id":126,"cat":"文法","topic":"ブロックからのbreak","q":"次のコードを実行するとどうなりますか。","code":"r = [1, 2, 3, 4].each do |x|\n  break x * 100 if x == 3\nend\np r\nr2 = [1, 2].each { |x| x }\np r2\n","choices":["300\n[1, 2]","[1, 2, 3, 4]\n[1, 2]","300\n2","nil\n[1, 2]"],"answer":[0],"cm":true,"exp":"ブロックの中で `break` を使うと、ブロックを呼び出したメソッド（`each`）がその場で終了し、`break` に渡した値がメソッドの戻り値になります。\n\n最後まで `break` しなかった場合、`each` はレシーバ自身（`[1, 2]`）を返します。\n"},{"id":127,"cat":"組み込みライブラリ","topic":"String（sub / gsub）","q":"次のコードを実行するとどうなりますか。","code":"s = \"hello\"\np s.gsub(/[el]/, \"e\" => \"3\", \"l\" => \"1\")\np s.gsub(/l/) { |m| m.upcase }\np s.sub(/l+/, \"L\")\n","choices":["\"h311o\"\n\"heLLo\"\n\"heLo\"","\"h3llo\"\n\"heLlo\"\n\"heLlo\"","\"h311o\"\n\"heLLo\"\n\"heLLo\"","\"h311o\"\n\"heLlo\"\n\"heLo\""],"answer":[0],"cm":true,"exp":"`gsub` はマッチした部分をすべて置換し、`sub` は最初の1か所だけ置換します。\n\n置換後の文字列の代わりにハッシュを渡すと、マッチした文字列をキーとして値に置き換えます。ブロックを渡すと、ブロックの戻り値で置き換えます。`/l+/` は連続する `ll` 全体にマッチするので、`sub` の結果は `\"heLo\"` です。\n"},{"id":128,"cat":"組み込みライブラリ","topic":"String（count / squeeze / delete / tr）","q":"次のコードを実行するとどうなりますか。","code":"s = \"bookkeeper\"\np s.count(\"e\")\np s.squeeze\np s.delete(\"o\")\np s.tr(\"ok\", \"OK\")\n","choices":["3\n\"bokeper\"\n\"bkkeeper\"\n\"bOOKKeeper\"","3\n\"bookkeeper\"\n\"bkkeeper\"\n\"bOOKKeeper\"","1\n\"bokeper\"\n\"bokkeeper\"\n\"bOOKKeeper\"","3\n\"bokeper\"\n\"bkkeeper\"\n\"bOKkeeper\""],"answer":[0],"cm":true,"exp":"- `count(\"e\")` … 指定した文字が何回現れるか\n- `squeeze` … 連続する同じ文字を1文字にまとめる\n- `delete(\"o\")` … 指定した文字をすべて削除する\n- `tr(\"ok\", \"OK\")` … `o` を `O`、`k` を `K` に1文字ずつ置き換える\n"},{"id":129,"cat":"組み込みライブラリ","topic":"String（検索）","q":"次のコードを実行するとどうなりますか。","code":"s = \"ruby on rails\"\np s.index(\"r\")\np s.rindex(\"r\")\np s.index(\"x\")\np s.start_with?(\"ruby\"), s.end_with?(\"rail\")\n","choices":["0\n8\nnil\ntrue\nfalse","0\n8\n-1\ntrue\nfalse","1\n9\nnil\ntrue\nfalse","0\n8\nnil\ntrue\ntrue"],"answer":[0],"cm":true,"exp":"`index` は最初に見つかった位置、`rindex` は最後に見つかった位置を返します（先頭は 0）。見つからなければ `nil` です（`-1` ではありません）。\n\n`start_with?` / `end_with?` は指定した文字列で始まる・終わるかを返します。末尾は `rails` なので `end_with?(\"rail\")` は `false` です。\n"},{"id":130,"cat":"組み込みライブラリ","topic":"String（大文字・小文字）","q":"次のコードを実行するとどうなりますか。","code":"s = \"hELLO wORLD\"\np s.capitalize\np s.swapcase\np s.downcase.split.map(&:capitalize).join(\" \")\n","choices":["\"Hello world\"\n\"Hello World\"\n\"Hello World\"","\"HELLO wORLD\"\n\"Hello World\"\n\"Hello World\"","\"Hello World\"\n\"Hello World\"\n\"Hello World\"","\"Hello world\"\n\"HELLO WORLD\"\n\"Hello world\""],"answer":[0],"cm":true,"exp":"- `capitalize` … 先頭だけ大文字にし、残りはすべて小文字にする\n- `swapcase` … 大文字と小文字を入れ替える\n- `upcase` / `downcase` … すべて大文字 / 小文字にする\n\n単語ごとに先頭を大文字にしたいときは、`split` で分けてから `capitalize` します。\n"},{"id":131,"cat":"組み込みライブラリ","topic":"String#succ","q":"次のコードを実行するとどうなりますか。","code":"p \"az\".succ\np \"zz\".succ\np \"a9\".succ\np 9.succ\n","choices":["\"ba\"\n\"aaa\"\n\"b0\"\n10","\"b\"\n\"aa\"\n\"a10\"\n10","\"ba\"\n\"za\"\n\"b0\"\n10","\"aaa\"\n\"aaa\"\n\"b0\"\n\"10\""],"answer":[0],"cm":true,"exp":"`String#succ`（別名 `next`）は「次の」文字列を返します。末尾の文字を1つ進め、`z` や `9` を超えると繰り上がります（`\"az\"` → `\"ba\"`、`\"zz\"` → `\"aaa\"`、`\"a9\"` → `\"b0\"`）。\n\n`Integer#succ` は 1 を足した整数を返します。`(\"a\"..\"e\")` のような文字列の範囲もこの `succ` で要素を作っています。\n"},{"id":132,"cat":"組み込みライブラリ","topic":"String（文字単位の操作）","q":"次のコードを実行するとどうなりますか。","code":"s = \"ruby\"\np s.reverse\np s.chars.sort.join\np s.chars.map(&:ord).sum\n","choices":["\"ybur\"\n\"bruy\"\n450","\"ybur\"\n\"bruy\"\n\"ruby\"","\"ybur\"\n[\"b\", \"r\", \"u\", \"y\"]\n450","\"ruby\"\n\"bruy\"\n450"],"answer":[0],"cm":true,"exp":"`reverse` は文字を逆順にした文字列を返します。`chars` で1文字ずつの配列にすると、配列のメソッド（`sort`、`map` など）が使え、`join` で文字列に戻せます。\n\n`ord` は文字コードを返すので、`r`(114) + `u`(117) + `b`(98) + `y`(121) = 450 です。\n"},{"id":133,"cat":"組み込みライブラリ","topic":"String（部分の書き換え）","q":"次のコードを実行するとどうなりますか。","code":"s = \"Hello World\"\ns[0] = \"J\"\np s\nt = s.slice!(5..)\np s, t\n","choices":["\"Jello World\"\n\"Jello\"\n\" World\"","\"Jello World\"\n\"Jello World\"\n\" World\"","\"Hello World\"\n\"Hello\"\n\" World\"","\"Jello World\"\n\" World\"\n\"Jello\""],"answer":[0],"cm":true,"exp":"`s[位置] = 文字列` で、その部分を置き換えられます（破壊的）。\n\n`slice!` は指定した部分を取り出して返し、レシーバからはその部分を削除します。`slice`（`!` なし）なら取り出すだけでレシーバは変わりません。\n"},{"id":134,"cat":"組み込みライブラリ","topic":"String#split（空要素）","q":"次のコードを実行するとどうなりますか。","code":"p \"a,b,,c,,\".split(\",\")\np \"a,b,,c,,\".split(\",\", -1)\np \"a b  c\".split(\" \")\np \"a b  c\".split(/ /)\n","choices":["[\"a\", \"b\", \"\", \"c\"]\n[\"a\", \"b\", \"\", \"c\", \"\", \"\"]\n[\"a\", \"b\", \"c\"]\n[\"a\", \"b\", \"\", \"c\"]","[\"a\", \"b\", \"c\"]\n[\"a\", \"b\", \"c\"]\n[\"a\", \"b\", \"c\"]\n[\"a\", \"b\", \"c\"]","[\"a\", \"b\", \"\", \"c\", \"\", \"\"]\n[\"a\", \"b\", \"\", \"c\", \"\", \"\"]\n[\"a\", \"b\", \"c\"]\n[\"a\", \"b\", \"\", \"c\"]","[\"a\", \"b\", \"\", \"c\"]\n[\"a\", \"b\", \"\", \"c\", \"\", \"\"]\n[\"a\", \"b\", \"\", \"c\"]\n[\"a\", \"b\", \"\", \"c\"]"],"answer":[0],"cm":true,"exp":"`split` は途中の空文字列は残しますが、末尾の空文字列は取り除きます。第2引数に負の数を渡すと末尾の空文字列も残ります。\n\n区切りに半角空白1つの文字列 `\" \"` を渡したときだけ特別扱いで、連続する空白をまとめて区切ります。正規表現 `/ /` で区切ると、連続する空白の間に空文字列ができます。\n"},{"id":135,"cat":"組み込みライブラリ","topic":"MatchData（名前付きキャプチャ）","q":"次のコードを実行するとどうなりますか。","code":"m = \"2024-03-05\".match(/(?\u003cy>\\d+)-(?\u003cm>\\d+)-(?\u003cd>\\d+)/)\np m[:y]\np m[2]\np m.pre_match\np \"abc\".match?(/b/)\n","choices":["\"2024\"\n\"03\"\n\"\"\ntrue","\"2024\"\n\"2024\"\nnil\ntrue","2024\n3\n\"\"\n1","\"2024\"\n\"03\"\n\"\"\n1"],"answer":[0],"cm":true,"exp":"`(?\u003c名前>...)` で名前付きキャプチャを書くと、MatchData から `m[:名前]` で取り出せます。番号（`m[2]`）でも取り出せ、値は文字列です。\n\n`pre_match` はマッチした部分より前の文字列（ここでは空文字列）です。`match?` はマッチするかどうかだけを `true` / `false` で返します。\n"},{"id":136,"cat":"組み込みライブラリ","topic":"String#scan（グループあり）","q":"次のコードを実行するとどうなりますか。","code":"p \"a1b22c333\".scan(/[a-z]\\d+/)\np \"a1b22c333\".scan(/([a-z])(\\d+)/)\n","choices":["[\"a1\", \"b22\", \"c333\"]\n[[\"a\", \"1\"], [\"b\", \"22\"], [\"c\", \"333\"]]","[\"a1\", \"b22\", \"c333\"]\n[\"a\", \"1\", \"b\", \"22\", \"c\", \"333\"]","[\"a1\"]\n[[\"a\", \"1\"]]","[\"a1\", \"b22\", \"c333\"]\n[\"a1\", \"b22\", \"c333\"]"],"answer":[0],"cm":true,"exp":"`scan` はマッチした部分をすべて配列で返します。正規表現にグループ `()` が含まれる場合は、マッチ全体ではなく各グループの文字列をまとめた配列の配列を返します。\n"},{"id":137,"cat":"組み込みライブラリ","topic":"書式指定（配列・符号・指数）","q":"次のコードを実行するとどうなりますか。","code":"puts \"%s is %d years\" % [\"Ruby\", 31]\nputs \"
